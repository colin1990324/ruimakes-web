<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>无敌塔防 Invincible TD</title>
<style>
  :root{ --bg:#09090b; --fg:#e4e4e7; --dim:#71717a; --acc:#10b981; --red:#ef4444; --gold:#f59e0b; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Courier New", monospace; -webkit-user-select:none; user-select:none; touch-action:none; }
  #wrap{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; }
  /* ===== HUD ===== */
  #hud{ position:absolute; top:10px; left:10px; right:10px; display:flex; gap:14px; align-items:center;
    font-size:15px; letter-spacing:1px; text-shadow:0 1px 3px #000; pointer-events:none; z-index:5; }
  #hud .stat{ background:rgba(0,0,0,.55); border:1px solid #27272a; border-radius:6px; padding:4px 10px; }
  #hud .stat b{ color:var(--acc); }
  #hud .stat.red b{ color:var(--red); }
  #hud .stat.gold b{ color:var(--gold); }
  #hud .sp{ margin-left:auto; font-size:13px; color:var(--dim); }
  #waveBar{ position:absolute; bottom:10px; left:10px; right:10px; height:6px; background:rgba(0,0,0,.5);
    border:1px solid #27272a; border-radius:3px; overflow:hidden; z-index:5; }
  #waveBar i{ display:block; height:100%; width:0%; background:var(--acc); transition:width .2s; }
  /* ===== overlays ===== */
  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(9,9,11,.86); z-index:10; text-align:center; padding:20px; }
  .ov.hide{ display:none; }
  .ov h1{ font-size:44px; letter-spacing:6px; color:var(--acc); margin-bottom:8px; text-shadow:0 0 18px rgba(16,185,129,.5); }
  .ov h2{ font-size:26px; letter-spacing:4px; margin-bottom:18px; }
  .ov p{ font-size:14px; color:var(--dim); line-height:1.8; max-width:560px; margin-bottom:8px; }
  .ov .btn{ margin-top:14px; font-family:inherit; font-size:18px; letter-spacing:3px; padding:12px 40px;
    background:var(--acc); color:#04231a; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  .ov .btn:hover{ filter:brightness(1.15); }
  .ov .btn.ghost{ background:transparent; color:var(--fg); border:1px solid #3f3f46; }
  .ov .key{ display:inline-block; border:1px solid #52525b; border-radius:4px; padding:0 6px; background:#18181b; color:var(--fg); font-size:12px; }
  #monsterKey{ display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:center; margin-top:12px; font-size:13px; color:var(--dim); }
  #monsterKey .mk{ display:flex; align-items:center; gap:6px; }
  #monsterKey .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  /* ===== 波间奖励 ===== */
  #upgOv .upgs{ display:flex; gap:16px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  #upgOv .upg{ width:190px; padding:18px 14px; background:#18181b; border:2px solid #3f3f46; border-radius:12px;
    cursor:pointer; transition:all .15s; }
  #upgOv .upg:hover{ border-color:var(--acc); transform:translateY(-3px); box-shadow:0 6px 20px rgba(16,185,129,.2); }
  #upgOv .upg .num{ font-size:22px; color:var(--gold); font-weight:bold; }
  #upgOv .upg .tt{ font-size:15px; color:var(--fg); margin:6px 0 4px; }
  #upgOv .upg .ds{ font-size:12px; color:var(--dim); line-height:1.5; }
  /* ===== 选中塔信息 ===== */
  #towerInfo{ position:absolute; z-index:6; background:rgba(0,0,0,.7); border:1px solid #3f3f46;
    border-radius:8px; padding:8px 12px; font-size:13px; display:none; min-width:200px; }
  #towerInfo .row{ display:flex; justify-content:space-between; gap:18px; margin:2px 0; }
  #towerInfo .row b{ color:var(--acc); }
  #towerInfo .btnRow{ display:flex; gap:8px; margin-top:6px; }
  #towerInfo button{ font-family:inherit; font-size:12px; letter-spacing:1px; padding:4px 12px; border-radius:6px;
    background:#27272a; color:var(--fg); border:1px solid #3f3f46; cursor:pointer; }
  #towerInfo button.up{ background:var(--acc); color:#04231a; border:none; font-weight:bold; }
  #towerInfo button.sell{ background:transparent; color:var(--red); border-color:var(--red); }
  #towerInfo .tip{ font-size:11px; color:var(--dim); margin-top:4px; }
  #toast{ position:absolute; top:60px; left:50%; transform:translateX(-50%); z-index:8; font-size:14px; letter-spacing:2px;
    color:var(--fg); background:rgba(0,0,0,.75); border:1px solid #3f3f46; padding:6px 18px; border-radius:6px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show{ opacity:1; }
  #speedTag{ position:absolute; top:10px; right:10px; z-index:5; font-size:13px; color:var(--gold); background:rgba(0,0,0,.5);
    border:1px solid #52525b; border-radius:6px; padding:3px 10px; display:none; }
  #verStat{ font-size:12px; color:var(--dim); border-color:#3f3f46; }
  #verStat b{ color:#facc15; letter-spacing:1px; }
  .ov h1 .ver{ font-size:16px; color:var(--dim); letter-spacing:3px; margin-left:10px; vertical-align:middle; }
  /* Boss 血条 */
  #bossBar{ position:absolute; top:54px; left:50%; transform:translateX(-50%); width:min(420px,82%); z-index:6;
    display:none; text-align:center; pointer-events:none; }
  #bossBar .bb-name{ font-size:13px; color:#ef4444; letter-spacing:3px; text-shadow:0 1px 3px #000; margin-bottom:3px; }
  #bossBar .bb-track{ height:10px; background:rgba(0,0,0,.6); border:1px solid #7f1d1d; border-radius:5px; overflow:hidden; }
  #bossBar .bb-track i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#f59e0b,#ef4444);
    transition:width .15s; border-radius:4px; }
  /* 核弹按钮 */
  #nukeBtn{ position:absolute; top:54px; right:10px; z-index:6; background:rgba(0,0,0,.55); color:var(--gold);
    border:1px solid #7c5a10; border-radius:6px; padding:4px 12px; font-family:inherit; font-size:15px;
    letter-spacing:1px; cursor:pointer; }
  #nukeBtn:disabled{ opacity:.4; cursor:default; color:var(--dim); border-color:#3f3f46; }
  #nukeBtn b{ margin-left:4px; }
  /* 怪物图鉴(左侧头像列表 + 详情面板) */
  #mobList{ position:absolute; left:8px; top:50%; transform:translateY(-50%); z-index:6;
    display:flex; flex-direction:column; gap:7px; }
  #mobList .mob{ width:42px; height:42px; border-radius:50%; border:2px solid #3f3f46; background:#18181b;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; padding:0; }
  #mobList .mob:hover{ border-color:var(--acc); transform:scale(1.1); }
  #mobList .mob .dot{ width:20px; height:20px; border-radius:50%; display:block; }
  #mobList .mob.new{ border-color:var(--gold); box-shadow:0 0 10px rgba(245,158,11,.45); }
  #mobInfo{ position:absolute; left:60px; top:50%; transform:translateY(-50%); z-index:6; background:rgba(0,0,0,.85);
    border:1px solid #3f3f46; border-radius:10px; padding:12px 16px; font-size:13px; min-width:210px; display:none; }
  #mobInfo .mi-name{ font-size:16px; font-weight:bold; letter-spacing:2px; margin-bottom:6px; }
  #mobInfo .mi-row{ display:flex; justify-content:space-between; gap:16px; margin:3px 0; }
  #mobInfo .mi-row b{ color:var(--acc); }
  #mobInfo .mi-desc{ color:var(--dim); font-size:12px; line-height:1.6; margin-top:6px; border-top:1px solid #27272a; padding-top:6px; }
  @media (max-width:700px){ .ov h1{ font-size:30px; } .ov p{ font-size:12px; } #hud{ font-size:12px; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="stat gold" title="最高纪录">🏆 <b id="hBest">0</b></div>
  <div class="stat red">♥ <b id="hLives">20</b></div>
  <div class="stat gold">¤ <b id="hGold">150</b></div>
  <div class="stat">WAVE <b id="hWave">0</b></div>
  <div class="stat">👾 <b id="hCount">0</b></div>
  <div class="sp">[1]建塔 [2]升级 [3]出售 [ESC]取消 [空格]速度 [M]静音 [N]核弹</div>
  <div class="stat" id="verStat">v<b id="verTxt">0.1</b></div>
</div>
<div id="waveBar"><i id="waveFill"></i></div>
<div id="speedTag">2×</div>
<div id="bossBar"><div class="bb-name">👹 哥斯拉</div><div class="bb-track"><i id="bossFill"></i></div></div>
<button id="nukeBtn" title="核弹:消灭全图怪物 (N)" disabled>☢<b id="nukeCnt">0</b></button>
<div id="mobList"></div>
<div id="mobInfo"></div>
<div id="towerInfo"></div>
<div id="toast"></div>

<!-- 主菜单 -->
<div class="ov" id="menuOv">
  <h1>无敌塔防<span class="ver" id="verMenu">v0.1</span></h1>
  <p>INVINCIBLE TOWER DEFENSE</p>
  <p>怪物从左上角涌入,沿路径冲向基地。在空地建塔拦截它们!</p>
  <p><b style="color:#f59e0b">无尽模式</b>:波次无限加强,看你能守到第几波!</p>
  <p>塔可连续升级:<b style="color:#fff">箭塔 → 飞刀 → 机枪塔 → 导弹塔 → 激光塔</b></p>
  <div id="monsterKey"></div>
  <button class="btn" id="btnStart">开 始</button>
  <p style="margin-top:10px;font-size:11px;">最高纪录 <b id="bestShow" style="color:var(--gold)">-</b></p>
</div>

<!-- 波间奖励 -->
<div class="ov hide" id="upgOv">
  <h2>波次 <span id="upgWave">1</span> 击破!</h2>
  <p>选择一项奖励</p>
  <div class="upgs" id="upgBox"></div>
</div>

<!-- 游戏结束 -->
<div class="ov hide" id="overOv">
  <h2 style="color:var(--red)">基地沦陷</h2>
  <p>你守住了 <b id="overWave">0</b> 波</p>
  <p>最高纪录 <b id="overBest" style="color:var(--gold)">-</b></p>
  <button class="btn" id="btnRetry">再来一局</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ============================================================
 * 无敌塔防 Invincible TD — 2.5D 固定空中视角塔防
 * ============================================================ */

/* ---------- 基础工具 ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const dist2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};

/* ---------- 全局状态 ---------- */
const G={
  st:'menu',            // menu | play | upg | over | win
  wave:0, totalWaves:20,
  gold:150, lives:20, score:0,
  monsters:[], towers:[], bullets:[], fx:[], parts:[],
  spawnQ:[], spawnT:0,
  sel:null,             // 选中塔
  hover:null,           // hover 格子 [c,r]
  speed:1, muted:false,
  frame:0, time:0,
  build:false,          // 建塔模式(点击空地建箭塔)
  nukes:0,              // 核弹数量(每20关+1)
  seen:{},              // 已出现的怪物(图鉴)
};

/* ---------- 地图定义 ---------- */
const COLS=16, ROWS=10;
// 路径折返点(格子坐标),从出生到终点
const WAYPOINTS=[[0,0],[14,0],[14,2],[0,2],[0,4],[14,4],[14,6],[0,6],[0,8],[14,8],[14,9]];
const grid=[];           // grid[r][c]: '.' 空地 | '#' 路径 | 'R' 岩石 | 'S' 出生 | 'E' 终点
const PATH=[];           // 世界坐标路径点(格子中心)
(function buildGrid(){
  for(let r=0;r<ROWS;r++){ grid[r]=[]; for(let c=0;c<COLS;c++) grid[r][c]='.'; }
  for(let i=0;i<WAYPOINTS.length-1;i++){
    const [c1,r1]=WAYPOINTS[i],[c2,r2]=WAYPOINTS[i+1];
    const dc=Math.sign(c2-c1), dr=Math.sign(r2-r1);
    let c=c1,r=r1;
    for(;;){ grid[r][c]='#'; if(c===c2&&r===r2) break; c+=dc; r+=dr; }
  }
  grid[WAYPOINTS[0][1]][WAYPOINTS[0][0]]='S';
  const [ec,er]=WAYPOINTS[WAYPOINTS.length-1];
  grid[er][ec]='E';
  // 岩石(避开路径)
  const ROCK_SPOTS=[[2,0],[4,2],[7,0],[10,2],[13,0],[15,2],[2,6],[4,8],[6,6],[8,8],[11,6],[13,8],[15,6],[15,8],[1,9],[0,5],[15,0],[15,4],[3,4],[6,4]];
  for(const [c,r] of ROCK_SPOTS){ if(grid[r][c]==='.') grid[r][c]='R'; }
  // 世界坐标路径点(去重)
  const pushPt=(x,z)=>{ const last=PATH[PATH.length-1]; if(!last||last[0]!==x||last[2]!==z) PATH.push([x,0,z]); };
  for(let i=0;i<WAYPOINTS.length-1;i++){
    const [c1,r1]=WAYPOINTS[i],[c2,r2]=WAYPOINTS[i+1];
    const dc=Math.sign(c2-c1), dr=Math.sign(r2-r1);
    let c=c1,r=r1;
    for(;;){ pushPt(c+0.5,r+0.5); if(c===c2&&r===r2) break; c+=dc; r+=dr; }
  }
})();
// 格子坐标 → 世界(格子中心)
const cellWorld=(c,r)=>[c+0.5,0,r+0.5];
// 世界 → 格子
const worldCell=(x,z)=>{ const c=Math.floor(x), r=Math.floor(z); return (c>=0&&c<COLS&&r>=0&&r<ROWS)?[c,r]:null; };
// 该格子是否可建塔
const canBuild=(c,r)=>grid[r]&&grid[r][c]==='.';
// 路径总长(世界单位)
const PATH_LEN=(()=>{let L=0;for(let i=1;i<PATH.length;i++){const a=PATH[i-1],b=PATH[i];L+=Math.hypot(b[0]-a[0],b[2]-a[2]);}return L;})();

/* ---------- 怪物定义 ---------- */
const MON_DEFS=[
  {key:'g',  name:'格兰玛雅', hp:45,  spd:1.15, gold:5,  dmg:1, color:0x84cc16, r:0.42, desc:'基础小怪,成群出现'},
  {key:'bat',name:'蝙蝠怪',   hp:27,  spd:1.9,  gold:6,  dmg:1, color:0xa78bfa, r:0.34, dodge:0.3, desc:'高速,30% 闪避攻击'},
  {key:'b',  name:'布鲁',     hp:200, spd:0.95, gold:10, dmg:2, color:0x38bdf8, r:0.5,  desc:'精英,皮糙肉厚'},
  {key:'a',  name:'装甲兽',   hp:143, spd:0.7,  gold:14, dmg:2, color:0x94a3b8, r:0.52, armor:0.3, desc:'30% 减伤,导弹激光无视'},
  {key:'s',  name:'分裂怪',   hp:63,  spd:1.05, gold:10, dmg:1, color:0xf472b6, r:0.4,  split:true, desc:'死亡分裂为 3 只小怪'},
  {key:'boss',name:'哥斯拉',  hp:6000,spd:0.42, gold:150,dmg:5, color:0xdc2626, r:0.9,  boss:true, desc:'每 5 波降临,血越少越狂暴'},
];
const MON_BY={}; MON_DEFS.forEach((d,i)=>MON_BY[d.key]=d);

/* ---------- 塔定义(5级升级链) ---------- */
const TOWER_DEFS=[
  {lv:1, name:'箭塔',   cost:50,  range:3.0, rate:1.1, dmg:12, color:0x10b981, tip:'基础远程,单体射击'},
  {lv:2, name:'飞刀塔', cost:40,  range:3.3, rate:1.3, dmg:20, color:0x34d399, tip:'更快更疼,单体'},
  {lv:3, name:'机枪塔', cost:70,  range:3.2, rate:6.0, dmg:7,  color:0xfbbf24, tip:'高速连射,单体'},
  {lv:4, name:'导弹塔', cost:120, range:4.6, rate:0.8, dmg:48, color:0xf97316, tip:'抛物线溅射,无视护甲'},
  {lv:5, name:'激光塔', cost:200, range:5.8, rate:2.2, dmg:30, color:0xef4444, tip:'穿透光束,灼烧整列'},
];
const SELL_RATIO=0.7;

/* ---------- 波次表(前20波手工设计,20波后 waveSeq 程序化无限生成) ---------- */
const WAVES=[
  {boss:false, seq:'g8'},
  {boss:false, seq:'g12'},
  {boss:false, seq:'g8 bat5'},
  {boss:false, seq:'g13 bat8'},
  {boss:true,  seq:'g10 boss1'},
  {boss:false, seq:'b6 g10'},
  {boss:false, seq:'g15 bat10 a4'},
  {boss:false, seq:'b10 s5'},
  {boss:false, seq:'g19 a6 bat8'},
  {boss:true,  seq:'s8 a5 boss1'},
  {boss:false, seq:'b13 s8'},
  {boss:false, seq:'a10 s10 bat10'},
  {boss:false, seq:'b15 g13 a5'},
  {boss:false, seq:'s13 a10 b10'},
  {boss:true,  seq:'a8 s10 b8 boss1'},
  {boss:false, seq:'b15 s13 a8 bat10'},
  {boss:false, seq:'a13 s15 b13'},
  {boss:false, seq:'b18 s15 a10 g15'},
  {boss:false, seq:'s18 a15 b15 bat13'},
  {boss:true,  seq:'b13 s13 a13 bat10 boss1'},
];
// 无限波次生成:20 波后每波按比例加强(每 5 波一个难度档,数量递增)
function waveSeq(n){
  if(n<=WAVES.length) return WAVES[n-1].seq;
  const k=n-WAVES.length;      // 21 起 k=1
  const m=Math.floor((k-1)/5); // 难度档(每 5 波 +1)
  const sub=(k-1)%5;
  if(sub===4){
    // Boss 波:杂兵随档位递增
    const g=12+m*4, s=8+m*4, a=8+m*4, b=9+m*4, bat=10+m*4;
    return 'g'+g+' s'+s+' a'+a+' b'+b+' bat'+bat+' boss1';
  } else {
    const g=15+m*5+sub*3, s=7+m*4+sub*2, a=7+m*4+sub, b=8+m*4+sub, bat=9+m*4+sub;
    return 'g'+g+' s'+s+' a'+a+' b'+b+' bat'+bat;
  }
}

/* ---------- Three 场景 ---------- */
const canvas=$('cv');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0e14);
scene.fog=new THREE.Fog(0x0a0e14,26,42);

// 固定 2.5D 空中视角
const cam=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100);
const CAM_POS=[7.5,17.5,14.5];
cam.position.set(...CAM_POS);
cam.lookAt(7.5,0,4.5);

// 灯光
const sun=new THREE.DirectionalLight(0xfff5e0,1.0);
sun.position.set(10,22,6);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12; sun.shadow.camera.right=27;
sun.shadow.camera.top=20;  sun.shadow.camera.bottom=-10;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x8899bb,0.75));
const hemi=new THREE.HemisphereLight(0xbdd8ff,0x3a4a3a,0.35);
scene.add(hemi);

// 地面
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(COLS+0.5,ROWS+0.5),
  new THREE.MeshLambertMaterial({color:0x1e293b})
);
ground.rotation.x=-Math.PI/2; ground.position.set(7.5,0,4.5); ground.receiveShadow=true;
scene.add(ground);

// 地图外围(更深的地)
const outer=new THREE.Mesh(
  new THREE.PlaneGeometry(36,24),
  new THREE.MeshLambertMaterial({color:0x111827})
);
outer.rotation.x=-Math.PI/2; outer.position.set(7.5,-0.02,4.5);
scene.add(outer);

// 路径带(深土色;沿路径法线偏移生成带状,横向/竖向段全部正确覆盖——
// 旧实现上/下边界统一 x+0.5,竖段带子整体右偏 0.5 格导致竖路没颜色;
// ShapeGeometry rotation.x=-π/2 时局部 y 映射世界 -z,shape.y 取 -z)
(function buildPathMesh(){
  // 每个路径点的左右边缘(法线偏移 ±0.5)
  const L=[], R=[];
  for(let i=0;i<PATH.length;i++){
    const prev=PATH[Math.max(0,i-1)], next=PATH[Math.min(PATH.length-1,i+1)];
    let dx=next[0]-prev[0], dz=next[2]-prev[2];
    const len=Math.hypot(dx,dz)||1;
    dx/=len; dz/=len;
    const nx=-dz, nz=dx; // 左法线
    L.push([PATH[i][0]+nx*0.5, PATH[i][2]+nz*0.5]);
    R.push([PATH[i][0]-nx*0.5, PATH[i][2]-nz*0.5]);
  }
  const shape=new THREE.Shape();
  shape.moveTo(L[0][0],-L[0][1]);
  for(let i=0;i<L.length;i++) shape.lineTo(L[i][0],-L[i][1]);
  for(let i=R.length-1;i>=0;i--) shape.lineTo(R[i][0],-R[i][1]);
  shape.lineTo(L[0][0],-L[0][1]);
  const pathMesh=new THREE.Mesh(
    new THREE.ShapeGeometry(shape),
    new THREE.MeshLambertMaterial({color:0x8a7355})
  );
  pathMesh.rotation.x=-Math.PI/2;
  pathMesh.position.y=0.01;
  pathMesh.receiveShadow=true;
  scene.add(pathMesh);
})();

function spawnMonster(key,hpMul,mini,pos){
  const def=MON_BY[key];
  const hp=(mini?def.hp*0.5:def.hp)*(mini?1:hpMul);
  const m={
    key,def,mini:!!mini,
    hp,maxHp:hp,
    spd:def.spd*(1+Math.min(0.8,(G.wave-1)*0.025)),
    gold:def.gold,
    seg:0,pos:pos?[pos[0],0,pos[2]]:[PATH[0][0],0,PATH[0][2]],
    done:false,dead:false,flash:0,sprint:0,sprintCd:0,slowT:0,slowF:1,
    hitCd:0,
  };
  m.grp=monModel(def,mini);
  scene.add(m.grp);
  // 怪物首次出现 → 左侧图鉴加头像
  if(!mini&&!G.seen[key]){ G.seen[key]=true; addMobAvatar(key); }
  G.monsters.push(m);
  return m;
}

function moveMonsters(dt){
  for(const m of G.monsters){
    if(m.done||m.dead) continue;
    m.flash=Math.max(0,m.flash-dt);
    if(m.hitCd>0) m.hitCd-=dt;
    if(m.sprint>0) m.sprint-=dt;
    if(m.slowT>0){ m.slowT-=dt; if(m.slowT<=0) m.slowF=1; }
    let spd=m.spd*m.slowF*(m.sprint>0?4:1);
    if(!m.def.boss&&m.hp<m.maxHp*0.3) spd*=1.4; // 濒死狂暴冲锋(普通怪残血加速冲塔)
    let remain=spd*dt;
    while(remain>0&&m.seg<PATH.length-1){
      const a=PATH[m.seg], b=PATH[m.seg+1];
      const dx=b[0]-a[0], dz=b[2]-a[2];
      const segLen=Math.hypot(dx,dz)||1;
      const proj=(m.pos[0]-a[0])*dx+(m.pos[2]-a[2])*dz;
      const toEnd=segLen-proj;
      if(toEnd<=remain){ remain-=toEnd; m.seg++; m.pos[0]=b[0]; m.pos[2]=b[2]; }
      else { const f=remain/segLen; m.pos[0]+=dx*f; m.pos[2]+=dz*f; remain=0; }
    }
    if(m.seg>=PATH.length-1){ m.done=true; continue; }
    // 面向移动方向
    const a=PATH[m.seg], b=PATH[m.seg+1];
    const ang=Math.atan2(b[2]-a[2],b[0]-a[0]);
    m.grp.rotation.y=ang;
    // 模型位置 + 受伤闪白(模型内部从 y=0 贴地堆叠)
    const g=m.grp;
    g.position.set(m.pos[0],0,m.pos[2]);
    if(m.flash>0&&!m.flashOn){ m.flashOn=true; g.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive)o.material.emissive.set(0xffffff);}); }
    else if(m.flash<=0&&m.flashOn){ m.flashOn=false; g.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive)o.material.emissive.set(0x000000);}); }
    // 哥斯拉冲刺残留特效
    if(m.sprint>0&&m.def.boss&&G.frame%3===0) dust(m.pos[0],m.pos[2]);
  }
}

function hitMonster(m,dmg,opt){
  opt=opt||{};
  if(m.dead||m.done) return 'dead';
  // 闪避(蝙蝠怪)
  if(m.def.dodge&&!opt.bypassDodge&&Math.random()<m.def.dodge){
    toast(m.def.name+' 闪避!',0xffffff); return 'dodge';
  }
  let d=dmg;
  if(m.def.armor&&!opt.ignoreArmor) d*=1-m.def.armor;
  m.hp-=d;
  m.flash=0.1;
  // 哥斯拉狂暴冲刺:每损 20% 血触发(80% 阈值,4 倍速 2.5 秒,cd 4)
  if(m.def.boss&&m.sprintCd<=0&&m.hp<m.maxHp*0.8&&m.hp>0){
    m.sprint=2.5; m.sprintCd=4;
    dust(m.pos[0],m.pos[2],8);
    toast('哥斯拉狂暴冲刺!',0xef4444);
  }
  if(m.hp<=0) killMonster(m);
  return 'hit';
}

function killMonster(m,opt){
  opt=opt||{};
  if(m.dead) return;
  m.dead=true;
  const i=G.monsters.indexOf(m);
  if(i>=0) G.monsters.splice(i,1);
  scene.remove(m.grp);
  G.gold+=m.def.gold;
  G.score+=Math.round(m.def.gold*10*(m.def.boss?10:1));
  // 死亡粒子已取消(用户反馈多次死亡后卡顿,直接移除最重负载源)
  if(m.def.boss&&G.st==='play'){
    const n=G.wave+5;
    if(n<=G.totalWaves){ toast('哥斯拉被击败!第 '+n+' 波再会',0xdc2626); }
    else toast('哥斯拉被击败!',0xdc2626);
  }
  if(m.def.split&&!m.mini&&!opt.noSplit){
    // 从死亡位置就地分裂(不重新走出生点,威胁才真实)
    for(let i=0;i<3;i++){
      const nm=spawnMonster('s',1,true,[m.pos[0]+rnd(-0.35,0.35),0,m.pos[2]+rnd(-0.35,0.35)]);
      nm.seg=m.seg; // 继承父怪所在路径段
    }
  }
}

/* ---------- 波次系统 ---------- */
function parseSeq(seq){
  const q=[];
  for(const part of seq.split(' ')){
    const m=part.match(/^([a-z]+)(\d+)$/);
    if(m) for(let i=0;i<+m[2];i++) q.push(m[1]);
  }
  return q;
}
function startWave(n){
  G.wave=n;
  G.spawnQ=parseSeq(waveSeq(n));
  G.spawnT=0.8;
  G.monsters.forEach(m=>{m.done=true;});
  G.monsters=[]; // 清理残留(波间不会有残留,防御)
  $('hWave').textContent=n;
  updateWaveBar();
}
function updateSpawning(dt){
  if(!G.spawnQ.length) return;
  G.spawnT-=dt;
  if(G.spawnT<=0){
    const key=G.spawnQ.shift();
    const hpMul=1+0.375*(G.wave-1)+(key==='boss'?(G.wave-1)*0.08:0);
    spawnMonster(key,hpMul);
    G.spawnT=Math.max(0.12,0.8-Math.min(0.4,(G.wave-1)*0.025));
  }
}
function waveCleared(){
  return G.spawnQ.length===0&&G.monsters.length===0;
}

/* ---------- 特效:粒子爆发/灰尘 ---------- */
const MAXPARTS=300;
// 粒子材质按颜色缓存(踩过坑:每次死亡 new 材质 → 大量死亡后 WebGL 程序/材质对象堆积卡死)
const PART_MATS={};
function partMat(color){
  if(!PART_MATS[color]) PART_MATS[color]=new THREE.MeshBasicMaterial({color});
  return PART_MATS[color];
}
function burst(x,z,color,n){
  if(G.parts.length>MAXPARTS) return;
  const mat=partMat(color);

/* ---------- 目标选择:射程内路径进度最大(最接近终点) ---------- */
function findTarget(t,def){
  let best=null,bestProg=-1;
  for(const m of G.monsters){
    if(m.dead||m.done) continue;
    const dx=m.pos[0]-t.x, dz=m.pos[2]-t.z;
    if(dx*dx+dz*dz>def.range*def.range) continue;
    // 进度 = 已走路径比例(seg 为主,段内进度为辅)
    let prog=m.seg;
    if(m.seg<PATH.length-1){
      const a=PATH[m.seg], b=PATH[m.seg+1];
      const segLen=Math.hypot(b[0]-a[0],b[2]-a[2])||1;
      prog+=( (m.pos[0]-a[0])*(b[0]-a[0])+(m.pos[2]-a[2])*(b[2]-a[2]) )/segLen;
    }
    if(prog>bestProg){ bestProg=prog; best=m; }
  }
  return best;
}

/* ---------- 子弹 ---------- */
const GEO_BULLET=new THREE.SphereGeometry(0.09,6,6);
const BULLET_MATS={};
const TRAIL_MAT=new THREE.MeshBasicMaterial({color:0xffd27a});
function bulletMat(color){
  if(!BULLET_MATS[color]) BULLET_MATS[color]=new THREE.MeshBasicMaterial({color});
  return BULLET_MATS[color];
}
function fireBullet(t,def,target,spd,color,splashR,ignoreArmor,grav){
  const sx=t.x, sz=t.z;
  const dx=target.pos[0]-sx, dz=target.pos[2]-sz;
  const d=Math.hypot(dx,dz)||1;
  const b={
    x:sx,y:1.05,z:sz,
    vx:dx/d*spd, vz:dz/d*spd,
    dmg:def.dmg, spd, life:def.range/spd+1.2,
    color, splashR:!!splashR, ignoreArmor:!!ignoreArmor, grav:grav||0,
    target,
  };
  const mesh=new THREE.Mesh(GEO_BULLET,bulletMat(color));
  const s=splashR?0.16:0.11;
  mesh.scale.set(s,s,s);
  b.mesh=mesh;
  scene.add(mesh);
  G.bullets.push(b);
}
function removeBullet(b){
  const i=G.bullets.indexOf(b);
  if(i>=0) G.bullets.splice(i,1);
  scene.remove(b.mesh);
  if(b.trail&&b.trail.parent){ scene.remove(b.trail); }
}
function updateBullets(dt){
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.life-=dt;
    if(b.life<=0){ removeBullet(b); continue; }
    if(b.target&&!b.target.dead&&!b.target.done){
      const tx=b.target.pos[0], tz=b.target.pos[2];
      const dx=tx-b.x, dz=tz-b.z;
      const d=Math.hypot(dx,dz)||1;
      const wantX=dx/d*b.spd, wantZ=dz/d*b.spd;
      b.vx=lerp(b.vx,wantX,dt*3.2);
      b.vz=lerp(b.vz,wantZ,dt*3.2);
    }
    b.x+=b.vx*dt; b.z+=b.vz*dt;
    if(b.grav){ b.y-=b.grav*dt; b.y=Math.max(0.35,b.y); }
    b.mesh.position.set(b.x,b.y,b.z);
    if(b.splashR){
      // 尾迹光点(独立材质缓存,不干扰共享 bulletMat)
      if(G.frame%3===0){
        const tr=new THREE.Mesh(GEO_BULLET,TRAIL_MAT);
        tr.scale.set(0.07,0.07,0.07);
        tr.position.set(b.x,0.4,b.z);
        scene.add(tr);
        tr.userData={life:0.25,max:0.25,fade:true};
        G.fx.push(tr);
      }
    }
    // 命中检测
    let hit=false;
    for(const m of G.monsters){
      if(m.dead||m.done) continue;
      const dx=m.pos[0]-b.x, dz=m.pos[2]-b.z;
      const rr=m.def.r+(b.splashR?0.45:0.22);
      if(dx*dx+dz*dz<rr*rr){
        if(b.splashR){
          for(const m2 of G.monsters){
            if(m2.dead||m2.done) continue;
            if(dist2(m2.pos[0],m2.pos[2],b.x,b.z)<b.splashR*b.splashR){
              hitMonster(m2,b.dmg,{ignoreArmor:b.ignoreArmor});
            }
          }
          explodeFx(b.x,b.z,b.color);
          sfx('boom');
        } else {
          hitMonster(m,b.dmg);
        }
        hit=true;
        break;
      }
    }
    if(hit) removeBullet(b);
  }
}

/* ---------- 激光(穿透光束) ---------- */
// 光束材质按颜色缓存(避免每发 new 材质堆积)
const LASER_MATS={};
function laserMat(color){
  if(!LASER_MATS[color]) LASER_MATS[color]=new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9});
  return LASER_MATS[color];
}
function laserAttack(t,def,target){
  const ang=Math.atan2(target.pos[0]-t.x,target.pos[2]-t.z);
  const sx=t.x, sz=t.z;
  const cosA=Math.cos(ang), sinA=Math.sin(ang);
  let hitAny=false;
  for(const m of G.monsters){
    if(m.dead||m.done) continue;
    const dx=m.pos[0]-sx, dz=m.pos[2]-sz;
    const along=dx*cosA+dz*sinA;
    if(along<0||along>def.range) continue;
    const perp=Math.abs(-dx*sinA+dz*cosA);
    if(perp<0.5+m.def.r*0.7){
      hitMonster(m,def.dmg);
      hitAny=true;
    }
  }
  // 光束视觉(几何每次 new 但 0.12s 后 dispose;材质缓存复用)
  const endX=sx+Math.cos(ang)*def.range, endZ=sz+Math.sin(ang)*def.range;
  const geom=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(sx,1.0,sz), new THREE.Vector3(endX,0.6,endZ)
  ]);
  const line=new THREE.Line(geom,laserMat(def.color));
  scene.add(line);
  line.userData={life:0.12,max:0.12,fade:true};
  G.fx.push(line);
  sfx('laser');
  return hitAny;
}

/* ---------- 塔开火分发 ---------- */
function fireTower(t,def,target){
  t.rotY=Math.atan2(target.pos[0]-t.x,target.pos[2]-t.z);
  const lv=t.lv;
  if(lv===1){ fireBullet(t,def,target,13,def.color); sfx('arrow'); }
  else if(lv===2){ fireBullet(t,def,target,16,def.color); sfx('arrow'); }
  else if(lv===3){ fireBullet(t,def,target,21,def.color); sfx('mg'); }
  else if(lv===4){ fireBullet(t,def,target,9,0xf97316,1.5,true,6); sfx('missile'); }
  else if(lv===5){ laserAttack(t,def,target); }
}
function updateTowers(dt){
  for(const t of G.towers){
    t.cd-=dt;
    const base=TOWER_DEFS[t.lv-1];
    const def={
      name:base.name,color:base.color,cost:base.cost,tip:base.tip,
      dmg:Math.round(base.dmg*(G.dmgMul||1)),
      rate:base.rate*(G.rateMul||1),
      range:base.range*(G.rangeMul||1),
    };
    const target=findTarget(t,def);
    if(target){
      if(t.cd<=0){ t.cd=1/def.rate; fireTower(t,def,target); }
    }
    if(t.turret){
      const ang=target?Math.atan2(target.pos[0]-t.x,target.pos[2]-t.z):t.rotY;
      t.turret.rotation.y=ang;
    }
  }
}

function explodeFx(x,z,color){
  burst(x,z,color,8);
  if(G.fx.length>24) return;
  const flash=new THREE.Mesh(GEO_SPHERE,bulletMat(0xffe9a8));
  flash.scale.set(0.3,0.3,0.3);
  flash.position.set(x,0.55,z);
  flash.userData={life:0.18,max:0.18,flash:true};

function updateFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){
    const f=G.fx[i];
    f.userData.life-=dt;
    if(f.userData.life<=0){
      scene.remove(f);
      if(f.geometry) f.geometry.dispose();
      G.fx.splice(i,1);
      continue;
    }
    if(f.userData.flash){
      const s=0.3+0.5*(1-f.userData.life/f.userData.max);
      f.scale.set(s,s,s);
    } else if(f.userData.ring){
      const k=1-f.userData.life/f.userData.max;
      const s=1+k*26;
      f.scale.set(s,s*0.12,s);
      f.material.opacity=0.85*(1-k);
    } else if(f.userData.fade&&f.material&&f.material.opacity!==undefined){
      f.material.opacity=Math.max(0,f.userData.life/f.userData.max*0.9);
    }
  }
}

/* ============================================================
 * 音效(WebAudio 合成)
 * ============================================================ */
let AC=null;
const SND={
  arrow:[880,0.06,'square'], mg:[440,0.03,'square'], missile:[160,0.32,'sawtooth'],
  boom:[85,0.35,'sine'], laser:[1100,0.14,'sawtooth'], build:[520,0.08,'triangle'],
  upgrade:[660,0.12,'triangle'], sell:[330,0.09,'triangle'], hit:[190,0.06,'sine'],
  coin:[990,0.07,'square'], select:[700,0.05,'triangle'], lose:[150,0.5,'sine'],
  win:[523,0.4,'triangle'], start:[392,0.16,'triangle'],
};
function sfx(kind){
  if(G.muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const c=SND[kind]||SND.arrow;
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type=c[2]; o.frequency.setValueAtTime(c[0],AC.currentTime);
    g.gain.setValueAtTime(0.1,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+c[1]);
    o.start(); o.stop(AC.currentTime+c[1]+0.02);
  }catch(e){}
}

function waveTotalCount(seq){

function updateWaveBar(){

  const total=waveTotalCount(waveSeq(G.wave));
  const left=G.spawnQ.length;
  $('waveFill').style.width=(100*(1-left/total)).toFixed(1)+'%';
}

  if(list.querySelector&&list.querySelector('[data-mob="'+key+'"]')) return;
  const div=document.createElement('div');
  div.className='mob new';
  div.setAttribute('data-mob',key);
  div.innerHTML='<span class="dot" style="background:#'+def.color.toString(16).padStart(6,'0')+'"></span>';
  div.title=def.name;
  div.onclick=()=>showMobInfo(key);
  list.appendChild(div);
  toast('新怪物:'+def.name+'!点击左侧头像查看情报',def.color);
}
function showMobInfo(key){
  const def=MON_BY[key];
  const el=$('mobInfo');
  let skill=def.desc;
  if(def.boss) skill='每 5 波降临,血量低于 80% 触发狂暴冲刺(4倍速,持续 2.5 秒)';
  el.innerHTML=
    '<div class="mi-name" style="color:#'+def.color.toString(16).padStart(6,'0')+'">'+def.name+'</div>'+
    '<div class="mi-row"><span>❤ 血量</span><b>'+def.hp+'</b></div>'+
    '<div class="mi-row"><span>⚡ 速度</span><b>'+def.spd+' 格/s</b></div>'+
    '<div class="mi-row"><span>💀 伤害</span><b>'+def.dmg+'</b></div>'+
    '<div class="mi-row"><span>🪙 赏金</span><b>'+def.gold+'¤</b></div>'+
    '<div class="mi-desc">'+skill+'</div>';
  el.style.display='block';
}
function hideMobInfo(){ $('mobInfo').style.display='none'; }

/* ---------- 核弹(每通过 20 关获得一枚,消灭全图怪物) ---------- */
const NUKE_MAT=new THREE.MeshBasicMaterial({color:0xfff3c4,transparent:true,opacity:0.85});
function nukeFx(){
  // 冲击波环(水平圆盘膨胀淡出)+ 蘑菇云粒子(限流)
  if(G.fx.length<28){
    const ring=new THREE.Mesh(GEO_CYL,NUKE_MAT);
    ring.rotation.x=Math.PI/2;
    ring.scale.set(0.2,0.2,0.2);
    ring.position.set(7.5,0.35,4.5);
    ring.userData={life:0.7,max:0.7,ring:true};
    scene.add(ring);
    G.fx.push(ring);
  }
  burst(7.5,4.5,0xffb84d,14);
  dust(7.5,4.5,12);
}
function useNuke(){
  if(G.st!=='play'||G.nukes<=0) return;
  G.nukes--;
  const n=G.monsters.length;
  for(const m of [...G.monsters]){ killMonster(m,{noSplit:true}); }
  nukeFx();
  sfx('boom');
  toast('☢ 核弹!消灭 '+n+' 只怪物',0xf59e0b);
  updateHUD();
}
function nextWaveOrWin(){
  startWave(G.wave+1);
  updateHUD();
}

/* ---------- 胜负 ---------- */
function saveBest(){
  if(G.wave>G.best.wave||(G.wave===G.best.wave&&G.score>G.best.score)){
    G.best={wave:G.wave,score:G.score};
    try{ localStorage.setItem(BEST_KEY,JSON.stringify(G.best)); }catch(e){}
  }
}
function gameOver(){
  G.st='over';
  $('bossBar').style.display='none';
  saveBest();
  $('overWave').textContent=G.wave;
  $('overBest').textContent=G.best.wave>0?('第 '+G.best.wave+' 波 · '+G.best.score+' 分'):'无';
  $('overOv').classList.remove('hide');
  sfx('lose');
}
function winGame(){} // 无尽模式无胜利,保留空壳防引用报错
function startGame(){
  G.monsters.forEach(m=>scene.remove(m.grp)); G.monsters=[];
  G.towers.forEach(t=>scene.remove(t.grp)); G.towers=[];
  G.bullets.forEach(b=>scene.remove(b.mesh)); G.bullets=[];
  G.fx.forEach(f=>scene.remove(f)); G.fx=[];
  G.parts.forEach(p=>scene.remove(p)); G.parts=[];
  G.spawnQ=[]; G.sel=null; G.hover=null;
  G.gold=150; G.lives=20; G.score=0; G.wave=0; G.nukes=0;
  G.seen={}; $('mobList').innerHTML=''; hideMobInfo();
  G.rateMul=1; G.dmgMul=1; G.rangeMul=1;
  G.speed=1;
  $('speedTag').style.display='none';
  $('speedTag').textContent='2×';
  $('menuOv').classList.add('hide'); $('upgOv').classList.add('hide');
  $('overOv').classList.add('hide');
  hideTowerInfo();
  G.st='play';
  startWave(1);
  updateHUD();
  sfx('start');
  if(document.activeElement) document.activeElement.blur();
}

/* ---------- 塔信息面板(跟随选中塔下方显示) ---------- */
function positionTowerInfo(t){
  const el=$('towerInfo');
  const v=new THREE.Vector3(t.x,1.2,t.z).project(cam);
  const sx=(v.x*0.5+0.5)*window.innerWidth;
  const sy=(-v.y*0.5+0.5)*window.innerHeight;
  const W=el.offsetWidth||220, H=el.offsetHeight||170;
  const x=clamp(Math.round(sx-W/2),8,window.innerWidth-W-8);
  const y=clamp(Math.round(sy+26),8,window.innerHeight-H-8);
  el.style.left=x+'px';
  el.style.top=y+'px';
}
function showTowerInfo(t){
  G.sel=t;
  const def=TOWER_DEFS[t.lv-1];
  const next=TOWER_DEFS[t.lv];
  const mulD=G.dmgMul||1, mulR=G.rateMul||1, mulG=G.rangeMul||1;
  const hasBonus=(mulD>1.001||mulR>1.001||mulG>1.001);
  const el=$('towerInfo');
  let html='<div class="row"><span>Lv'+t.lv+' '+def.name+'</span><b>'+Math.round(def.dmg*mulD)+' 伤</b></div>';
  html+='<div class="row"><span>射速</span><b>'+(def.rate*mulR).toFixed(1)+'/s</b></div>';
  html+='<div class="row"><span>射程</span><b>'+(def.range*mulG).toFixed(1)+'</b></div>';
  html+='<div class="row"><span>出售</span><b>'+Math.round(t.invest*SELL_RATIO)+'¤</b></div>';
  if(hasBonus){
    html+='<div class="tip" style="color:var(--gold)">含波间奖励:伤×'+mulD.toFixed(2)+' 速×'+mulR.toFixed(2)+' 程×'+mulG.toFixed(2)+'</div>';
  }
  if(next){
    html+='<div class="btnRow"><button class="up" id="btnUpg">升级→'+next.name+' ('+next.cost+'¤)</button><button class="sell" id="btnSell">出售</button></div>';
    html+='<div class="tip">'+next.tip+'</div>';
  }else{
    html+='<div class="row" style="color:var(--gold)"><span>已满级</span><b>MAX</b></div>';
    html+='<div class="btnRow"><button class="sell" id="btnSell">出售</button></div>';
  }
  el.innerHTML=html;
  el.style.display='block';
  positionTowerInfo(t);
  const bUpg=$('btnUpg');
  if(bUpg) bUpg.onclick=()=>{ upgradeTower(t); updateHUD(); showTowerInfo(t); };
  $('btnSell').onclick=()=>{ sellTower(t); hideTowerInfo(); updateHUD(); };
  sfx('select');
}
function hideTowerInfo(){ G.sel=null; $('towerInfo').style.display='none'; }

/* ---------- 交互输入 ---------- */
function handleClick(e){
  if(G.st!=='play') return;
  hideMobInfo();
  const cell=pickCell(e.clientX,e.clientY);
  if(!cell) return;
  const [c,r]=cell;
  const tower=G.towers.find(t=>t.c===c&&t.r===r);
  if(tower){ showTowerInfo(tower); return; }
  hideTowerInfo();
  if(grid[r][c]==='.'){
    if(G.gold>=TOWER_DEFS[0].cost){ buildTower(c,r); updateHUD(); }
    else toast('金币不足',0xef4444);
  }
}
function toggleSpeed(){
  G.speed=G.speed>=8?1:G.speed*2; // 1→2→4→8→1 循环
  $('speedTag').style.display=G.speed===1?'none':'block';
  $('speedTag').textContent=G.speed+'×';
}
function toggleMute(){
  G.muted=!G.muted;
  toast(G.muted?'已静音':'声音开启',0xffffff);
}
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='m'||k==='M'){ toggleMute(); return; }
  if(G.st!=='play') return;
  if(k===' '){ e.preventDefault(); toggleSpeed(); }
  else if(k==='1'){
    G.sel=null; hideTowerInfo();
    toast('点击空地建箭塔 (50¤)',0x10b981);
  }
  else if(k==='2'){
    if(!G.sel){ toast('先点击选中一座塔',0x71717a); return; }
    const cost=towerUpgCost(G.sel);
    if(cost===null){ toast('已满级',0xf59e0b); }
    else if(G.gold>=cost){ upgradeTower(G.sel); updateHUD(); showTowerInfo(G.sel); }
    else toast('金币不足',0xef4444);
  }
  else if(k==='3'){
    if(!G.sel){ toast('先点击选中一座塔',0x71717a); return; }
    sellTower(G.sel); hideTowerInfo(); updateHUD();
  }
  else if(k==='Escape'){ hideTowerInfo(); hideMobInfo(); }
  else if(k==='n'||k==='N'){ useNuke(); }
});

/* ---------- 主循环 ---------- */
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  G.frame++;
  if(G.st==='play'){
    G.time+=dt;
    updateSpawning(dt*G.speed);
    moveMonsters(dt*G.speed);
    updateTowers(dt*G.speed);
    updateBullets(dt*G.speed);
    updateParts(dt*G.speed);
    updateFx(dt*G.speed);
    // 到达终点的怪物扣血
    for(const m of G.monsters){
      if(m.done&&!m.dead){
        m.dead=true;
        scene.remove(m.grp);
        G.lives-=m.def.dmg+Math.floor((G.wave-1)/5); // 攻击力随波次成长(每5波+1)
        sfx('hit');
        toast('基地受到攻击 -'+m.def.dmg,0xef4444);
        if(G.lives<=0){ G.lives=0; gameOver(); break; }
      }
    }
    G.monsters=G.monsters.filter(m=>!m.dead&&!m.done);
    // 波次推进(无尽模式:永远弹奖励进入下一波;每 20 关奖励一枚核弹)
    if(G.st==='play'&&waveCleared()){
      if(G.wave>0&&G.wave%20===0){
        G.nukes++;
        toast('☢ 获得核弹!按 N 或点按钮消灭全图',0xf59e0b);
        sfx('upgrade');
        updateHUD();
      }
      showUpgrade();
    }
    updateHUD();
  }
  // 能量门膜脉动(任何状态都动)
  G.gateT=(G.gateT||0)+dt;
  const gt=G.gateT*3;
  for(let i=0;i<G.gateMats.length;i++){
    G.gateMats[i].opacity=0.5+0.35*Math.sin(gt+i*2.1);
  }
  // hover 高亮
  if(G.st==='play'&&G.hover){
    const [c,r]=G.hover;
    const onTower=G.towers.some(t=>t.c===c&&t.r===r);
    if(grid[r][c]==='.'||onTower){
      hoverMesh.visible=true;
      hoverMesh.position.set(c+0.5,0.05,r+0.5);
      hoverMesh.material.color.setHex(onTower?0xf59e0b:0x10b981);
    } else hoverMesh.visible=false;
  } else if(hoverMesh.visible) hoverMesh.visible=false;
  renderer.render(scene,cam);
}

/* ---------- 初始化 ---------- */
const VERSION='0.17'; // 发布时递增此版本号,用户刷新可见
const BEST_KEY='invincible_td_best';
$('verTxt').textContent=VERSION;
$('verMenu').textContent='v'+VERSION;
G.best={wave:0,score:0};
try{ G.best=JSON.parse(localStorage.getItem(BEST_KEY))||{wave:0,score:0}; }catch(e){}
(function initMonsterKey(){
  const box=$('monsterKey');
  MON_DEFS.forEach(d=>{
    const div=document.createElement('div');
    div.className='mk';
    div.innerHTML='<span class="dot" style="background:#'+d.color.toString(16).padStart(6,'0')+'"></span>'+d.name+' — '+d.desc;
    box.appendChild(div);
  });
})();
$('bestShow').textContent=G.best.wave>0?('第 '+G.best.wave+' 波 · '+G.best.score+' 分'):'无';
$('btnStart').onclick=startGame;
$('btnRetry').onclick=startGame;
$('nukeBtn').onclick=useNuke;
canvas.addEventListener('click',handleClick);
canvas.addEventListener('mousemove',e=>{
  if(G.st!=='play'){ G.hover=null; return; }
  G.hover=pickCell(e.clientX,e.clientY);
});
canvas.addEventListener('mouseleave',()=>{ G.hover=null; });
window.addEventListener('resize',()=>{
  cam.aspect=window.innerWidth/window.innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  if(G.sel) positionTowerInfo(G.sel);
});
requestAnimationFrame(loop);

/* ===== 占位(后续模块注入点) ===== */
window.__TD__={G,MON_DEFS,TOWER_DEFS,WAVES,grid,PATH,WAYPOINTS,cellWorld,worldCell,canBuild,pickCell,scene,cam,renderer,ground,clamp,rnd,rndi,lerp,dist2,$,buildTower,upgradeTower,sellTower,removeTower,spawnMonster,killMonster,hitMonster,startWave,showUpgrade,nextWaveOrWin,waveCleared,startGame,gameOver,winGame,toggleMute,toggleSpeed,saveBest,showTowerInfo,hideTowerInfo,updateSpawning,moveMonsters,updateTowers,updateBullets,fireBullet,laserAttack,findTarget,updateHUD,updateBossBar,waveSeq,parseSeq,useNuke,positionTowerInfo,addMobAvatar,showMobInfo,hideMobInfo};

})();
</script>
