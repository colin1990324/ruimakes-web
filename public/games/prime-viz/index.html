/* ---------- 世界坐标计算 ---------- */
// 乌拉姆螺旋:1 在 (0,0),逆时针扩展;返回 n 的整数坐标
function spiralPos(n){
  if(n===1) return [0,0];
  const k=Math.ceil((Math.sqrt(n)-1)/2);
  const side=2*k+1, max=side*side, off=max-n;
  if(off<side-1) return [k-off, -k];
  if(off<2*side-2) return [-k, -k+(off-(side-1))];
  if(off<3*side-3) return [-k+(off-(2*side-2)), k];
  return [k, k-(off-(3*side-3))];
}

      arr[i*2+1]=p*Math.sin(p);
    }
  } else {

      const sp=spiralPos(S.primes[i]);
      arr[i*2]=sp[0];
      arr[i*2+1]=sp[1];
    }
  }

}

    if(y<minY)minY=y; if(y>maxY)maxY=y;

}

  S.offX=(W-(minX+maxX)*S.scale)/2;
  S.offY=(H-(minY+maxY)*S.scale)/2;
  renderBase();
}

  baseOffX=S.offX; baseOffY=S.offY;
  baseReady=true;
  buildGrid(); // 网格索引必须随视图刷新,否则 pick 基于旧坐标(点击/悬停失效)
  display();
}
function display(){
  ctx.clearRect(0,0,W,H);
  if(S.mode==='mod'){
    // 模时钟:直接矢量绘制(固定视图,无平移缩放)
    renderMod();
    const hl=(S.hoverIdx>=0?S.hoverIdx:S.pickIdx);
    if(hl>=0){
      const a=-Math.PI/2+hl/S.modM*Math.PI*2;
      const R=Math.min(W,H)*0.42;
      ctx.strokeStyle='#f59e0b';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(W/2,H/2,R+5,a-0.06,a+0.06);
      ctx.stroke();
    }
    return;
  }
  if(baseReady) ctx.drawImage(off,S.offX-baseOffX,S.offY-baseOffY);
  // 高亮:悬停 + 选中
  const hl=(S.hoverIdx>=0?S.hoverIdx:S.pickIdx);
  if(hl>=0){
    const x=S.wx[hl*2]*S.scale+S.offX, y=S.wx[hl*2+1]*S.scale+S.offY;
    ctx.strokeStyle='#f59e0b';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(x,y,10,0,Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle='rgba(245,158,11,0.35)';
    ctx.beginPath();
    ctx.arc(x,y,16,0,Math.PI*2);
    ctx.stroke();
  }
}
function render(){
  if(S.mode==='mod'){ computeCounts(); display(); return; }
  renderBase();
}
/* ---------- 模运算时钟表盘 ---------- */
function renderMod(){
  const M=S.modM, cnt=S.modCnt||(S.modCnt=new Uint32Array(M));
  const cx=W/2, cy=H/2;
  const R=Math.min(W,H)*0.42;
  // 外圆
  ctx.strokeStyle='rgba(113,113,122,0.5)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  // 刻度线:与 M 互质的刻度金色加长(质数候选),其余灰色
  for(let i=0;i<M;i++){
    const a=-Math.PI/2+i/M*Math.PI*2;
    const cop=gcd(i,M)===1;
    const len=cop?12:6;
    ctx.strokeStyle=cop?'rgba(245,158,11,0.85)':'rgba(113,113,122,0.3)';
    ctx.lineWidth=cop?1.6:1;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(R-len), cy+Math.sin(a)*(R-len));
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    ctx.stroke();
  }
  // 质数计数条:从圆周向圆心,长度 ∝ 该刻度质数数量
  const max=S.modMax||1;
  for(let i=0;i<M;i++){
    const c=cnt[i];
    if(!c) continue;
    const a=-Math.PI/2+i/M*Math.PI*2;
    const len=R*0.88*(c/max);
    ctx.strokeStyle='rgba(239,68,68,0.85)';
    ctx.lineWidth=Math.max(2,W/700);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    ctx.lineTo(cx+Math.cos(a)*(R-len), cy+Math.sin(a)*(R-len));
    ctx.stroke();
  }
  // 刻度数字(M<=30 时显示)
  if(M<=30){
    ctx.fillStyle='rgba(161,161,170,0.7)';
    ctx.font='11px Courier New';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let i=0;i<M;i++){
      const a=-Math.PI/2+i/M*Math.PI*2;
      const rr=R+14;
      ctx.fillText(String(i),cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);
    }
  }
  // 中心信息
  ctx.fillStyle='#a1a1aa';
  ctx.font='14px Courier New';
  ctx.textAlign='center';
  ctx.fillText('mod '+M, cx, cy-10);
  ctx.fillStyle='#71717a';
  ctx.font='12px Courier New';
  ctx.fillText(S.primes.length.toLocaleString()+' 个质数 · 红色条=该刻度质数数量', cx, cy+10);
}
/* ---------- 模时钟拾取:点击角度 → 最近刻度 ---------- */
function pickMod(mx,my){
  const cx=W/2, cy=H/2;
  const dx=mx-cx, dy=my-cy;
  const d=Math.hypot(dx,dy);
  const R=Math.min(W,H)*0.42;
  if(d<R*0.5||d>R+22) return -1;
  let a=Math.atan2(dy,dx)+Math.PI/2; // 顶部=0,顺时针
  if(a<0) a+=Math.PI*2;
  return Math.round(a/(Math.PI*2)*S.modM)%S.modM;
}

/* ---------- 点击拾取(网格索引) ---------- */
let gridW=0,gridH=0,gridMap=null;
const CELL=4;
function buildGrid(){
  gridW=Math.ceil(W/CELL); gridH=Math.ceil(H/CELL);
  gridMap=new Uint32Array(gridW*gridH);
  gridMap.fill(0xFFFFFFFF);
  const n=S.primes.length;
  for(let i=0;i<n;i++){
    const sx=(S.wx[i*2]*S.scale+S.offX)|0, sy=(S.wx[i*2+1]*S.scale+S.offY)|0;
    if(sx<0||sy<0||sx>=W||sy>=H) continue;
    const gi=((sy>>2)*gridW+(sx>>2));
    if(gridMap[gi]===0xFFFFFFFF) gridMap[gi]=i;
  }
}
function pick(mx,my){
  if(!S.wx) return -1;
  if(S.mode==='mod') return pickMod(mx,my);
  const gx=(mx/CELL)|0, gy=(my/CELL)|0;
  let best=-1,bestD=1e18;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    const x=gx+dx, y=gy+dy;
    if(x<0||y<0||x>=gridW||y>=gridH) continue;
    const i=gridMap[y*gridW+x];
    if(i===0xFFFFFFFF) continue;
    const sx=S.wx[i*2]*S.scale+S.offX, sy=S.wx[i*2+1]*S.scale+S.offY;
    const d=(sx-mx)*(sx-mx)+(sy-my)*(sy-my);
    if(d<bestD){bestD=d;best=i;}
  }
  return bestD<900?best:-1; // 30px 模糊匹配,更容易点到
}

/* ---------- 信息框 ---------- */
const pv=document.getElementById('pv');
function showInfo(idx,mx,my){
  if(idx<0){ pv.style.display='none'; return; }
  if(S.mode==='mod'){
    const M=S.modM, c=S.modCnt[idx], cop=gcd(idx,M)===1;
    pv.innerHTML='<div class="pv-num">刻度 '+idx+'</div>'+
      '<div class="pv-row"><span>质数数量</span><b>'+c.toLocaleString()+'</b></div>'+
      '<div class="pv-row"><span>与 '+M+' 互质</span><b>'+(cop?'是 · 质数候选':'否 · 被筛除')+'</b></div>'+
      '<div class="pv-pos">质数 p 满足 p mod '+M+' = '+idx+'</div>';
    pv.style.display='block';
    const Wp=pv.offsetWidth||190, Hp=pv.offsetHeight||120;
    let px=Math.round(mx+16), py=Math.round(my+16);
    if(px+Wp>window.innerWidth) px=mx-Wp-16;
    if(py+Hp>window.innerHeight) py=my-Hp-16;
    if(px<6)px=6; if(py<6)py=6;
    pv.style.left=px+'px';
    pv.style.top=py+'px';
    return;
  }
  const p=S.primes[idx];
  const x=S.wx[idx*2], y=S.wx[idx*2+1];
  pv.innerHTML='<div class="pv-num">'+p+'</div>'+
    '<div class="pv-row"><span>表中序号</span><b>#'+(idx+1)+'</b></div>'+
    '<div class="pv-row"><span>相邻质数</span><b>'+(idx>0?S.primes[idx-1]:'-')+' / '+(idx<S.primes.length-1?S.primes[idx+1]:'-')+'</b></div>'+
    '<div class="pv-pos">'+(S.mode==='polar'?'极坐标 (r='+p+', θ='+p+' rad ≈ '+Math.round(p*180/Math.PI)+'°)':'螺旋坐标 ('+x+', '+y+')')+'</div>';
  pv.style.display='block';
  const Wp=pv.offsetWidth||190, Hp=pv.offsetHeight||120;
  let px=Math.round(mx+16), py=Math.round(my+16);
  if(px+Wp>window.innerWidth) px=mx-Wp-16;
  if(py+Hp>window.innerHeight) py=my-Hp-16;
  if(px<6)px=6; if(py<6)py=6;
  pv.style.left=px+'px';
  pv.style.top=py+'px';
}

/* ---------- 数据加载 ---------- */
async function loadTag(tag){
  if(S.tag===tag&&S.primes.length===DATA[tag].count) return;
  S.tag=tag;
  document.getElementById('loading').style.display='flex';
  try{
    if(tag==='1e4'){ S.primes=PRIMES_1E4; }
    else{
      const res=await fetch(DATA[tag].file);
      const buf=await res.arrayBuffer();
      const dv=new DataView(buf);
      const n=buf.byteLength/4;
      const arr=new Uint32Array(n);
      for(let i=0;i<n;i++) arr[i]=dv.getUint32(i*4,true);
      S.primes=arr;
    }
    if(S.mode==='mod'){ computeCounts(); display(); }
    else { computeWorld(); fit(); }
    updateButtons();
  }catch(e){
    alert('加载质数表失败: '+e.message);
  }
  document.getElementById('loading').style.display='none';
}
function switchMode(mode){
  if(S.mode===mode) return;
  S.mode=mode;
  S.hoverIdx=-1; S.pickIdx=-1; pv.style.display='none';
  document.getElementById('mPolar').classList.toggle('cur',mode==='polar');
  document.getElementById('mUlam').classList.toggle('cur',mode==='ulam');
  document.getElementById('mMod').classList.toggle('cur',mode==='mod');
  document.getElementById('modRow').style.display=(mode==='mod')?'flex':'none';
  if(mode==='mod'){ computeCounts(); display(); }
  else { computeWorld(); fit(); }
}
function setModM(m){
  S.modM=m;
  document.querySelectorAll('#modRow button[data-m]').forEach(b=>{
    b.classList.toggle('cur',+b.dataset.m===m);
  });
  if(S.mode==='mod'){ S.hoverIdx=-1; S.pickIdx=-1; pv.style.display='none'; computeCounts(); display(); }
}
function updateButtons(){
  document.getElementById('cntTxt').textContent=S.primes.length.toLocaleString();
  document.querySelectorAll('#right button[data-tag]').forEach(b=>{
    b.classList.toggle('cur',b.dataset.tag===S.tag);
  });
}

/* ---------- 交互 ---------- */
const DPR=window.devicePixelRatio||1; // canvas 像素 = CSS 像素 × DPR,拾取必须换算
let dragging=false,lastX=0,lastY=0,dragDist=0;
cv.addEventListener('mousedown',e=>{ if(S.mode==='mod') return; dragging=true; dragDist=0; lastX=e.clientX*DPR; lastY=e.clientY*DPR; });
window.addEventListener('mouseup',()=>{
  if(dragging){ dragging=false; renderBase(); } // 拖动结束重建底图补齐边缘
});
cv.addEventListener('mousemove',e=>{
  const mx=e.clientX*DPR, my=e.clientY*DPR;
  if(dragging){
    dragDist+=Math.abs(mx-lastX)+Math.abs(my-lastY);
    S.offX+=mx-lastX; S.offY+=my-lastY;
    lastX=mx; lastY=my;
    display(); // drawImage 即时平移(流畅)
    return;
  }
  const idx=pick(mx,my);
  S.hoverIdx=idx;
  if(idx>=0) showInfo(idx,e.clientX,e.clientY); // 弹窗用 CSS 坐标定位
  else if(S.pickIdx<0) pv.style.display='none';
  display();
});
cv.addEventListener('mouseleave',()=>{ S.hoverIdx=-1; if(S.pickIdx<0) pv.style.display='none'; display(); });
cv.addEventListener('click',e=>{
  if(dragDist>8) return; // 拖动后不触发拾取
  const idx=pick(e.clientX*DPR,e.clientY*DPR);
  S.pickIdx=idx;
  if(idx>=0) showInfo(idx,e.clientX,e.clientY);
  else { pv.style.display='none'; }
  display();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.4:1/1.4;
  zoomAt(f,e.clientX*DPR,e.clientY*DPR);
},{passive:false});
function zoomAt(f,mx,my){
  if(S.mode==='mod') return; // 模时钟固定视图
  const ns=S.scale*f;
  S.offX=mx-(mx-S.offX)*(ns/S.scale);
  S.offY=my-(my-S.offY)*(ns/S.scale);
  S.scale=ns;
  renderBase();
}
// 触屏
let touch0=null;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){ dragging=true; dragDist=0; lastX=e.touches[0].clientX*DPR; lastY=e.touches[0].clientY*DPR; }
}, {passive:true});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    const mx=e.touches[0].clientX*DPR, my=e.touches[0].clientY*DPR;
    dragDist+=Math.abs(mx-lastX)+Math.abs(my-lastY);
    S.offX+=mx-lastX; S.offY+=my-lastY;
    lastX=mx; lastY=my;
    display();
  } else if(e.touches.length===2){
    const t=e.touches;
    const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    if(touch0){ const f=d/touch0.d; zoomAt(f,(t[0].clientX+t[1].clientX)/2*DPR,(t[0].clientY+t[1].clientY)/2*DPR); }
    touch0={d};
  }
},{passive:false});
cv.addEventListener('touchend',e=>{ if(dragging){ dragging=false; renderBase(); } touch0=null; });

// 按钮
document.getElementById('mPolar').onclick=()=>switchMode('polar');
document.getElementById('mUlam').onclick=()=>switchMode('ulam');
document.getElementById('mMod').onclick=()=>switchMode('mod');
document.querySelectorAll('#modRow button[data-m]').forEach(b=>{
  b.onclick=()=>setModM(+b.dataset.m);
});
document.querySelectorAll('#right button[data-tag]').forEach(b=>{
  b.onclick=()=>loadTag(b.dataset.tag);
});
document.getElementById('zIn').onclick=()=>zoomAt(1.5,W/2,H/2);
document.getElementById('zOut').onclick=()=>zoomAt(1/1.5,W/2,H/2);
document.getElementById('zFit').onclick=()=>fit();

/* ---------- 启动 ---------- */
computeWorld();
resize();
buildGrid();
updateButtons();
window.__PV__={S,PRIMES_1E4,spiralPos,computeWorld,computeCounts,buildGrid,pick,pickMod,loadTag,switchMode,setModM,renderBase,renderMod,zoomAt,gcd};
})();
</script>
</body>
