<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>开心农场 · Happy Farm · ruimakes</title>
<style>
  :root{ --bg:#09090b; --fg:#e4e4e7; --dim:#71717a; --acc:#10b981; --gold:#f59e0b; --red:#ef4444; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Courier New", monospace; -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas{ display:block; width:100%; height:100%; }
  /* ===== HUD 顶栏 ===== */
  #hud{ position:absolute; top:10px; left:10px; z-index:5; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    font-size:13px; pointer-events:none; max-width:70%; }
  #hud .stat{ background:rgba(0,0,0,.55); border:1px solid #27272a; border-radius:6px; padding:3px 9px; letter-spacing:1px; }
  #hud .stat b{ color:var(--acc); }
  #hud .stat.gold b{ color:var(--gold); }
  #hud .stat .sp{ color:var(--dim); font-size:11px; }
  #dayBar{ position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.06); z-index:4; }
  #dayBar i{ display:block; height:100%; width:0%; background:var(--acc); }
  #speedTag{ position:absolute; top:10px; right:10px; z-index:5; font-size:13px; color:var(--gold); background:rgba(0,0,0,.65);
    border:1px solid #52525b; border-radius:6px; padding:3px 10px; cursor:pointer; user-select:none; -webkit-user-select:none; display:none; }
  #speedTag:hover{ border-color:var(--gold); background:rgba(16,185,129,.15); }
  #speedTag::before{ content:'⏩ '; }
  #verStat{ position:absolute; top:10px; right:76px; z-index:5; font-size:12px; color:var(--dim);
    background:rgba(0,0,0,.5); border:1px solid #3f3f46; border-radius:6px; padding:3px 8px; }
  #verStat b{ color:#facc15; }
  #feedWarn{ position:absolute; top:10px; right:140px; z-index:6; font-size:13px; color:#fff;
    background:rgba(239,68,68,.92); border:1px solid #ef4444; border-radius:6px; padding:3px 10px;
    display:none; letter-spacing:1px; animation:warnBlink 1s step-start infinite; pointer-events:none; }
  @keyframes warnBlink{ 50%{ opacity:.35; } }
  @media (max-width:760px){ #feedWarn{ right:10px; top:44px; font-size:11px; } }
  #merchantBar{ position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5; font-size:12px; color:var(--gold);
    background:rgba(0,0,0,.65); border:1px solid #7c5a10; border-radius:6px; padding:4px 12px; display:none; letter-spacing:1px; }
  #luxBar{ position:absolute; top:46px; left:50%; transform:translateX(-50%); z-index:5; font-size:12px; color:#facc15;
    background:rgba(30,20,5,.85); border:1px solid #d9a520; border-radius:6px; padding:4px 12px; display:none; letter-spacing:1px; cursor:pointer;
    box-shadow:0 0 12px rgba(217,165,32,.35); }
  #luxBar:hover{ background:rgba(60,40,10,.9); }
  #luxury{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:10;
    background:rgba(0,0,0,.78); }
  #luxury .box{ width:min(660px,94%); background:#18181b; border:2px solid #d9a520; border-radius:14px; padding:18px 22px;
    max-height:86vh; overflow-y:auto; }
  #luxury h2{ color:#facc15; letter-spacing:3px; margin-bottom:4px; font-size:20px; }
  #luxury .sub{ color:var(--dim); font-size:12px; margin-bottom:12px; }
  #luxury .sec{ font-size:12px; color:var(--dim); letter-spacing:2px; margin:12px 0 6px; border-top:1px solid #27272a; padding-top:8px; }
  #luxury .grid{ display:flex; flex-wrap:wrap; gap:8px; }
  #luxury .item{ background:#222; border:1px solid #3f3f46; border-radius:8px; padding:7px 10px; font-size:12px; cursor:pointer; width:190px; }
  #luxury .item:hover{ border-color:#facc15; background:#2a2412; }
  #luxury .item b{ color:#facc15; font-size:13px; }
  #luxury .item .p{ color:var(--gold); font-weight:bold; }
  #luxury .item.owned{ opacity:.55; cursor:default; border-color:#3f3f46; }
  #luxury button.close{ margin-top:14px; font-family:inherit; font-size:14px; padding:8px 26px; background:#facc15; color:#1c1300;
    border:none; border-radius:8px; cursor:pointer; }
  /* ===== 建造菜单(左) ===== */
  #buildMenu{ position:absolute; left:10px; top:50%; transform:translateY(-50%); z-index:6; width:128px;
    background:rgba(0,0,0,.75); border:1px solid #27272a; border-radius:10px; padding:9px; display:none; }
  #buildToggle{ position:absolute; left:10px; top:50%; transform:translateY(-50%); z-index:6; width:70px;
    background:rgba(16,185,129,.14); color:var(--acc); border:1px solid var(--acc); border-radius:10px;
    padding:10px 0; font-family:inherit; font-size:13px; letter-spacing:2px; cursor:pointer; }
  #buildToggle:hover{ background:rgba(16,185,129,.28); }
  #buildMenu .tt{ font-size:11px; color:var(--dim); letter-spacing:2px; margin-bottom:7px; }
  #buildMenu button{ display:block; width:100%; font-family:inherit; font-size:12px; letter-spacing:1px; padding:7px 8px;
    margin-bottom:5px; background:#18181b; color:var(--fg); border:1px solid #3f3f46; border-radius:6px; cursor:pointer; text-align:left; }
  #buildMenu button .c{ float:right; color:var(--gold); font-size:11px; }
  #buildMenu button.lock{ opacity:.35; cursor:default; }
  #buildMenu button.cur{ background:rgba(16,185,129,.15); border-color:var(--acc); color:var(--acc); }
  #buildMenu button.cur .c{ color:#fbbf24; }
  /* ===== 信息面板(右) ===== */
  #info{ position:absolute; right:10px; top:50%; transform:translateY(-50%); z-index:6; width:190px; display:none;
    background:rgba(0,0,0,.8); border:1px solid #3f3f46; border-radius:10px; padding:11px 13px; font-size:13px; }
  #info .t{ font-size:16px; font-weight:bold; letter-spacing:1px; color:var(--acc); margin-bottom:6px; }
  #info .row{ display:flex; justify-content:space-between; gap:10px; margin:3px 0; color:var(--dim); font-size:12px; }
  #info .row b{ color:var(--fg); }
  #info button{ font-family:inherit; font-size:12px; letter-spacing:1px; padding:6px 10px; margin:5px 4px 0 0;
    background:#27272a; color:var(--fg); border:1px solid #3f3f46; border-radius:6px; cursor:pointer; }
  #info button.act{ background:var(--acc); color:#04231a; border:none; font-weight:bold; }
  #info button.gold{ background:transparent; color:var(--gold); border-color:var(--gold); }
  #info .sel{ margin-top:7px; padding-top:6px; border-top:1px solid #27272a; font-size:12px; color:var(--dim); }
  #info .sel button{ margin:2px 3px 0 0; padding:4px 8px; font-size:11px; }
  /* ===== 背包(底部) ===== */
  #bag{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:6; max-width:92%;
    background:rgba(0,0,0,.75); border:1px solid #27272a; border-radius:10px; padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; }
  #bag .slot{ min-width:58px; background:#18181b; border:1px solid #3f3f46; border-radius:8px; padding:5px 7px;
    text-align:center; font-size:11px; cursor:pointer; transition:border-color .15s; }
  #bag .slot:hover{ border-color:var(--acc); }
  #bag .slot .n{ font-size:14px; color:var(--acc); font-weight:bold; }
  #bag .slot .q{ color:var(--dim); font-size:10px; }
  #bag .slot .st{ color:var(--gold); font-size:10px; }
  #bag .empty{ color:var(--dim); font-size:12px; padding:6px 4px; }
  .qtyrow{ display:flex; align-items:center; gap:8px; width:100%; font-size:11px; color:var(--dim); padding:2px 2px 0; }
  .qtyrow b{ color:var(--gold); min-width:38px; text-align:right; font-size:12px; }
  .qtyrow input[type=range]{ flex:1; accent-color:#10b981; height:14px; cursor:pointer; }
  #merchant .qtyrow{ margin:4px 0 8px; }
  #merchant .qtyrow b{ color:var(--gold); }
  /* ===== 商人面板 ===== */
  #merchant{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:10;
    background:rgba(9,9,11,.8); }
  #merchant .box{ width:min(640px,92%); background:#18181b; border:2px solid #7c5a10; border-radius:14px; padding:18px 22px;
    max-height:86vh; overflow-y:auto; }
  #merchant h2{ color:var(--gold); letter-spacing:3px; margin-bottom:4px; font-size:20px; }
  #merchant .sub{ color:var(--dim); font-size:12px; margin-bottom:12px; }
  #merchant .sec{ font-size:12px; color:var(--dim); letter-spacing:2px; margin:12px 0 6px; border-top:1px solid #27272a; padding-top:8px; }
  #merchant .grid{ display:flex; flex-wrap:wrap; gap:8px; }
  #merchant .item{ background:#222; border:1px solid #3f3f46; border-radius:8px; padding:7px 10px; font-size:12px; cursor:pointer; }
  #merchant .item:hover{ border-color:var(--gold); }
  #merchant .item b{ color:var(--gold); }
  #merchant .item .hot{ color:var(--red); }
  #merchant button.close{ margin-top:14px; font-family:inherit; font-size:14px; padding:8px 26px; background:var(--gold);
    color:#1c1300; border:none; border-radius:8px; cursor:pointer; font-weight:bold; letter-spacing:2px; }
  /* ===== 夜晚偷菜事件 ===== */
  #pestBar{ position:absolute; top:46px; left:50%; transform:translateX(-50%); z-index:7; display:none;
    background:rgba(0,0,0,.8); border:1px solid var(--red); border-radius:10px; padding:8px 14px; font-size:13px; text-align:center; }
  #pestBar .pt{ color:var(--red); letter-spacing:2px; margin-bottom:5px; }
  #pestBar .row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #pestBar button{ font-family:inherit; font-size:12px; padding:5px 10px; background:#27272a; color:var(--fg);
    border:1px solid #3f3f46; border-radius:6px; cursor:pointer; }
  #pestBar button.tame{ background:var(--acc); color:#04231a; border:none; }
  #toast{ position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:9; font-size:14px; letter-spacing:2px;
    color:var(--fg); background:rgba(0,0,0,.8); border:1px solid #3f3f46; padding:6px 18px; border-radius:6px; opacity:0;
    transition:opacity .3s; pointer-events:none; }
  #toast.show{ opacity:1; }
  .ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20;
    background:rgba(9,9,11,.88); text-align:center; padding:20px; }
  .ov.hide{ display:none; }
  .ov h1{ font-size:40px; letter-spacing:8px; color:var(--acc); margin-bottom:6px; text-shadow:0 0 18px rgba(16,185,129,.5); }
  .ov h2{ font-size:24px; letter-spacing:4px; margin-bottom:14px; }
  .ov p{ font-size:13px; color:var(--dim); line-height:1.9; max-width:600px; margin-bottom:4px; }
  .ov .btn{ margin-top:16px; font-family:inherit; font-size:17px; letter-spacing:3px; padding:12px 42px;
    background:var(--acc); color:#04231a; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  .ov .btn:hover{ filter:brightness(1.15); }
  #helpKey{ display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; margin-top:10px; font-size:12px; color:var(--dim); }
  @media (max-width:760px){ #buildMenu{ width:100px; } #info{ width:160px; } #hud{ font-size:11px; max-width:60%; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="dayBar"><i id="dayFill"></i></div>
<div id="hud">
  <div class="stat gold">¤ <b id="hMoney">100</b></div>
  <div class="stat">🏡 Lv<b id="hLevel">1</b></div>
  <div class="stat">☀ 第<b id="hDay">1</b>天</div>
  <div class="stat"><span class="sp" id="hTime">6:00</span></div>
  <div class="stat">🐔 <b id="hAnimal">0</b></div>
</div>
<div id="speedTag">2×</div>
<div id="feedWarn">⚠ 饲料仓已空</div>
<div id="verStat">v<b id="verTxt">0.1</b></div>
<div id="merchantBar">🛒 商人来访!点击商人交易</div>
<div id="luxBar">🚁 奢侈品商人到访!点击选购 💎</div>
<div id="buildMenu">
  <div class="tt">建造</div>
</div>
<button id="buildToggle">🏗 建造</button>
<div id="info"></div>
<div id="bag"></div>
<div id="pestBar"></div>
<div id="toast"></div>
<div id="merchant"><div class="box"></div></div>
<div id="luxury"><div class="box"></div></div>

<div class="ov" id="menuOv">
  <h1>开心农场</h1>
  <p>HAPPY FARM</p>
  <p>种田养畜,收获卖钱,扩建农场!每 1 分钟过一天,离线/后台也会成长,每周商人来访。</p>
  <p>点击空地建造场地,点击场地查看/收获,收获物在底部背包随时出售。</p>
  <div id="helpKey">
    <span>[空格] 时间加速 ×1/2/4/8/16</span><span>[1-8] 选择建造</span><span>[ESC] 取消</span><span>[M] 静音</span>
  </div>
  <button class="btn" id="btnStart">开 始</button>
  <button class="btn" id="btnContinue" style="display:none;background:var(--gold);color:#1c1300">继 续</button>
  <p style="margin-top:12px;font-size:11px;">最高纪录 <b id="bestShow" style="color:var(--gold)">-</b></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ============================================================
 * 开心农场 Happy Farm — 2.5D 固定空中视角农场经营
 * ============================================================ */

const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const $=id=>document.getElementById(id);

/* ---------- 全局状态 ---------- */
const G={
  st:'menu',            // menu | play | merchant
  money:100, lv:1, day:1,       // day 浮点,1 分钟=1 天
  speed:1, muted:false, bidSeq:0, _lastDay:1, _wallTs:0,
  buildings:[], crops:[], animals:[], pets:[], pests:[],
  bag:{},               // 收获物背包 {itemKey: qty}
  sel:null,             // 选中建筑
  buildMode:null,       // 建造中的建筑类型 key
  hover:null,           // hover 格 [c,r]
  frame:0, time:0,
  merchant:false,       // 商人是否在场
  merchantDay:7,
  lux:false,            // 奢侈品商人是否在场(房屋 Lv6+ 每 30 天)
  luxuries:[],          // 已购奢侈品 {key}(摆放在小屋周围展示,不入背包)
  hotSet:false,
  hotItems:[],          // 本周高价物品(卖出上浮)
  saleItems:[],         // 本周特价货品(买入下浮)
  saleMult:1,           // 特价折扣倍率
  best:{day:0,money:0},
  feed:0,               // 饲料仓存量
  wood:0,               // 木材存量
  pondFish:0,           // 鱼塘存量(每天+1,点击捞鱼收进背包)
  pondFx:[],            // 跳鱼动画特效(临时,不入存档)
  eggFx:[],             // 鸡蛋弹出动画(临时,不入存档)
  seeds:{},             // 各作物已解锁标记(level 判断)
  lastProduce:{},       // 动物最后产出日
  pestsDone:false,      // 今晚偷菜事件是否已发生
  petsByType:{},        // 驯服动物 {type:count} 用于工作技能
};

/* ---------- 地图 ---------- */
const COLS=14, ROWS=10, CX=6.5, CZ=4.5; // 中心(小木屋)
// 数据格(c,r) → 世界坐标:格子 c 中心在 world x=c(与地面/网格线/pickCell 对齐)
// 踩过坑:原代码用 c-CX+0.5(=c-6) 偏移 6 格/4 行,建筑画在格子西南,点击永远选不中
function wx(c,w){ return c+((w==null)?1:w)/2-0.5; }
function wz(r,h){ return r+((h==null)?1:h)/2-0.5; }
const grid=[]; // grid[r][c]: null 空地 | 'locked' 未解锁 | 建筑对象
for(let r=0;r<ROWS;r++){ grid[r]=[]; for(let c=0;c<COLS;c++) grid[r][c]='locked'; }
function unlockRadius(){ return 2+G.lv; } // Lv1=3 → 7×7 中心区域
function isUnlocked(c,r){
  const rad=unlockRadius();
  return Math.abs(c-CX)<=rad && Math.abs(r-CZ)<=rad;
}
function refreshUnlock(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(grid[r][c]==='locked'&&isUnlocked(c,r)) grid[r][c]=null;
  }
}

/* ---------- 场地定义 ---------- */
const BUILD_TYPES=[
  {key:'farm',    name:'农田',   cost:50,  w:1,h:2, lv:1, color:0xb07d3b, desc:'种农作物,7 种作物可选'},
  {key:'feed',    name:'饲料仓', cost:40,  w:1,h:1, lv:1, color:0x8a8578, desc:'存储饲料,每仓上限 500'},
  {key:'chicken', name:'养鸡场', cost:60,  w:1,h:2, lv:2, color:0xe8c86a, desc:'养鸡捡蛋'},
  {key:'pond',    name:'鱼塘',   cost:80,  w:2,h:2, lv:2, color:0x38bdf8, desc:'养鱼,每天收鱼'},
  {key:'pig',     name:'猪圈',   cost:100, w:2,h:2, lv:3, color:0xe58b8b, desc:'养猪育肥,长大出售'},
  {key:'forest',  name:'森林',   cost:120, w:2,h:2, lv:3, color:0x2f7d4f, desc:'每天采伐 1 份木头'},
  {key:'pasture', name:'牧场',   cost:150, w:2,h:3, lv:4, color:0x6ecb63, desc:'养牛羊,挤奶剪毛'},
];
const HOUSE={key:'house', name:'小木屋', w:2,h:2, color:0xa06a3b};
const UPGRADE_COST=[0,70,100,140,190,230,290]; // 第1~6次升级费(lv1→2=70 ... lv6→7=290)
function upgradeCost(lv){ return lv<UPGRADE_COST.length?UPGRADE_COST[lv]:290+(lv-6)*60; } // 之后每次 +60

/* ---------- Three 场景 ---------- */
const canvas=$('cv');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1a12);
const cam=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,100);
cam.position.set(CX,16,CZ+10);
cam.lookAt(CX,0,CZ);
const sun=new THREE.DirectionalLight(0xfff5e0,1.0);
sun.position.set(8,20,6); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-12; sun.shadow.camera.right=24;
sun.shadow.camera.top=14; sun.shadow.camera.bottom=-10;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x99bb88,0.7));
// 地面
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(COLS+1,ROWS+1),
  new THREE.MeshLambertMaterial({color:0x1e3a24})
);
ground.rotation.x=-Math.PI/2; ground.position.set(CX,0,CZ); ground.receiveShadow=true;
scene.add(ground);
const outer=new THREE.Mesh(
  new THREE.PlaneGeometry(30,20),
  new THREE.MeshLambertMaterial({color:0x0e1a12})
);
outer.rotation.x=-Math.PI/2; outer.position.set(CX,-0.02,CZ);
scene.add(outer);
// 网格线
(function(){
  const mat=new THREE.LineBasicMaterial({color:0x2d5a38,transparent:true,opacity:0.5});
  for(let c=0;c<=COLS;c++){
    const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(c-0.5,0.02,CZ-ROWS/2),new THREE.Vector3(c-0.5,0.02,CZ+ROWS/2)]);
    scene.add(new THREE.Line(g,mat));
  }
  for(let r=0;r<=ROWS;r++){
    const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(CX-COLS/2,0.02,r-0.5),new THREE.Vector3(CX+COLS/2,0.02,r-0.5)]);
    scene.add(new THREE.Line(g,mat));
  }
})();
// 锁定区域遮罩(未解锁格显示暗色半透明块)
const lockMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.55});
const lockMeshs=[];
function refreshLockVisual(){
  lockMeshs.forEach(m=>scene.remove(m)); lockMeshs.length=0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(grid[r][c]==='locked'){
      const m=new THREE.Mesh(GEO_CELL,lockMat);
      m.position.set(wx(c),0.03,wz(r));
      scene.add(m); lockMeshs.push(m);
    }
  }
}

/* ---------- 建造 ---------- */
function canPlace(type,c,r){
  const def=BUILD_TYPES.find(b=>b.key===type);
  if(!def) return false;
  if(G.lv<def.lv) return false;
  for(let dc=0;dc<def.w;dc++) for(let dr=0;dr<def.h;dr++){
    const cc=c+dc, rr=r+dr;
    if(cc<0||cc>=COLS||rr<0||rr>=ROWS) return false;
    if(grid[rr][cc]!==null) return false;
  }
  return true;
}
function buildBuilding(type,c,r){
  const def=BUILD_TYPES.find(b=>b.key===type);
  if(!canPlace(type,c,r)||G.money<def.cost) return false;
  G.money-=def.cost;
  const b={type,key:type,c,r,w:def.w,h:def.h,grp:null};
  b.id=++G.bidSeq;
  b.grp=buildModel(type);
  b.grp.position.set(wx(c,def.w),0,wz(r,def.h));
  scene.add(b.grp);
  for(let dc=0;dc<def.w;dc++) for(let dr=0;dr<def.h;dr++) grid[r+dr][c+dc]=b;
  G.buildings.push(b);
  G.buildMode=null;               // 建完自动退出建造模式,否则点建筑只会提示"已被占用"
  sfx('build');
  return b;
}
function removeBuilding(b){
  const i=G.buildings.indexOf(b);
  if(i>=0) G.buildings.splice(i,1);
  for(let dc=0;dc<b.w;dc++) for(let dr=0;dr<b.h;dr++) grid[b.r+dr][b.c+dc]=null;
  scene.remove(b.grp);
  G.animals=G.animals.filter(a=>{ if(a.b===b){ scene.remove(a.grp); return false; } return true; });
  G.crops=G.crops.filter(c=>{ if(c.b===b){ scene.remove(c.grp); return false; } return true; });
  G.money+=Math.round(BUILD_TYPES.find(t=>t.key===b.type).cost*0.7);
}

/* ---------- 音效 ---------- */
let AC=null;
const SND={build:[520,0.08,'triangle'],coin:[990,0.07,'square'],click:[700,0.05,'triangle'],eat:[300,0.08,'sine'],alert:[220,0.2,'sawtooth'],level:[660,0.15,'triangle'],sale:[880,0.1,'square']};
function sfx(k){
  if(G.muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const c=SND[k]||SND.click;
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type=c[2]; o.frequency.setValueAtTime(c[0],AC.currentTime);
    g.gain.setValueAtTime(0.1,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+c[1]);
    o.start(); o.stop(AC.currentTime+c[1]+0.02);
  }catch(e){}
}
let toastTimer=null;
function toast(msg,color){
  const el=$('toast');
  el.textContent=msg;
  el.style.color=color!==undefined?('#'+color.toString(16).padStart(6,'0')):'#fff';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1500);
}

/* ---------- 拾取 ---------- */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
function pickCell(px,py){
  ndc.x=(px/window.innerWidth)*2-1;
  ndc.y=-(py/window.innerHeight)*2+1;
  raycaster.setFromCamera(ndc,cam);
  const hits=raycaster.intersectObject(ground);
  if(!hits.length) return null;
  const p=hits[0].point;
  const c=Math.floor(p.x-CX+COLS/2), r=Math.floor(p.z-CZ+ROWS/2);
  return (c>=0&&c<COLS&&r>=0&&r<ROWS)?[c,r]:null;
}

/* ---------- 时间 ---------- */
function hourOf(){ return (G.day%1)*24; }
function dayInt(){ return Math.floor(G.day); }
function updateTime(dt){
  G.time+=dt;
  const d=Math.floor(G.day);
  const h=hourOf();
  // 商人:每 7 天 8:00-22:00
  const inMerchant=(d%7===0&&h>=8&&h<22);
  if(inMerchant&&!G.hotSet){ G.hotSet=true; rollMerchant(); }
  if(!inMerchant){ G.hotSet=false; G.hotItems=[]; G.merchantHandled=false; G.saleItems=[]; G.saleMult=1; }   // 商人离开后高价/特价失效
  G.merchant=inMerchant;
  // 奢侈品商人:房屋 Lv6+ 每 30 天 8:00-22:00(与普通商人独立)
  const inLux=(G.lv>=6&&d%30===0&&h>=8&&h<22);
  if(!inLux&&G.lux) G.luxHandled=false;
  G.lux=inLux;
  // 事件进行中 → 冻结时间:商人到访未处理 / 偷菜动物在场,处理完才继续(加速也不会错过)
  G.merchantPending = inMerchant && !G.merchantHandled;
  G.luxPending = inLux && !G.luxHandled;
  const frozen = G.merchantPending || G.luxPending || G.pests.length>0;
  $('merchantBar').style.display=inMerchant&&G.st!=='merchant'?'block':'none';
  $('luxBar').style.display=inLux&&G.st!=='merchant'?'block':'none';
  // 夜晚偷菜:22:00 触发一次
  if(h>=22&&!G.pestsDone&&G.st==='play'){
    G.pestsDone=true;
    spawnPests();
  }
  if(h<22) G.pestsDone=false;
  if(!frozen) G.day+=dt/60;   // 1 分钟 = 1 天;事件中不走
  // 跨天:每日结算
  if(d!==G._lastDay){ G._lastDay=d; dailyTick(); }
  // 清晨 6~8 点清算:时间冻结时偷菜动物不会自动溜走,必须手动处理
  if(h>=6&&h<8&&G.pests.length&&!frozen){ resolvePestTheft(); }
  updateHUD();
}

/* ---------- 主循环 ---------- */
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  G.frame++;
  if(G.st==='play'||G.st==='merchant'){
    updateTime(dt*G.speed);
    updateCrops();
    updateCropPctUI();
    updateResourceUI();   // 饲料仓/鱼塘/森林存量实时刷新(同农田百分比)
    updateAnimalMotion(dt);   // 动物散步(真实时间步进,不受加速影响)
    updatePondFx(dt);         // 鱼塘跳鱼动画
    updateEggFx(dt);          // 鸡蛋弹出动画
  }
  // hover 预览
  if(G.st==='play'&&G.hover){
    const [c,r]=G.hover;
    if(G.buildMode){
      const def=BUILD_TYPES.find(b=>b.key===G.buildMode);
      const ok=canPlace(G.buildMode,c,r);
      preview.visible=true;
      preview.position.set(wx(c,def.w),0,wz(r,def.h));
      preview.children.forEach(m=>{});
      if(!preview.userData.mesh){
        preview.userData.mesh=buildModel(G.buildMode);
        preview.add(preview.userData.mesh);
      } else if(preview.userData.mesh.userData.bType!==G.buildMode){
        preview.remove(preview.userData.mesh);
        preview.userData.mesh=buildModel(G.buildMode);
        preview.add(preview.userData.mesh);
      }
      preview.userData.mesh.traverse(o=>{ if(o.isMesh) o.material=mat(ok?0x10b981:0xef4444,'basic'); });
      hoverMesh.visible=false;
    } else {
      preview.visible=false;
      hoverMesh.visible=grid[r][c]===null;
      if(hoverMesh.visible) hoverMesh.position.set(wx(c),0.05,wz(r));
    }
  } else if(preview.visible) preview.visible=false;
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);

/* ---------- 物品定义 ---------- */
const STAR_MULT=[1,1.6,2.4]; // 1★/2★/3★
const ITEMS={
  wheat:{name:'小麦',price:5}, tomato:{name:'番茄',price:12}, corn:{name:'玉米',price:19},
  pepper:{name:'辣椒',price:26}, eggplant:{name:'茄子',price:36}, mint:{name:'薄荷果',price:75},
  mandrake:{name:'蔓德拉草',price:110},
  egg:{name:'鸡蛋',price:7}, milk:{name:'牛奶',price:16}, wool:{name:'羊毛',price:20},
  pork:{name:'猪肉',price:30}, fish:{name:'鱼',price:12}, wood:{name:'木材',price:10},
  carrot:{name:'胡萝卜',price:8}, drumstick:{name:'鸡腿',price:12}, bone:{name:'肉骨头',price:15},
  fert:{name:'肥料',price:20,usable:true}, feed:{name:'饲料',price:2},
};
function itemName(key){
  const m=key.match(/^(.*?)_(\d)$/);
  if(m) return ITEMS[m[1]].name+' ★'+m[2];
  return ITEMS[key]?ITEMS[key].name:key;
}
// 金额显示统一:最多一位小数,整数不显示小数(浮点误差如 19.200000000000003 → 19.2)
function money1(v){
  return Math.round(v*10)/10;
}
function itemPrice(key,hot){
  const m=key.match(/^(.*?)_(\d)$/);
  const base=m?ITEMS[m[1]].price*STAR_MULT[+m[2]-1]:ITEMS[key].price;
  return (hot&&G.hotItems.includes(m?m[1]:key))?Math.round(base*(G.hotMult||1.4)):money1(base);
}
function addItem(key,qty){
  if(!G.bag[key]) G.bag[key]=0;
  G.bag[key]+=qty||1;
  renderBag();
}
function sellItem(key,qty){
  const n=Math.min(qty||1,G.bag[key]||0);
  if(n<=0) return 0;
  G.bag[key]-=n;
  if(G.bag[key]<=0) delete G.bag[key];
  const gain=money1(itemPrice(key,true)*n);   // true=商人高价周按高价结算(显示价=成交价)
  G.money+=gain;
  sfx('sale');
  renderBag();
  renderInfo();
  updateHUD();
  return gain;
}
function sellAll(){
  let total=0;
  for(const k of Object.keys(G.bag)) total+=sellItem(k,G.bag[k]);
  if(total>0){ toast('全部出售 +'+money1(total)+' 金币',0xf59e0b); }
}

const CROPS=[
  {key:'wheat',name:'小麦',lv:1,cost:2,grow:2,color:0xe8d44d},
  {key:'tomato',name:'番茄',lv:2,cost:5,grow:4,color:0xe85d5d},

  {key:'eggplant',name:'茄子',lv:3,cost:15,grow:7,color:0x8b5cf6},
  {key:'mint',name:'薄荷果',lv:5,cost:40,grow:10,color:0x34d399},

];
function cropDef(key){ return CROPS.find(x=>x.key===key); }
// 作物成熟度外观:叶色 绿→中间色→成熟色 三阶段 + 果实从 40% 开始长出
const CROP_GREEN=0x3a9b4e;
function mixHex(c1,c2,t){
  const r=Math.round(((c1>>16)&255)*(1-t)+((c2>>16)&255)*t);
  const g=Math.round(((c1>>8)&255)*(1-t)+((c2>>8)&255)*t);
  const b=Math.round((c1&255)*(1-t)+(c2&255)*t);
  return (r<<16)|(g<<8)|b;
}
function cropStageMats(cr){ return [mat(CROP_GREEN), mat(mixHex(CROP_GREEN,cr.color,0.5)), mat(cr.color,'basic')]; }
function tilePos(b,slot){
  const c=b.c+slot%b.w, r=b.r+Math.floor(slot/b.w);
  return [wx(c), wz(r)];
}
function buildCropVisual(cr){
  const g=new THREE.Group();
  const stageMats=cropStageMats(cr);
  const blades=[];   // 叶片(随生长阶段变色)
  let fruit=null, heads=[];
  // 三片基础叶(统一 3 片,满足测试),每种作物各自形状
  const mkLeaf=(w,h,d,x,y,z,rz,ry)=>{
    const bl=new THREE.Mesh(GEO_BOX,stageMats[0]);
    bl.scale.set(w,h,d); bl.position.set(x,y,z); bl.rotation.z=rz||0; bl.rotation.y=ry||0;
    g.add(bl); blades.push(bl);
  };
  if(cr.key==='wheat'){                       // 小麦:细叶丛 + 金黄麦穗(原始尺寸一半,紧凑不超格)
    mkLeaf(0.02,0.3,0.02,-0.05,0.16,0,0.3);
    mkLeaf(0.02,0.3,0.02,0.05,0.16,0,-0.3);
    mkLeaf(0.02,0.35,0.02,0,0.18,0,0);
    for(let i=0;i<4;i++){                     // 麦穗:4 粒交错金黄籽 + 芒
      const hd=new THREE.Mesh(GEO_SPH,stageMats[2]);
      hd.scale.set(0.022,0.055,0.022);
      hd.position.set((i%2===0?-0.015:0.015),0.39+i*0.045,0);
      hd.visible=false; g.add(hd); heads.push(hd);
    }
    for(let i=0;i<3;i++){                     // 芒:细长锥
      const aw=new THREE.Mesh(GEO_CONE,stageMats[2]);
      aw.scale.set(0.01,0.15,0.01); aw.rotation.x=Math.PI/2;
      aw.position.set((i-1)*0.022,0.59,0);
      aw.visible=false; g.add(aw); heads.push(aw);
    }
  } else if(cr.key==='tomato'){               // 番茄:大叶 + 红果挂藤
    mkLeaf(0.16,0.32,0.05,-0.14,0.34,0,0.5);
    mkLeaf(0.16,0.32,0.05,0.14,0.34,0,-0.5);
    mkLeaf(0.14,0.36,0.05,0,0.38,0,0);
    const stem=new THREE.Mesh(GEO_CYL,stageMats[0]);
    stem.scale.set(0.05,0.8,0.05); stem.position.y=0.4; g.add(stem);
    fruit=new THREE.Group();                  // 2 个红番茄 + 绿萼
    for(let i=0;i<2;i++){
      const f=new THREE.Mesh(GEO_SPH,stageMats[2]);
      f.scale.set(0.12,0.12,0.12);
      f.position.set(i===0?-0.06:0.08,0.12,0);
      fruit.add(f);
      const cal=new THREE.Mesh(GEO_CONE,stageMats[0]);
      cal.scale.set(0.06,0.05,0.06); cal.rotation.x=Math.PI;
      cal.position.set(f.position.x,f.position.y+0.1,0);
      fruit.add(cal);
    }
    fruit.position.y=0.5; g.add(fruit);
  } else if(cr.key==='corn'){                 // 玉米:宽叶 + 玉米棒 + 红须(原始尺寸一半,紧凑不超格)
    mkLeaf(0.07,0.25,0.025,-0.08,0.16,0,0.45);
    mkLeaf(0.07,0.25,0.025,0.08,0.16,0,-0.45);
    mkLeaf(0.06,0.275,0.025,0,0.18,0,0);
    const stem=new THREE.Mesh(GEO_CYL,stageMats[0]);
    stem.scale.set(0.035,0.45,0.035); stem.position.y=0.225; g.add(stem);
    const cob=new THREE.Mesh(GEO_CYL,stageMats[2]);   // 玉米棒(横放)
    cob.scale.set(0.045,0.17,0.045); cob.rotation.z=Math.PI/2;
    cob.position.set(0.07,0.31,0); cob.visible=false; g.add(cob); heads.push(cob);
    for(let i=0;i<3;i++){                             // 顶部红须
      const tassel=new THREE.Mesh(GEO_CONE,mat(0x9a5a3a,'basic'));
      tassel.scale.set(0.0075,0.09,0.0075);
      tassel.position.set(0.17,0.31+(i-1)*0.025,0);
      tassel.visible=false; g.add(tassel); heads.push(tassel);
    }

function plantCrop(b,key){
  const cr=cropDef(key);
  if(!cr) return;
  if(G.lv<cr.lv){ toast('需要小木屋 Lv'+cr.lv,0xef4444); return; }
  if(G.money<cr.cost){ toast('种子钱不够 '+cr.cost,0xef4444); return; }
  const farmCrops=G.crops.filter(c=>c.b===b);
  if(farmCrops.length>=b.w*b.h){ toast('农田已种满',0xef4444); return; }
  let slot=-1;
  for(let i=0;i<b.w*b.h;i++) if(!farmCrops.find(c=>c.slot===i)){ slot=i; break; }
  G.money-=cr.cost;
  // 品质种下时定好(40% 1星/40% 2星/20% 3星),面板直接显示,收获按此结算
  const r=Math.random();
  const c={b,slot,key,plantDay:G.day,star:r<0.4?1:(r<0.8?2:3)};
  c.grp=buildCropVisual(cr);
  const [px,pz]=tilePos(b,slot);
  c.grp.position.set(px,0.08,pz);
  scene.add(c.grp);
  G.crops.push(c);
  sfx('click');
  renderInfo(); updateHUD();
  toast(cr.name+' 已种下',0x10b981);
}
function cropMature(c){ return G.day-c.plantDay>=cropDef(c.key).grow; }
function harvestFarm(b){
  const farmCrops=G.crops.filter(c=>c.b===b);
  const ready=farmCrops.filter(cropMature);
  if(!ready.length){ toast('还没有成熟的作物',0xef4444); return; }
  ready.forEach(c=>{
    addItem(c.key+'_'+(c.star||1),1);   // 种下时已定品质
    scene.remove(c.grp);
    G.crops.splice(G.crops.indexOf(c),1);
  });
  sfx('coin');
  toast('收获 '+ready.length+' 份!',0x10b981);
  renderInfo(); renderBag(); updateHUD();
}
function fertilizeFarm(b){
  if(!G.bag.fert){ toast('没有肥料',0xef4444); return; }
  const farmCrops=G.crops.filter(c=>c.b===b);
  if(!farmCrops.length){ toast('先种点东西吧',0xef4444); return; }
  G.bag.fert--; if(G.bag.fert<=0) delete G.bag.fert;
  farmCrops.forEach(c=>{ c.plantDay-=1; });
  sfx('coin');
  toast('施肥成功,生长 +1 天',0x10b981);
  renderInfo(); renderBag();
}
function updateCrops(){
  for(const c of G.crops){
    const cr=cropDef(c.key);
    const pct=clamp((G.day-c.plantDay)/cr.grow,0,1);
    const stage=pct<0.35?0:(pct<0.7?1:2);   // 0幼苗全绿 1生长中 2成熟色
    const h=pct>0.7?0.65:0.22+pct*0.55;
    c.grp.scale.set(0.7+0.3*pct,h,0.7+0.3*pct);
    const st=c.grp.userData.stageMats;
    if(c.grp.userData.blades) c.grp.userData.blades.forEach(b=>{ b.material=st[stage]; });
    if(c.grp.userData.fruit){
      const fv=pct<0.4?0.001:(pct-0.4)/0.6;   // 果实 40% 起长出,成熟时最大
      c.grp.userData.fruit.scale.setScalar(Math.max(0.001,fv*0.2));
      // fruit 可能是 Group(多果实组合),递归设置材质
      const f=c.grp.userData.fruit;
      if(f.material!==undefined) f.material=st[stage];
      if(f.children) f.children.forEach(ch=>{ if(ch.material!==undefined) ch.material=st[stage]; });
    }
    if(c.grp.userData.heads){
      const hv=stage>=1;   // 麦穗/玉米棒生长中段起出现
      c.grp.userData.heads.forEach(hd=>{
        hd.visible=hv;
        if(hv) hd.scale.setScalar(0.5+0.5*Math.min(1,(pct-0.35)/0.65));
      });
    }
  }
}
// 农田信息面板百分比实时刷新(点选后停留界面也能看到自然增长)
function updateCropPctUI(){
  const b=G.sel;
  if(!b||b.type!=='farm'||infoEl.style.display!=='block') return;
  const crops=G.crops.filter(c=>c.b===b);
  crops.forEach((c,i)=>{
    const el=infoEl.querySelector('#cri'+i);
    if(!el) return;
    const cr=cropDef(c.key);
    const age=G.day-c.plantDay;
    if(age>=cr.grow){
      if(el.innerHTML.indexOf('可收获')<0) el.innerHTML='<span style="color:var(--gold)">可收获 ★'+c.star+'</span>';
    } else {
      el.innerHTML='<span style="color:var(--dim)">'+Math.floor(clamp(age/cr.grow,0,1)*100)+'%</span>';
    }
  });
}
// 饲料仓/鱼塘/森林存量实时刷新(和农田百分比一样,点选后停留界面数值自动更新,不必重新点击)

function renderPestBar(){

  let html='<div class="pt">🌙 夜晚!有小动物来偷东西</div><div class="row">';

    html+='<div style="text-align:center">'+def.emoji+'<br>'+def.name+'<br>'+
      '<button class="tame" data-tame="'+i+'"'+(have?'':' disabled style="opacity:.4"')+'>喂'+ITEMS[def.food].name+'</button>'+

function spawnPests(){
  if(G.petsByType.owl){ toast('🦉 猫头鹰守夜,今晚平安无事'); return; }
  if(G.petsByType.fox&&Math.random()<0.5){ toast('🦊 狐狸赶走了小偷'); return; }
  const farms=G.buildings.filter(b=>b.type==='farm').length;
  if(farms<3) return;                     // 3 片农田后才会有偷菜
  if(Math.random()>=0.3) return;          // 每天 30% 概率出现
  const def=PESTS[rndi(0,PESTS.length-1)];
  const p={key:def.key,grp:null};

  if(G.crops.length){ const c=G.crops[rndi(0,G.crops.length-1)]; pos=tilePos(c.b,c.slot); }
  else pos=[rnd(-2,2),rnd(-2,2)];
  p.x=pos[0]+rnd(-0.2,0.2); p.z=pos[1]+rnd(-0.2,0.2);
  p.grp=buildPestVisual(def.key);
  p.grp.position.set(p.x,0.05,p.z);

  G.pests.push(p);

function tamePest(i){
  const p=G.pests[i];
  if(!p) return;
  const def=PESTS.find(x=>x.key===p.key);
  if(!G.bag[def.food]){ toast('没有 '+(ITEMS[def.food]?ITEMS[def.food].name:def.food),0xef4444); return; }
  G.bag[def.food]--; if(G.bag[def.food]<=0) delete G.bag[def.food];
  G.pests.splice(i,1);
  scene.remove(p.grp);
  G.petsByType[def.key]=(G.petsByType[def.key]||0)+1;
  const pet={key:def.key,grp:buildPestVisual(def.key)};
  const pc=Object.values(G.petsByType).reduce((a,c)=>a+c,0);
  pet.grp.position.set(house.c+0.5+1.7,0.05,house.r+0.5-1.7+(pc%3)*0.5);
  scene.add(pet.grp);
  G.pets.push(pet);
  sfx('level');
  toast('驯服了 '+def.emoji+' '+def.name+'!'+petSkillDesc(def.key),0x10b981);
  renderPestBar(); renderBag(); renderInfo(); updateHUD();
}

function resolvePestTheft(){
  const dog=G.petsByType.dog||0;
  const n=dog?Math.ceil(G.pests.length/2):G.pests.length;
  const thieves=G.pests.slice(0,n);
  thieves.forEach(p=>{
    const def=PESTS.find(x=>x.key===p.key);
    if(Math.random()<0.6){
      const keys=Object.keys(G.bag);
      if(keys.length){
        const k=keys[rndi(0,keys.length-1)];
        G.bag[k]--; if(G.bag[k]<=0) delete G.bag[k];
        toast(def.emoji+' 偷走了 1 × '+itemName(k)+'!',0xef4444);
      }
    } else if(G.crops.length){
      const c=G.crops[rndi(0,G.crops.length-1)];
      c.plantDay+=1;
      toast(def.emoji+' 啃坏了一株作物!',0xef4444);
    }
  });
  G.pests.forEach(p=>scene.remove(p.grp));
  G.pests=[];
  renderPestBar(); renderBag();

/* ---------- 每日结算 ---------- */
// 离线/后台成长:按真实时间补天数(1 分钟=1 天,最多补 60 天),补跑每日结算
function catchUpTime(){
  const now=Date.now();
  const elapsedMin=(now-(G._wallTs||now))/60000;
  G._wallTs=now;
  if(elapsedMin<1) return;
  const days=Math.min(elapsedMin,60);
  G.day+=days;
  const end=Math.floor(G.day);
  let n=0;
  while(G._lastDay<end){ G._lastDay++; dailyTick(); n++; }
  if(n>0){ updateHUD(); toast('离线成长 +'+n+' 天',0xf59e0b); }
}
function dailyTick(){
  updateAnimals();
  const forests=G.buildings.filter(b=>b.type==='forest');
  if(forests.length) G.wood+=forests.length;
  const ponds=G.buildings.filter(b=>b.type==='pond');
  if(ponds.length) G.pondFish+=ponds.length;   // 鱼进鱼塘存量,点击捞鱼才收进背包
  applyPetSkills();
  updateHUD();
}
function updateAnimals(){
  if(!G.animals.length) return;
  let hungry=false;
  G.animals.forEach(a=>{
    const def=LIVESTOCK.find(l=>l.key===a.key);
    if(G.feed>=def.food){
      G.feed-=def.food;
      a.fedDays=(a.fedDays||0)+1;
      if(a.key==='pig'){
        if(a.fedDays===10) toast('🐷 有猪育肥完成,可以出栏了!',0xf59e0b);
      } else {
        addItem(def.prod,1);
        if(def.prod==='egg') spawnEggPop(a.b);   // 鸡蛋弹出动画
      }
    } else hungry=true;
  });
  if(hungry) toast('⚠ 饲料不足,动物们今天没有产出',0xef4444);
  renderBag();
}
// 动物散步:每帧在圈舍范围内随机走动(猪圈/牧场/鸡舍都动,鸡快些、牛羊猪慢些)
function updateAnimalMotion(dt){
  if(G.st!=='play') return;
  // 驯服宠物:在小屋附近随机走动(范围 house 中心 ±1.5)
  G.pets.forEach(p=>{
    const hx=wx(house.c,2), hz=wz(house.r,2);
    if(!p.walkT){ p.walkT={x:p.grp.position.x,z:p.grp.position.z,wait:rnd(0.5,2)}; }
    const wt=p.walkT;
    wt.wait-=dt;
    if(wt.wait<=0){
      const ang=rnd(0,Math.PI*2);
      wt.x=hx+Math.cos(ang)*rnd(0.6,1.6);
      wt.z=hz+Math.sin(ang)*rnd(0.6,1.6);
      wt.wait=rnd(1.5,4.5);
    }
    const dx=wt.x-p.grp.position.x, dz=wt.z-p.grp.position.z;
    const dist=Math.hypot(dx,dz);
    const spd=0.35*dt;
    if(dist>spd){
      p.grp.position.x+=dx/dist*spd;
      p.grp.position.z+=dz/dist*spd;
      p.grp.rotation.y=Math.atan2(dx,dz);
      wt.phase=(wt.phase||0)+dt*10;
      p.grp.position.y=0.05+Math.abs(Math.sin(wt.phase))*0.03;
    } else {
      p.grp.rotation.y+=dt*1.5;
      p.grp.position.y=0.05;
    }
  });
  if(!G.animals.length) return;
  G.animals.forEach(a=>{
    const b=a.b;
    if(!b) return;
    // 建筑占地世界范围:wx(c,w) 中心 ± w/2
    const cx=wx(b.c,b.w), cz=wz(b.r,b.h);
    const hw=b.w/2-0.25, hz=b.h/2-0.25;   // 边缘留 0.25 不出栏
    if(!a.walkT){ a.walkT={x:a.x,z:a.z,wait:rnd(0.5,2)}; }
    const wt=a.walkT;
    wt.wait-=dt;
    if(wt.wait<=0){
      wt.x=cx+rnd(-hw,hw);
      wt.z=cz+rnd(-hz,hz);
      wt.wait=rnd(1.5,4.5);
    }
    const dx=wt.x-a.x, dz=wt.z-a.z;
    const dist=Math.hypot(dx,dz);
    const spd=(a.key==='chicken'?0.5:0.3)*dt;
    if(dist>spd){
      a.x+=dx/dist*spd;
      a.z+=dz/dist*spd;
      a.grp.rotation.y=Math.atan2(dx,dz);
      // 走路起伏(幅度小,不突兀)
      wt.phase=(wt.phase||0)+dt*10;
      a.grp.position.y=0.05+Math.abs(Math.sin(wt.phase))*0.04;
    } else {
      a.grp.rotation.y+=dt*1.5;           // 原地停留时微微转悠
      a.grp.position.y=0.05;
    }
    a.grp.position.x=a.x;
    a.grp.position.z=a.z;
  });
}
function applyPetSkills(){
  if(G.petsByType.rabbit) G.money+=2*G.petsByType.rabbit;
  if(G.petsByType.raccoon) G.wood+=G.petsByType.raccoon;
}

// 每秒 10% 概率从鱼塘跳出一条鱼又落下(给死板的鱼塘加点生气)
function updatePondFx(dt){
  if(G.st!=='play') return;
  // 每个鱼塘每秒约 10% 概率触发一次跳鱼
  const ponds=G.buildings.filter(b=>b.type==='pond');
  for(const b of ponds){
    if(Math.random()<0.10*dt&&G.pondFx.length<6){
      const cx=wx(b.c,b.w), cz=wz(b.r,b.h);
      const g=new THREE.Group();
      const body=new THREE.Mesh(GEO_SPH,mat(0x7dd3fc,'basic')); body.scale.set(0.13,0.06,0.2); g.add(body);
      const tail=new THREE.Mesh(GEO_CONE,mat(0xf59e0b,'basic')); tail.scale.set(0.07,0.12,0.02); tail.rotation.x=Math.PI/2; tail.position.z=-0.16; g.add(tail);
      g.position.set(cx+rnd(-0.5,0.5),0.06,cz+rnd(-0.5,0.5));
      g.rotation.y=rnd(0,Math.PI*2);
      scene.add(g);
      G.pondFx.push({grp:g,t:0,dur:0.9+rnd(0,0.3),cx,cz,base:0.06});
    }
  }
  // 更新跳鱼:抛物线升起又落下
  for(let i=G.pondFx.length-1;i>=0;i--){
    const f=G.pondFx[i];
    f.t+=dt;
    const p=f.t/f.dur;
    if(p>=1){ scene.remove(f.grp); G.pondFx.splice(i,1); continue; }
    const h=Math.sin(Math.PI*p)*0.55;          // 0→顶→0 抛物线
    f.grp.position.y=f.base+h;
    f.grp.rotation.z=Math.sin(p*Math.PI)*0.5;  // 鱼身随跳跃微微摆动
    f.grp.rotation.y+=dt*3;                    // 旋转翻滚
  }
}

      renderMerchant(); updateHUD();

  });

  const sail=new THREE.Mesh(GEO_CONE,mat(0xf5f0e0)); sail.scale.set(0.45,0.7,0.08); sail.rotation.x=Math.PI/2; sail.position.set(0,0.95,-0.3); g.add(sail);
  return g;
}
function buildLuxuryVisual(key){
  const def=luxDef(key);
  if(def.type==='car') return buildCarModel(def.color);
  if(def.type==='plane') return buildPlaneModel(def.color);
  return buildYachtModel(def.color);
}
// 地图上方奢侈品展示区:农村范围外的上方一排车位,默认隐藏,购第一件后显示
const LUX_BAY_Z=-2.2;                    // 展示区 z(网格上方,z 负方向=屏幕上方)
const LUX_BAY_X0=1.0, LUX_BAY_DX=1.4;    // 车位起点与间距(横向 9 个)
let luxBay=null;                         // 展示区底座(金色车位带)
function buildLuxBay(){
  if(luxBay) return luxBay;
  luxBay=new THREE.Group();
  // 深色平台
  const plat=new THREE.Mesh(GEO_BOX,mat(0x23261f));
  plat.scale.set(COLS+1,0.06,2.2);
  plat.position.set(CX,0.02,LUX_BAY_Z);
  luxBay.add(plat);
  // 金色边线(前/后)
  for(const zz of [LUX_BAY_Z-1.05,LUX_BAY_Z+1.05]){
    const edge=new THREE.Mesh(GEO_BOX,mat(0xd9a520,'basic'));
    edge.scale.set(COLS+1,0.03,0.04);
    edge.position.set(CX,0.05,zz);
    luxBay.add(edge);
  }
  // 车位分隔线(9 车位 → 8 条分隔)
  for(let i=1;i<9;i++){
    const div=new THREE.Mesh(GEO_BOX,mat(0x3f3f46,'basic'));
    div.scale.set(0.03,0.03,2.0);
    div.position.set(LUX_BAY_X0+i*LUX_BAY_DX-0.7,0.05,LUX_BAY_Z);
    luxBay.add(div);
  }
  luxBay.visible=false;                  // 默认不显示
  scene.add(luxBay);
  return luxBay;
}
function placeLuxuries(){
  if(!luxBay) buildLuxBay();
  luxBay.visible=G.luxuries.length>0;    // 购买第一个奢侈品后显示
  // 清除旧摆放,按购买顺序重排(先买的靠左,依次往右)
  G.luxuries.forEach(l=>{ if(l.grp) scene.remove(l.grp); });
  G.luxuries.forEach((l,i)=>{
    const def=luxDef(l.key);
    l.grp=buildLuxuryVisual(l.key);
    l.grp.position.set(LUX_BAY_X0+i*LUX_BAY_DX,0.1,LUX_BAY_Z);
    l.grp.rotation.y=(def&&def.type==='yacht')?Math.PI:0;  // 车/机头朝镜头,游艇掉头船头朝镜头
    scene.add(l.grp);
  });
}
function buyLuxury(key){
  const def=luxDef(key);
  if(!def) return;
  if(G.luxuries.find(l=>l.key===key)){ toast('已经拥有这艘/这辆了',0xef4444); return; }
  if(G.money<def.price){ toast('金币不足,还需要 '+money1(def.price-G.money)+' 金',0xef4444); return; }
  G.money-=def.price;
  G.luxuries.push({key});
  placeLuxuries();
  sfx('coin');
  toast('🎉 喜提 '+def.name+'!已停放在上方展示区',0xfacc15);
  renderLuxury(); updateHUD(); saveGame();
}
function renderLuxury(){
  const el=$('luxury');
  const owned=G.luxuries.map(l=>l.key);
  let html='<h2>🚁 奢侈品商人 · LUXURY</h2><div class="sub">房屋 Lv6+ 每 30 天到访一次 · 豪车 / 飞机 / 游艇 · 金库 '+money1(G.money)+' 金</div>';
  const types=[['car','🏎 豪车'],['plane','✈️ 飞机'],['yacht','🛥 游艇']];
  types.forEach(([t,tname])=>{
    html+='<div class="sec">— '+tname+' —</div><div class="grid">';
    LUXURY_GOODS.filter(g=>g.type===t).forEach(gd=>{
      const has=owned.includes(gd.key);
      html+='<div class="item'+(has?' owned':'')+'" data-lux="'+gd.key+'"><b>'+(has?'✓ ':'' )+gd.name+'</b><br>'+
        '<span class="p">'+gd.price.toLocaleString()+' 金</span><br><span style="color:var(--dim)">'+gd.desc+'</span></div>';
    });
    html+='</div>';
  });
  html+='<div style="text-align:center"><button class="close" id="lClose">完成选购</button></div>';
  el.querySelector('.box').innerHTML=html;
  el.querySelectorAll('[data-lux]').forEach(bd=>{
    if(bd.classList.contains('owned')) return;
    bd.onclick=()=>buyLuxury(bd.dataset.lux);
  });
  const c=el.querySelector('#lClose');
  if(c) c.onclick=closeLuxury;
}
function openLuxury(){
  if(!G.lux) return;
  G.st='merchant';
  $('luxury').style.display='flex';
  renderLuxury();
}
function closeLuxury(){
  G.st='play';
  G.luxHandled=true;
  G.luxPending=false;
  $('luxury').style.display='none';
  saveGame();
}
$('luxBar').onclick=openLuxury;

/* ---------- 存档 ---------- */
const SAVE_KEY='happy_farm_v1';
function clearSceneObjects(){
  G.buildings.forEach(b=>scene.remove(b.grp));
  G.crops.forEach(c=>scene.remove(c.grp));
  G.animals.forEach(a=>scene.remove(a.grp));
  G.pests.forEach(p=>scene.remove(p.grp));
  G.pets.forEach(p=>scene.remove(p.grp));
  G.pondFx.forEach(f=>scene.remove(f.grp));   // 跳鱼特效
  G.eggFx.forEach(f=>scene.remove(f.grp));    // 鸡蛋弹出特效
  G.luxuries.forEach(l=>{ if(l.grp) scene.remove(l.grp); });   // 奢侈品展示
  scene.remove(house.grp);
  G.buildings=[];G.crops=[];G.animals=[];G.pests=[];G.pets=[];G.pondFx=[];G.eggFx=[];
}
function saveGame(){
  if(G.st==='menu') return;
  const bIdx={}; G.buildings.forEach((b,i)=>bIdx[b.id]=i);
  const data={
    money:G.money,lv:G.lv,day:G.day,ts:Date.now(),
    buildings:G.buildings.map(b=>({type:b.type,c:b.c,r:b.r})),
    crops:G.crops.map(c=>({b:bIdx[c.b.id],slot:c.slot,key:c.key,plantDay:c.plantDay,star:c.star})),
    animals:G.animals.map(a=>({key:a.key,b:bIdx[a.b.id],fedDays:a.fedDays,x:a.x,z:a.z})),
    bag:G.bag,feed:G.feed,wood:G.wood,pondFish:G.pondFish,petsByType:G.petsByType,
    luxuries:G.luxuries.map(l=>({key:l.key})),
    hotItems:G.hotItems,hotMult:G.hotMult||1.4,saleItems:G.saleItems,saleMult:G.saleMult||1,merchantHandled:G.merchantHandled,
  };
  G.best.day=Math.max(G.best.day,dayInt());
  G.best.money=Math.max(G.best.money,G.money);
  data.best=G.best;
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(data)); }catch(e){}
  $('bestShow').textContent=G.best.day>0?('第 '+G.best.day+' 天 / '+money1(G.best.money)+' 金'):'-';
}
function loadGame(){
  let data=null;
  try{ data=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(!data) return false;
  clearSceneObjects();
  G.money=data.money; G.lv=data.lv||1; G.day=data.day||1;
  G.feed=data.feed||0; G.wood=data.wood||0; G.pondFish=data.pondFish||0;
  G.bag=data.bag||{}; G.petsByType=data.petsByType||{};
  G.hotItems=data.hotItems||[]; G.hotMult=data.hotMult||1.4; G.hotSet=false;
  G.saleItems=data.saleItems||[]; G.saleMult=data.saleMult||1;
  G.merchantHandled=!!data.merchantHandled; G.merchantPending=false;
  G.best=data.best||{day:0,money:0};
  G._lastDay=Math.floor(G.day);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) grid[r][c]='locked';
  refreshUnlock();
  placeHouseGrid();       // 房屋放回网格(否则点房子弹不出升级面板)
  data.buildings.forEach(bd=>{
    const def=BUILD_TYPES.find(t=>t.key===bd.type);
    if(!def) return;
    const b={type:bd.type,key:bd.type,c:bd.c,r:bd.r,w:def.w,h:def.h,grp:null};
    b.id=++G.bidSeq;
    b.grp=buildModel(bd.type);
    b.grp.position.set(wx(bd.c,def.w),0,wz(bd.r,def.h));
    scene.add(b.grp);
    for(let dc=0;dc<def.w;dc++) for(let dr=0;dr<def.h;dr++) grid[bd.r+dr][bd.c+dc]=b;
    G.buildings.push(b);
  });
  house.grp=buildModel('house');
  house.grp.position.set(wx(house.c,2),0,wz(house.r,2));
  scene.add(house.grp);
  data.crops.forEach(cd=>{
    const b=G.buildings[cd.b];
    if(!b||!cropDef(cd.key)) return;
    const c={b,slot:cd.slot,key:cd.key,plantDay:cd.plantDay,star:cd.star||(Math.random()<0.4?1:(Math.random()<0.8?2:3))};
    c.grp=buildCropVisual(cropDef(cd.key));
    const [px,pz]=tilePos(b,cd.slot);
    c.grp.position.set(px,0.08,pz);
    scene.add(c.grp);
    G.crops.push(c);
  });
  data.animals.forEach(ad=>{
    const b=G.buildings[ad.b];
    if(!b) return;
    const a={key:ad.key,b,grp:buildAnimalVisual(ad.key),fedDays:ad.fedDays||0};
    // 旧存档动物坐标是修复前的旧世界坐标(偏移-6/-4),超出建筑范围则重置(迁移)
    a.x=ad.x!==undefined&&Math.abs(ad.x-(b.c-0.5))<b.w+0.5?ad.x:b.c-0.5+rnd(0.4,b.w-0.4);
    a.z=ad.z!==undefined&&Math.abs(ad.z-(b.r-0.5))<b.h+0.5?ad.z:b.r-0.5+rnd(0.4,b.h-0.4);
    a.grp.position.set(a.x,0.05,a.z);
    scene.add(a.grp);
    G.animals.push(a);
  });
  let pc=0;
  for(const t of Object.keys(G.petsByType)){
    for(let i=0;i<G.petsByType[t];i++){
      const pet={key:t,grp:buildPestVisual(t)};
      pet.grp.position.set(house.c+0.5+1.7,0.05,house.r+0.5-1.7+(pc%3)*0.5);
      scene.add(pet.grp);
      G.pets.push(pet); pc++;
    }
  }
  refreshLockVisual();
  // 奢侈品展示恢复
  G.luxuries=(data.luxuries||[]).map(l=>({key:l.key}));
  placeLuxuries();
  G._wallTs=data.ts||Date.now();   // 离线成长锚点(旧存档无 ts 则从现在起算)
  catchUpTime();                   // 离开期间的作物/动物按真实时间补成长
  G.st='play';
  buildMenu(); renderBag(); renderInfo(); updateHUD();
  $('menuOv').classList.add('hide');
  $('bestShow').textContent=G.best.day>0?('第 '+G.best.day+' 天 / '+money1(G.best.money)+' 金'):'-';
  toast('欢迎回来!第 '+dayInt()+' 天',0x10b981);
  return true;
}
$('merchantBar').onclick=openMerchant;
window.addEventListener('beforeunload',saveGame);
document.addEventListener('visibilitychange',()=>{   // 切回标签页时补后台流失的时间
  if(document.visibilityState==='visible'&&(G.st==='play'||G.st==='merchant')){ catchUpTime(); saveGame(); }
});
setInterval(()=>saveGame(),15000);
$('btnContinue').onclick=()=>{ if(!loadGame()){ toast('没有存档',0xef4444); } };
if(localStorage.getItem(SAVE_KEY)) $('btnContinue').style.display='inline-block';

window.__FARM__={G,BUILD_TYPES,HOUSE,house,UPGRADE_COST,upgradeCost,ITEMS,STAR_MULT,CROPS,LIVESTOCK,PESTS,MERCHANT_GOODS,LUXURY_GOODS,luxDef,buildLuxuryVisual,placeLuxuries,buildLuxBay,luxBay,buyLuxury,renderLuxury,openLuxury,closeLuxury,grid,COLS,ROWS,CX,CZ,wx,wz,isUnlocked,refreshUnlock,canPlace,buildBuilding,removeBuilding,pickCell,scene,cam,renderer,ground,buildModel,sfx,toast,rnd,rndi,clamp,$,refreshLockVisual,itemName,itemPrice,money1,addItem,sellItem,sellAll,renderBag,renderInfo,showInfo,hideInfo,hidePreview,startGame,updateHUD,toggleSpeed,updateTime,dayInt,hourOf,spawnPests,plantCrop,harvestFarm,fertilizeFarm,buyFeed,feedCap,updateAnimals,updateAnimalMotion,updatePondFx,spawnEggPop,updateEggFx,catchFish,upgradeHouse,cropDef,cropMature,updateCrops,buyAnimal,sellPig,tamePest,scarePest,resolvePestTheft,dailyTick,applyPetSkills,renderPestBar,rollMerchant,renderMerchant,openMerchant,closeMerchant,saveGame,loadGame,clearSceneObjects,buildCropVisual,updateCropPctUI,updateResourceUI};

})();
</script>
