<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>抢滩登陆 Beach Head · ruimakes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#09090b}
body{font-family:'Courier New',monospace;color:#e4e4e7;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cross{position:fixed;width:22px;height:22px;pointer-events:none;transform:translate(-50%,-50%);z-index:5;display:none}
#cross::before,#cross::after{content:'';position:absolute;background:#10b981}
#cross::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#cross::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#cross .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;background:#10b981;transform:translate(-50%,-50%);border-radius:50%}
.hud{position:fixed;z-index:6;pointer-events:none;letter-spacing:1px}
#hudTL{top:12px;left:14px;display:flex;flex-direction:column;gap:6px}
#hudTR{top:12px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.panel{background:rgba(9,9,11,.72);border:1px solid #27272a;border-radius:4px;padding:6px 10px;font-size:12px;line-height:1.6}
.panel .k{color:#71717a;font-size:10px;text-transform:uppercase}
.panel .v{color:#facc15;font-weight:bold;font-size:15px}
.panel .v.g{color:#10b981}
.panel .v.r{color:#f87171}
#hudW{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:8px;pointer-events:none}
.wslot{background:rgba(9,9,11,.72);border:1px solid #27272a;border-radius:4px;padding:6px 10px;text-align:center;min-width:86px;pointer-events:none}
.wslot.cur{border-color:#10b981;box-shadow:0 0 8px rgba(16,185,129,.25)}
.wslot .wn{font-size:11px;color:#a1a1aa}
.wslot .wa{font-size:13px;font-weight:bold;color:#facc15}
.wslot .wb{font-size:9px;color:#71717a}
#heat{height:4px;background:#27272a;border-radius:2px;margin-top:4px;overflow:hidden}
#heat i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#10b981,#facc15,#ef4444)}
#baseBar{width:150px;height:8px;background:#27272a;border-radius:4px;overflow:hidden}
#baseBar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#facc15);transition:width .2s}
#combo{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:6;font-size:26px;font-weight:bold;color:#facc15;text-shadow:0 0 12px rgba(250,204,21,.5);pointer-events:none;display:none}
.ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(9,9,11,.88);text-align:center;padding:20px;gap:12px}
.ov.show{display:flex}
.t1{color:#facc15;font-size:44px;letter-spacing:10px;font-weight:bold;text-shadow:3px 3px 0 #7c2d12}
.t2{color:#10b981;font-size:16px;letter-spacing:6px}
.desc{color:#a1a1aa;font-size:14px;line-height:2}
.desc b{color:#facc15}
.btn{background:#10b981;color:#09090b;border:none;border-radius:4px;padding:14px 44px;font-size:17px;font-weight:bold;letter-spacing:3px;cursor:pointer;font-family:inherit}
.btn:hover{background:#34d399}
.btn.alt{background:#27272a;color:#e4e4e7;border:1px solid #3f3f46}
.btn.alt:hover{border-color:#10b981}
#upgRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#fireBtn{position:fixed;right:18px;bottom:22px;width:84px;height:84px;border-radius:50%;background:rgba(220,38,38,.85);border:3px solid #7f1d1d;color:#fff;font-size:15px;font-weight:bold;letter-spacing:1px;cursor:pointer;z-index:7;display:none;touch-action:none;font-family:inherit}
#fireBtn:active{background:#ef4444;transform:scale(.95)}
#mbtn{position:fixed;top:12px;right:14px;z-index:8;background:rgba(9,9,11,.72);border:1px solid #27272a;color:#e4e4e7;width:34px;height:34px;border-radius:4px;font-size:16px;cursor:pointer}
#vbtn{position:fixed;top:54px;right:14px;z-index:8;background:rgba(9,9,11,.72);border:1px solid #27272a;color:#10b981;height:34px;padding:0 10px;border-radius:4px;font-size:11px;font-weight:bold;letter-spacing:1px;cursor:pointer;font-family:inherit}
#vbtn:hover{border-color:#10b981}
footer{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);color:#3f3f46;font-size:9px;letter-spacing:2px;text-transform:uppercase;z-index:2;pointer-events:none}
@media (pointer:coarse){#fireBtn{display:block}.wslot{min-width:70px;padding:4px 8px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cross"><span class="dot"></span></div>
<div id="hudTL" class="hud">
  <div class="panel"><span class="k">Wave</span><br><span id="hWave" class="v">1</span></div>
  <div class="panel"><span class="k">Score</span><br><span id="hScore" class="v">000000</span></div>
  <div class="panel"><span class="k">Hi-Score</span><br><span id="hHi" class="v">000000</span></div>
</div>
<div id="hudTR" class="hud">
  <div class="panel"><span class="k">Beachhead</span><br>
    <div id="baseBar"><i style="width:100%"></i></div>
    <span id="hBase" class="v" style="font-size:11px">100</span></div>
  <div class="panel"><span class="k">Enemies</span><br><span id="hEnemy" class="v">0</span></div>
</div>
<div id="hudW">
  <div class="wslot cur" data-w="0"><div class="wn">1 机枪 MG</div><div class="wa" id="w0a">∞</div><div id="heat"><i></i></div></div>
  <div class="wslot" data-w="1"><div class="wn">2 加农炮</div><div class="wa" id="w1a">12</div><div class="wb">溅射伤害</div></div>
  <div class="wslot" data-w="2"><div class="wn">3 导弹</div><div class="wa" id="w2a">6</div><div class="wb">对空锁定</div></div>
</div>
<div id="combo"></div>
<button id="mbtn" title="静音(M)">🔊</button>
<button id="vbtn" title="切换视角(C)">第一视角</button>
<button id="fireBtn">FIRE</button>
<div id="ovMenu" class="ov show">
  <div class="t1">抢滩登陆</div>
  <div class="t2">BEACH HEAD</div>
  <div class="desc">
    守住滩头阵地,击退每一波登陆!<br>
    <b>鼠标</b> 瞄准(点击画面锁定,ESC释放) · <b>左键/空格</b> 射击<br>
    <b>方向键/WASD</b> 也可控制炮口 · <b>1/2/3</b> 切换武器 · <b>C</b> 切换视角<br>
    机枪扫步兵,加农炮轰坦克,导弹打直升机<br>
    <span style="color:#f87171">⚠ 敌人冲进滩头 = 阵地失守!</span>
  </div>
  <button id="btnStart" class="btn">▶ 开始战斗</button>
</div>
<div id="ovUpg" class="ov">
  <div class="t2" style="font-size:20px">第 <span id="upWave" style="color:#facc15">2</span> 波来袭</div>
  <div class="desc">弹药已补给 · 选择一项强化:</div>
  <div id="upgRow">
    <button class="btn alt" data-up="0">⚡ 强化枪管<br><small>射速 +15%</small></button>
    <button class="btn alt" data-up="1">💥 高爆弹药<br><small>伤害 +20%</small></button>
    <button class="btn alt" data-up="2">🛡 修复掩体<br><small>阵地血量 +30</small></button>
  </div>
</div>
<div id="ovOver" class="ov">
  <div class="t1" style="font-size:30px;letter-spacing:6px">阵地失守</div>
  <div class="desc" id="overTxt"></div>
  <button id="btnAgain" class="btn">↻ 重新登陆</button>
</div>
<footer>RUIMAKES SECURITY LABS</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ================= 基础 ================= */
const CV=document.getElementById('cv');
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=(n,l)=>String(n).padStart(l,'0');

/* ================= 游戏状态 ================= */
const G={
 st:'menu',wave:1,score:0,hi:+(localStorage.getItem('bh_hi')||0),
 baseHP:100,baseMax:100,combo:0,comboT:0,
 ammo:{cannon:12,missile:6},upg:{rate:1,dmg:1},
 spawnQ:[],spawnT:0,enemies:[],bullets:[],fx:[],smokes:[],
 weapon:0,mgHeat:0,mgCd:0,canCd:0,msCd:0,waveClearT:0,
 muted:false,touchAim:false,lastPX:0,lastPY:0,yaw:Math.PI,pitch:-0.15,view:'fp'
};
const ENEMY={
 soldier:{hp:2,score:10,reach:8},
 boat:{hp:30,score:30},
 tank:{hp:120,score:80,reach:25},
 heli:{hp:80,score:100},
 jet:{hp:60,score:150},
 boss:{hp:1000,score:1000}
};

/* ================= Three.js 场景 ================= */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x9fd4ef,60,220);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,400);
camera.position.set(0,8.0,15.5);
camera.lookAt(0,0.5,-42);
const renderer=new THREE.WebGLRenderer({canvas:CV,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const sun=new THREE.DirectionalLight(0xfff2cc,0.9);
sun.position.set(40,60,20);
scene.add(sun);

/* ---- 天空云朵 ---- */
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true});
const clouds=[];
for(let i=0;i<8;i++){
 const c=new THREE.Mesh(new THREE.BoxGeometry(rnd(6,12),0.7,rnd(3,6)),cloudMat);
 c.position.set(rnd(-70,70),rnd(26,40),rnd(-120,-20));
 c.rotation.y=rnd(0,Math.PI);
 scene.add(c);clouds.push(c);
}

/* ---- 大海(波浪动画) ---- */
const sea=new THREE.Mesh(
 new THREE.PlaneGeometry(320,160,48,32),
 new THREE.MeshLambertMaterial({color:0x2a6db0,flatShading:true})
);
sea.rotation.x=-Math.PI/2;
sea.position.set(0,0,-68);
scene.add(sea);
const seaPos=sea.geometry.attributes.position;

/* ---- 沙滩 ---- */
const beach=new THREE.Mesh(
 new THREE.PlaneGeometry(140,18,1,1),
 new THREE.MeshLambertMaterial({color:0xe8d29a,flatShading:true})
);
beach.rotation.x=-Math.PI/2;
beach.position.set(0,0.02,3);
scene.add(beach);

/* ---- 悬崖高地(玩家在制高点,海面在下方) ---- */
const cliffMat=new THREE.MeshLambertMaterial({color:0xc4a86a,flatShading:true});
const cliff=new THREE.Mesh(new THREE.BoxGeometry(50,6.6,1.6),cliffMat);
cliff.position.set(0,3.3,8.8);
scene.add(cliff);
const top=new THREE.Mesh(new THREE.BoxGeometry(56,0.5,5),cliffMat);
top.position.set(0,6.35,12.5);
scene.add(top);

/* ---- 远处沙丘 ---- */
const dune=new THREE.Mesh(
 new THREE.PlaneGeometry(160,18,1,1),
 new THREE.MeshLambertMaterial({color:0xd9c287,flatShading:true})
);
dune.rotation.x=-Math.PI/2;
dune.position.set(0,0.04,24);
scene.add(dune);

/* ---- 阵地掩体(沙袋) ---- */
const GUN_POS=new THREE.Vector3(0,6.6,12);
const BASE_TARGET=new THREE.Vector3(0,0,5); // 敌人冲击点:悬崖脚下的滩头
const groundY=(x,z)=>z>=8?6.6:0;             // 地形高度:悬崖面以上6.6,海/滩0
const bagMat=new THREE.MeshLambertMaterial({color:0x8a7a52,flatShading:true});
for(let i=0;i<7;i++){
 const a=(i/7)*Math.PI*2;
 const bag=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.5,1.1,7),bagMat);
 bag.position.set(GUN_POS.x+Math.cos(a)*1.15,GUN_POS.y+0.35,GUN_POS.z+Math.sin(a)*1.15);
 scene.add(bag);
}
/* 沙袋圈底部平台 */
const plat=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.7,0.4,10),bagMat);
plat.position.set(GUN_POS.x,GUN_POS.y+0.1,GUN_POS.z);
scene.add(plat);

/* ---- 炮台 ---- */
const turret=new THREE.Group();
const baseGun=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.45,0.8,8),new THREE.MeshLambertMaterial({color:0x4a5568,flatShading:true}));
baseGun.position.y=0.5;turret.add(baseGun);
const mount=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,0.5,6),new THREE.MeshLambertMaterial({color:0x2d3748,flatShading:true}));
mount.position.y=0.9;turret.add(mount);
/* 炮管(沿+Z) */
const barrelGrp=new THREE.Group();
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,2.4,8),new THREE.MeshLambertMaterial({color:0x1f2937,flatShading:true}));
barrel.rotation.x=Math.PI/2;barrel.position.z=1.2;barrelGrp.add(barrel);
const muzzle=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.15,0.35,8),new THREE.MeshLambertMaterial({color:0x374151,flatShading:true}));
muzzle.rotation.x=Math.PI/2;muzzle.position.z=2.5;barrelGrp.add(muzzle);
const shield=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.45,0.3),new THREE.MeshLambertMaterial({color:0x2d3748,flatShading:true}));
shield.position.z=0.55;barrelGrp.add(shield);
barrelGrp.position.y=1.25;
turret.add(barrelGrp);
turret.position.set(GUN_POS.x,GUN_POS.y,GUN_POS.z);
scene.add(turret);

/* 枪口世界位置(每帧更新) */
const muzzlePos=new THREE.Vector3(GUN_POS.x,7.9,GUN_POS.z);
const aimDir=new THREE.Vector3(0,0,-1);

/* ================= 粒子系统 ================= */
const MAXP=800;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(MAXP*3);
const pCol=new Float32Array(MAXP*3);
const pSize=new Float32Array(MAXP);
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSize,1));
const softTex=(()=>{
 const c=document.createElement('canvas');c.width=c.height=64;
 const g=c.getContext('2d');
 const grd=g.createRadialGradient(32,32,0,32,32,32);
 grd.addColorStop(0,'rgba(255,255,255,1)');grd.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=grd;g.fillRect(0,0,64,64);
 const t=new THREE.CanvasTexture(c);return t;
})();
const pMat=new THREE.PointsMaterial({size:1,map:softTex,transparent:true,depthWrite:false,vertexColors:true,sizeAttenuation:true});
const points=new THREE.Points(pGeo,pMat);
points.frustumCulled=false;
scene.add(points);
const parts=[]; // {pos,vel,life,max,col,size}
function spawnPart(x,y,z,vx,vy,vz,life,col,size){
 if(parts.length>=MAXP)return;
 parts.push({x,y,z,vx,vy,vz,life,max:life,col,size});
}
function burst(x,y,z,n,speed,col,life){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,b=Math.acos(rnd(-1,1)),s=rnd(0.3,1)*speed;
  spawnPart(x,y,z,Math.sin(b)*Math.cos(a)*s,Math.sin(b)*Math.sin(a)*s,Math.cos(b)*s,life||rnd(0.5,1.2),col||0xffb84d,rnd(1,3));
 }
}

/* ================= 爆炸特效 ================= */
function explode(pos,big){
 sfx('boom');
 const p=pos;
 burst(p.x,p.y,p.z,big?36:16,big?16:9,0xff8c2a,0.7);
 burst(p.x,p.y,p.z,big?14:6,big?7:4,0x3f3f46,1.4); // 烟
 const f=new THREE.Mesh(new THREE.SphereGeometry(0.6,8,6),new THREE.MeshBasicMaterial({color:0xffd400,transparent:true}));
 f.position.copy(p);scene.add(f);
 G.fx.push({m:f,t:0,life:0.35,type:'flash'});
 const r=new THREE.Mesh(new THREE.RingGeometry(0.4,0.55,20),new THREE.MeshBasicMaterial({color:0xffb84d,transparent:true,side:THREE.DoubleSide}));
 r.rotation.x=-Math.PI/2;r.position.set(p.x,0.1,p.z);scene.add(r);
 G.fx.push({m:r,t:0,life:0.5,type:'ring'});
}
function splash(pos){
 burst(pos.x,0,pos.z,10,6,0xbfe0ff,0.6);
}

/* ================= 子弹/弹丸 ================= */
function muzzleWorld(){
 const f=aimDir;
 return new THREE.Vector3(
  muzzlePos.x+f.x*2.6,
  muzzlePos.y+f.y*2.6,
  muzzlePos.z+f.z*2.6
 );
}
function muzzleFlash(){
 const f=new THREE.Mesh(new THREE.SphereGeometry(0.4,6,4),new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true}));
 f.position.copy(muzzleWorld());scene.add(f);
 G.fx.push({m:f,t:0,life:0.07,type:'flash'});
}
function fireMG(){
 const p=muzzleWorld(),f=aimDir.clone().add(new THREE.Vector3(rnd(-0.012,0.012),rnd(-0.012,0.012),rnd(-0.012,0.012))).normalize();
 const len=2.6;
 const m=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,len),
  new THREE.MeshBasicMaterial({color:0xfff3b0}));
 m.position.copy(p).addScaledVector(f,len/2);
 m.lookAt(p.x+f.x*5,p.y+f.y*5,p.z+f.z*5);
 scene.add(m);
 G.bullets.push({kind:'mg',m,p:p.clone(),v:f.clone(),spd:120,life:0.6,dmg:1});
}
function fireCannon(){
 const p=muzzleWorld(),f=aimDir;
 const m=new THREE.Mesh(new THREE.SphereGeometry(0.16,6,5),
  new THREE.MeshBasicMaterial({color:0x222222}));
 m.position.copy(p);scene.add(m);
 G.bullets.push({kind:'shell',m,p:p.clone(),v:f.clone(),spd:65,life:3,dmg:60,grav:26});
}
function fireMissile(){
 const p=muzzleWorld(),f=aimDir;
 const m=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.7,6),
  new THREE.MeshBasicMaterial({color:0xef4444}));
 m.rotation.x=Math.PI/2;m.position.copy(p);scene.add(m);
 G.bullets.push({kind:'missile',m,p:p.clone(),v:f.clone(),spd:70,life:4,dmg:110,target:findAirTarget(),age:0});
}
function findAirTarget(){
 let best=null,bd=1e9;
 for(const e of G.enemies){
  if(e.type!=='heli'&&e.type!=='jet'&&e.type!=='boss')continue;
  const d=e.mesh.position.distanceTo(muzzlePos);
  if(d<bd){bd=d;best=e;}
 }
 return best;
}
function updateBullets(dt){
 for(const b of G.bullets){
  b.life-=dt;
  if(b.kind==='shell'){
   b.v.y-=b.grav*dt;b.p.addScaledVector(b.v,dt);
   if(Math.random()<0.6)spawnPart(b.p.x,b.p.y,b.p.z,rnd(-0.4,0.4),rnd(0.3,0.8),rnd(-0.4,0.4),0.5,0xbbbbbb,1.1);
  }
  else if(b.kind==='missile'){
   b.age+=dt;
   if(b.target&&b.target.dead){b.target=findAirTarget();}
   if(b.target&&b.age>0.15){
    const tp=b.target.mesh.position,tv=tp.clone().sub(b.p).normalize();
    b.v.lerp(tv,dt*3).normalize().multiplyScalar(70);
   }
   b.p.addScaledVector(b.v,dt);
   spawnPart(b.p.x,b.p.y,b.p.z,-b.v.x*0.15+rnd(-0.3,0.3),-b.v.y*0.15+rnd(-0.3,0.3),-b.v.z*0.15+rnd(-0.3,0.3),0.3,0xff8c2a,1.4);
  }
  else if(b.kind==='bomb'){b.v.y-=b.grav*dt;b.p.addScaledVector(b.v,dt);}
  else{b.p.addScaledVector(b.v,dt);}
  b.m.position.copy(b.p);
  if(b.kind==='missile')b.m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.v.clone().normalize());
  /* 命中判定 */
  let hit=null;
  for(const e of G.enemies){
   if(e.dead)continue;
   const ep=e.mesh.position,hr=e.hitR||1.2;
   const dx=b.p.x-ep.x,dy=b.p.y-ep.y,dz=b.p.z-ep.z;
   if(dx*dx+dy*dy+dz*dz<hr*hr){hit=e;break;}
  }
  if(hit){
   if(b.kind==='shell'||b.kind==='missile'){explode(b.p,true);splashArea(b.p,b.kind==='shell'?4.5:6,b.dmg);}
   else damageEnemy(hit,b.dmg*G.upg.dmg,b.p);
   b.dead=true;continue;
  }
  /* 落地(含悬崖高度) */
  const gy=groundY(b.p.x,b.p.z);
  if((b.kind==='shell'||b.kind==='bomb')&&b.p.y<gy){
   const gp=new THREE.Vector3(b.p.x,gy,b.p.z);
   explode(gp,true);
   splashArea(gp,b.kind==='shell'?4.5:6,b.dmg);
   if(b.kind==='bomb'&&gp.distanceTo(BASE_TARGET)<7)baseHit(10,gp);
   b.dead=true;continue;
  }
  if(b.kind==='missile'&&b.p.y<gy){
   const gp=new THREE.Vector3(b.p.x,gy,b.p.z);
   explode(gp,true);splashArea(gp,6,b.dmg);
   b.dead=true;continue;
  }
  if(b.kind==='mg'&&(b.p.y<gy||b.p.z>GUN_POS.z+2||Math.abs(b.p.x)>90)){splash(new THREE.Vector3(b.p.x,gy,b.p.z));b.dead=true;continue;}
  if(b.life<=0)b.dead=true;
 }
 G.bullets=G.bullets.filter(b=>{if(b.dead)scene.remove(b.m);return !b.dead;});
}
function splashArea(pos,r,dmg){
 for(const e of G.enemies){
  if(e.dead)continue;
  const d=e.mesh.position.distanceTo(pos);
  if(d<r)damageEnemy(e,dmg*(1-d/r*0.6),pos);
 }
}

/* ================= 敌人更新 ================= */
function updateEnemies(dt){
 const g=G;
 for(const e of [...G.enemies]){
  if(e.dead)continue;
  const p=e.mesh.position;
  if(e.type==='soldier'){
   const dx=BASE_TARGET.x-p.x,dz=BASE_TARGET.z-p.z;
   const d=Math.hypot(dx,dz);
   p.x+=dx/d*e.spd*dt;p.z+=dz/d*e.spd*dt;
   e.mesh.rotation.y=Math.atan2(dx,dz);
   if(d<2.3){baseHit(ENEMY.soldier.reach,p.clone());killEnemy(e);}
  }else if(e.type==='boat'){
   const dx=-p.x,dz=2-p.z;
   const d=Math.hypot(dx,dz);
   p.x+=dx/d*e.spd*dt;p.z+=dz/d*e.spd*dt;
   if(p.z<2.5){
    for(let i=0;i<e.soldiers;i++){
     const s=spawnEnemy('soldier');
     s.mesh.position.set(p.x+rnd(-1,1),0,p.z+2);
     s.mesh.rotation.y=Math.PI;
     s.state='run';
    }
    explode(p,false);killEnemy(e);
   }
  }else if(e.type==='tank'){
   const dx=BASE_TARGET.x-p.x,dz=BASE_TARGET.z-p.z;
   const d=Math.hypot(dx,dz);
   p.x+=dx/d*e.spd*dt;p.z+=dz/d*e.spd*dt;
   e.mesh.rotation.y=Math.atan2(dx,dz);
   e.t-=dt;
   if(e.t<=0){e.t=3.2;tankShell(p);}
   if(d<2.6){baseHit(ENEMY.tank.reach,p.clone());killEnemy(e);}
  }else if(e.type==='heli'){
   e.t-=dt;
   p.x+=e.dir*e.spd*dt;
   if(p.x>20)p.dir=-1;if(p.x<-20)p.dir=1;
   p.z+=0.4*dt;p.y=6.5+Math.sin(g.frame*0.05)*0.6;
   if(e.mesh.rotor)e.mesh.rotor.rotation.y+=dt*30;
   if(e.t<=0&&p.z<-2){e.t=1.6;baseHit(2,new THREE.Vector3(p.x,1,BASE_TARGET.z));tracerFrom(p);}
   if(p.z>9){baseHit(20,p.clone());killEnemy(e);}
  }else if(e.type==='jet'){
   p.x+=e.spd*dt;
   e.t-=dt;
   if(e.t<=0&&e.bombs>0){e.bombs--;e.t=0.55;dropBomb(p);}
   if(p.x>100){e.dead=true;scene.remove(e.mesh);G.enemies=G.enemies.filter(x=>x!==e);checkWave();}
  }else if(e.type==='boss'){
   e.t-=dt;
   p.x=Math.sin(g.frame*0.02)*14;
   if(e.t<=0){e.t=3.4;for(let i=0;i<3;i++)setTimeout(()=>bossShell(p),i*220);}
  }
 }
 /* 敌人炮弹落地 */
 for(const s of [...G.bullets]){
  if(s.kind!=='eshell')continue;
  s.life-=dt;
  s.v.y-=s.grav*dt;
  s.p.addScaledVector(s.v,dt);
  s.m.position.copy(s.p);
  if(s.p.y<groundY(s.p.x,s.p.z)||s.life<=0){
   const gp=new THREE.Vector3(s.p.x,groundY(s.p.x,s.p.z),s.p.z);
   explode(gp,false);
   if(gp.distanceTo(BASE_TARGET)<6)baseHit(s.dmg||6,gp);
   s.dead=true;
  }
 }
 G.bullets=G.bullets.filter(b=>{if(b.dead)scene.remove(b.m);return !b.dead;});
}

/* ================= 波次系统 ================= */
function buildWave(n){
 const q=[];
 if(n%5===0)q.push('boss');
 const groups=Math.min(7,2+Math.floor(n/2));
 for(let i=0;i<groups*3;i++)q.push({type:'soldier'});
 const boats=n>=2?Math.min(5,Math.floor(n/2)):0;
 for(let i=0;i<boats;i++)q.push({type:'boat'});
 const tanks=n>=3?Math.min(4,Math.floor((n-1)/2)):0;
 for(let i=0;i<tanks;i++)q.push({type:'tank'});
 const helis=n>=4?Math.min(3,Math.floor((n-2)/3)):0;
 for(let i=0;i<helis;i++)q.push({type:'heli'});
 const jets=n>=5?Math.min(3,Math.floor((n-3)/2)):0;
 for(let i=0;i<jets;i++)q.push({type:'jet'});
 for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
 return q;
}
function startWave(){
 G.waveClearT=0;
 G.spawnQ=buildWave(G.wave);
 G.spawnT=0.4;
 G.st='play';
 hideOv();
 sfx('wave');
 updateHUD();
}
function updateSpawning(dt){
 G.spawnT-=dt;
 if(G.spawnT<=0&&G.spawnQ.length>0){
  const item=G.spawnQ.shift();
  spawnEnemy(item.type);
  G.spawnT=Math.max(0.55,2.1-G.wave*0.1);
 }
}
function checkWave(){
 if(G.st!=='play')return;
 if(G.spawnQ.length===0&&G.enemies.length===0&&G.waveClearT<=0){
  G.waveClearT=1.4;
 }
}
function showUpgrade(){
 G.st='upg';

 document.getElementById('upWave').textContent=G.wave+1;

function applyUpg(i){
 if(i===0)G.upg.rate=Math.min(2.5,G.upg.rate*1.15);
 if(i===1)G.upg.dmg=Math.min(3,G.upg.dmg*1.2);
 if(i===2)G.baseHP=Math.min(G.baseMax,G.baseHP+30);
 G.wave++;

}

/* ================= 主循环 ================= */
let last=performance.now();
function loop(ts){
 requestAnimationFrame(loop);
 let dt=(ts-last)/1000;last=ts;
 dt=Math.min(dt,0.05);
 G.frame=(G.frame||0)+1;
 if(G.st==='play'){
  if(mouseHeld||touchHeld)fire();
  if(keys.l)applyAim(-1.2*dt,0);
  if(keys.r)applyAim(1.2*dt,0);
  if(keys.u)applyAim(0,1.2*dt);
  if(keys.d)applyAim(0,-1.2*dt);
  updateSpawning(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateWeapons(dt);
  if(G.waveClearT>0){G.waveClearT-=dt;if(G.waveClearT<=0)showUpgrade();}
  /* 敌人掩体光效/音效节奏 */
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.combo=0;document.getElementById('combo').style.display='none';}}
 }
 updateFx(dt);
 animateSea(dt);
 updateTurret();
 updateCamera();
 updateHUDcross();
 renderer.render(scene,camera);
}
function updateWeapons(dt){
 if(G.mgCd>0)G.mgCd-=dt;
 if(G.canCd>0)G.canCd-=dt;
 if(G.msCd>0)G.msCd-=dt;
 if(G.mgHeat>0)G.mgHeat=Math.max(0,G.mgHeat-dt*(G.mgHeat>=1?0.24:0.11));
 document.getElementById('heat').firstElementChild.style.width=(G.mgHeat*100)+'%';
}
function updateFx(dt){
 for(const f of [...G.fx]){
  f.t+=dt;
  const k=f.t/f.life;
  if(f.type==='flash'){f.m.scale.setScalar(1+k*7);f.m.material.opacity=1-k;}
  if(f.type==='ring'){f.m.scale.setScalar(1+k*8);f.m.material.opacity=1-k;}
  if(f.t>=f.life){scene.remove(f.m);G.fx=G.fx.filter(x=>x!==f);}
 }
 /* 粒子 */
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];
  p.life-=dt;
  if(p.life<=0){parts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  if(p.y<0.03&&p.vy<0){p.y=0.03;p.vy*=-0.3;p.vx*=0.7;p.vz*=0.7;}
  p.vy-=9*dt;
 }
 for(let i=0;i<MAXP;i++){
  if(i<parts.length){
   const p=parts[i];
   pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;
   const c=p.col;
   pCol[i*3]=((c>>16)&255)/255;pCol[i*3+1]=((c>>8)&255)/255;pCol[i*3+2]=(c&255)/255;
   pSize[i]=p.size*(p.life/p.max);
  }else{
   pPos[i*3]=0;pPos[i*3+1]=-100;pPos[i*3+2]=0;pSize[i]=0;
  }
 }
 pGeo.attributes.position.needsUpdate=true;
 pGeo.attributes.color.needsUpdate=true;
 pGeo.attributes.size.needsUpdate=true;
}
function animateSea(dt){
 const t=G.frame*0.06;
 const pos=seaPos.array;
 for(let i=0;i<pos.length;i+=3){
  pos[i+1]=Math.sin(pos[i]*0.25+t)*0.22+Math.cos(pos[i+2]*0.18+t*0.8)*0.18;
 }
 seaPos.needsUpdate=true;
 sea.geometry.computeVertexNormals();
}
function updateHUDcross(){
 const el=document.getElementById('cross');
 if(G.st==='play'){
  /* 准星锚定子弹实际落点:枪口射线与地形交点(悬崖感知);朝天时投影固定距离点 */
  let pt;
  if(aimDir.y<-0.01){
   const t0=-muzzlePos.y/aimDir.y;
   const z0=muzzlePos.z+aimDir.z*t0;
   if(z0<8){
    const t8=(8-muzzlePos.z)/aimDir.z;
    const y8=muzzlePos.y+aimDir.y*t8;
    if(y8<6.6){
     pt=new THREE.Vector3(muzzlePos.x+aimDir.x*t8,y8,8);
    }else{
     pt=new THREE.Vector3(muzzlePos.x+aimDir.x*t0,0,z0);
    }
   }else{
    pt=new THREE.Vector3(muzzlePos.x+aimDir.x*t0,0,z0);
   }
  }else{
   pt=new THREE.Vector3(muzzlePos.x+aimDir.x*50,muzzlePos.y+aimDir.y*50,muzzlePos.z+aimDir.z*50);
  }
  pt.project(camera);
  el.style.display='block';
  el.style.left=((pt.x*0.5+0.5)*innerWidth)+'px';
  el.style.top=((-pt.y*0.5+0.5)*innerHeight)+'px';
 }else el.style.display='none';
}
function updateHUD(){
 document.getElementById('hWave').textContent=G.wave;
 document.getElementById('hScore').textContent=pad(Math.floor(G.score),6);
 document.getElementById('hHi').textContent=pad(G.hi,6);
 document.getElementById('hBase').textContent=Math.max(0,Math.ceil(G.baseHP));
 document.getElementById('baseBar').firstElementChild.style.width=(G.baseHP/G.baseMax*100)+'%';
 document.getElementById('hEnemy').textContent=G.enemies.length+G.spawnQ.length;
 document.getElementById('w1a').textContent=G.ammo.cannon;
 document.getElementById('w2a').textContent=G.ammo.missile;
}

/* ================= 流程 ================= */
function startGame(){
 G.wave=1;G.score=0;G.baseHP=G.baseMax;G.combo=0;
 G.upg.rate=1;G.upg.dmg=1;
 G.ammo.cannon=12;G.ammo.missile=6;
 clearEnemies();
 startWave();
}
function clearEnemies(){
 for(const e of G.enemies)scene.remove(e.mesh);
 G.enemies=[];
 for(const b of G.bullets)scene.remove(b.m);
 G.bullets=[];
 G.spawnQ=[];
}
function gameOver(){
 G.st='over';
 if(G.score>G.hi){G.hi=G.score;try{localStorage.setItem('bh_hi',G.hi);}catch(e){}}
 document.getElementById('overTxt').innerHTML='坚守了 <b style="color:#facc15">'+G.wave+'</b> 波<br>最终得分 <b style="color:#facc15">'+pad(Math.floor(G.score),6)+'</b><br>最高纪录 <b style="color:#facc15">'+pad(G.hi,6)+'</b>';
 updateHUD();
 showOv('ovOver');
}
function showOv(id){
 document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'));
 document.getElementById(id).classList.add('show');
}
function hideOv(){
 document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'));
}

/* ================= 音效 ================= */
let AC=null;
function ac(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();
 return AC;
}
function noise(dur,vol,filterFreq){
 const a=ac();if(!a)return;
 const len=a.sampleRate*dur;
 const buf=a.createBuffer(1,len,a.sampleRate);
 const d=buf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
 const src=a.createBufferSource();src.buffer=buf;
 const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=filterFreq;
 const g=a.createGain();g.gain.value=vol;
 src.connect(f);f.connect(g);g.connect(a.destination);
 src.start();
}
function tone(f,d,type,vol,slide){
 const a=ac();if(!a)return;
 const o=a.createOscillator(),g=a.createGain();
 o.type=type||'square';o.frequency.value=f;
 g.gain.setValueAtTime(vol||0.06,a.currentTime);
 g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
 o.frequency.exponentialRampToValueAtTime(Math.max(40,f*(slide||1)),a.currentTime+d);
 o.connect(g);g.connect(a.destination);
 o.start();o.stop(a.currentTime+d+0.02);
}
function sfx(n){
 if(G.muted)return;
 switch(n){
  case 'mg':noise(0.05,0.06,1800);break;
  case 'cannon':tone(110,0.22,'sawtooth',0.12,0.4);noise(0.2,0.1,600);break;
  case 'missile':noise(0.3,0.08,3000);break;
  case 'boom':noise(0.5,0.16,500);tone(80,0.4,'sine',0.1,0.2);break;
  case 'wave':tone(440,0.15,'square',0.05,1);setTimeout(()=>tone(660,0.2,'square',0.05,1),180);break;
 }
}

/* ================= 输入 ================= */
let mouseHeld=false,touchHeld=false;
const keys={l:false,r:false,u:false,d:false};
CV.addEventListener('pointermove',e=>{
 if(e.pointerType==='mouse'){
  const dx=e.movementX||0,dy=e.movementY||0;
  if(dx||dy)applyAim(-dx*0.0035,-dy*0.0035);
 }else if(G.touchAim){
  const dx=e.clientX-G.lastPX,dy=e.clientY-G.lastPY;
  G.lastPX=e.clientX;G.lastPY=e.clientY;
  applyAim(dx*0.005,dy*0.004);
 }
});
CV.addEventListener('pointerdown',e=>{
 ac();
 if(e.pointerType==='mouse'){mouseHeld=true;fire();}
 else{
  G.touchAim=true;G.lastPX=e.clientX;G.lastPY=e.clientY;
 }
});
addEventListener('pointerup',e=>{
 if(e.pointerType==='mouse')mouseHeld=false;
 else G.touchAim=false;
});
CV.addEventListener('click',()=>{
 if(CV.requestPointerLock&&document.pointerLockElement!==CV)CV.requestPointerLock();
});
addEventListener('keydown',e=>{
 if(e.code==='Digit1')switchWeapon(0);
 if(e.code==='Digit2')switchWeapon(1);
 if(e.code==='Digit3')switchWeapon(2);
 if(e.code==='Space')fire();
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;
 if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;
 if(e.code==='ArrowUp'||e.code==='KeyW')keys.u=true;
 if(e.code==='ArrowDown'||e.code==='KeyS')keys.d=true;
 if(e.code==='KeyM'){G.muted=!G.muted;document.getElementById('mbtn').textContent=G.muted?'🔇':'🔊';}
 if(e.code==='KeyC')toggleView();
 if(e.code==='Enter'){
  if(G.st==='menu')startGame();
  else if(G.st==='over'){G.st='menu';resetScene();showOv('ovMenu');}
 }
});
addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;
 if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;
 if(e.code==='ArrowUp'||e.code==='KeyW')keys.u=false;
 if(e.code==='ArrowDown'||e.code==='KeyS')keys.d=false;
});
addEventListener('wheel',e=>{switchWeapon((G.weapon+(e.deltaY>0?1:-1)+3)%3);});
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
document.getElementById('fireBtn').addEventListener('pointerdown',e=>{e.preventDefault();touchHeld=true;fire();});
document.getElementById('fireBtn').addEventListener('pointerup',e=>{touchHeld=false;});
document.getElementById('fireBtn').addEventListener('pointercancel',e=>{touchHeld=false;});
document.getElementById('fireBtn').addEventListener('pointerleave',e=>{touchHeld=false;});
document.getElementById('mbtn').addEventListener('click',()=>{G.muted=!G.muted;document.getElementById('mbtn').textContent=G.muted?'🔇':'🔊';});
document.getElementById('vbtn').addEventListener('click',toggleView);
document.getElementById('btnStart').addEventListener('click',startGame);
document.getElementById('btnAgain').addEventListener('click',()=>{G.st='menu';resetScene();showOv('ovMenu');});
document.querySelectorAll('#upgRow .btn').forEach(b=>{
 b.addEventListener('click',()=>applyUpg(+b.dataset.up));
});
function resetScene(){
 clearEnemies();
 for(const f of G.fx)scene.remove(f.m);
 G.fx=[];
 parts.length=0;
 document.getElementById('combo').style.display='none';
 G.wave=1;
}

/* 主循环启动 */
resetScene();
updateHUD();
requestAnimationFrame(loop);
})();
</script>
