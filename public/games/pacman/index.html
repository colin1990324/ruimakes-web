<title>Pac-Man · ruimakes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:#09090b;display:flex;justify-content:center;align-items:center;min-height:100dvh;font-family:'Courier New',monospace;overflow:hidden}
#game-container{position:relative;display:flex;flex-direction:column;align-items:center}
#hud{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:#18181b;border:1px solid #27272a;gap:8px;
}
#hud .score{color:#10b981;font-size:16px;font-weight:700;letter-spacing:1px}
#hud .level{color:#a1a1aa;font-size:13px}
#hud .lives{color:#ef4444;font-size:16px;letter-spacing:2px}
canvas{display:block;background:#09090b;border:1px solid #27272a;max-width:100vw;max-height:calc(100dvh - 160px)}
#overlay{
  display:none;position:absolute;inset:0;background:rgba(9,9,11,0.93);z-index:10;
  flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:20px
}
#overlay.show{display:flex}
#overlay h2{color:#10b981;font-size:28px;text-transform:uppercase;letter-spacing:3px;text-align:center}
#overlay p{color:#a1a1aa;font-size:14px;text-align:center;line-height:1.7}
#overlay .btn{
  background:#10b981;color:#09090b;border:none;padding:10px 32px;
  font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;
  letter-spacing:2px;transition:background .2s;font-family:inherit
}
#overlay .btn:hover{background:#34d399}
#mobile-controls{
  display:none;gap:4px;padding:10px 0 0;width:100%;justify-content:center
}
#mobile-controls .row{display:flex;gap:4px;justify-content:center}
#mobile-controls button{
  width:56px;height:56px;background:#18181b;border:1px solid #27272a;
  color:#a1a1aa;font-size:22px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;border-radius:4px;touch-action:manipulation
}
#mobile-controls button:active{background:#27272a;color:#10b981}
@media(pointer:coarse),(hover:none),(max-width:768px){#mobile-controls{display:flex}}
@media(max-width:500px){
  #hud .score{font-size:13px}#hud .level{font-size:11px}#hud .lives{font-size:13px}

}

// ─── Game state ────────────────────────────────────────────────
let game={level:0,score:0,lives:3,state:'menu',maze:[],dots:0,dotsEaten:0,
  player:{x:7,y:7,dx:0,dy:0,ndx:0,ndy:0,dir:3},
  ghosts:[],powerTimer:0,animTick:0,mouthOpen:true};
const DIR={RIGHT:0,UP:1,LEFT:2,DOWN:3};

// ─── Build maze ────────────────────────────────────────────────
function buildMaze(levelIdx){
  const lv=LEVELS[levelIdx];
  const maze=[];
  let dots=0,px=0,py=0,ghostSpawns=[];
  for(let r=0;r<lv.grid.length;r++){
    const row=[];
    for(let c=0;c<lv.grid[r].length;c++){
      const ch=lv.grid[r][c];
      switch(ch){
        case W:row.push(1);break;
        case D:row.push(2);dots++;break;
        case P:row.push(3);dots++;break;
        case E:row.push(0);break;
        case S:row.push(4);px=c;py=r;break;
        case G:row.push(5);ghostSpawns.push({x:c,y:r});break;
        default:row.push(0);
      }
    }
    maze.push(row);
  }
  return {maze,dots,px,py,ghostSpawns};
}

// ─── Init level ────────────────────────────────────────────────
function initLevel(levelIdx){
  const lv=LEVELS[levelIdx];
  const {maze,dots,px,py,ghostSpawns}=buildMaze(levelIdx);
  game.maze=maze;game.dots=dots;game.dotsEaten=0;game.powerTimer=0;
  game.player={x:px,y:py,dx:0,dy:0,ndx:0,ndy:0,dir:DIR.LEFT};
  game.ghosts=[];
  for(let i=0;i<lv.ghosts;i++){
    const sp=ghostSpawns[i%ghostSpawns.length]||ghostSpawns[0];
    game.ghosts.push({x:sp.x,y:sp.y,sx:sp.x,sy:sp.y,
      dx:0,dy:-1,dir:DIR.UP,mode:'scatter',timer:60+i*30,eaten:false,color:i});
  }
  levelEl.textContent='LV.'+(levelIdx+1);
}

// ─── Reset positions ───────────────────────────────────────────
function resetPositions(){
  const lv=LEVELS[game.level];
  const {maze,dots,px,py,ghostSpawns}=buildMaze(game.level);
  game.maze=maze;game.dots=dots;game.dotsEaten=0;game.powerTimer=0;
  game.player={x:px,y:py,dx:0,dy:0,ndx:0,ndy:0,dir:DIR.LEFT};
  game.ghosts=[];
  for(let i=0;i<lv.ghosts;i++){
    const sp=ghostSpawns[i%ghostSpawns.length]||ghostSpawns[0];
    game.ghosts.push({x:sp.x,y:sp.y,sx:sp.x,sy:sp.y,
      dx:0,dy:-1,dir:DIR.UP,mode:'scatter',timer:60+i*30,eaten:false,color:i});
  }
}

// ─── Helpers ───────────────────────────────────────────────────
function isWalkable(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS)return false;
  return game.maze[y]&&game.maze[y][x]!==1;
}
function isWalkableGhost(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS)return false;
  return game.maze[y]&&game.maze[y][x]!==1;
}

// ─── Player movement ───────────────────────────────────────────
function movePlayer(){
  const p=game.player;
  let nx=Math.floor(p.x+p.ndx),ny=Math.floor(p.y+p.ndy);
  if(isWalkable(nx,ny)){p.dx=p.ndx;p.dy=p.ndy;p.dir=getDir(p.ndx,p.ndy);}
  nx=p.x+p.dx;ny=p.y+p.dy;
  if(isWalkable(Math.floor(nx),Math.floor(ny))){p.x=nx;p.y=ny;}
  const cx=Math.floor(p.x),cy=Math.floor(p.y);
  const cell=game.maze[cy][cx];
  if(cell===2){game.maze[cy][cx]=0;game.dotsEaten++;game.score+=10;}
  else if(cell===3){
    game.maze[cy][cx]=0;game.dotsEaten++;game.score+=50;game.powerTimer=300;
    game.ghosts.forEach(g=>{if(g.mode!=='eaten'){g.mode='frightened';g.timer=300;}});
  }
  updateScore();
}
function getDir(dx,dy){
  if(dx>0)return DIR.RIGHT;if(dx<0)return DIR.LEFT;
  if(dy>0)return DIR.DOWN;if(dy<0)return DIR.UP;
  return game.player.dir;
}

// ─── Ghost AI ──────────────────────────────────────────────────
function moveGhosts(){
  const lv=LEVELS[game.level];
  const speed=lv.speed*0.035;
  game.ghosts.forEach((g,idx)=>{
    if(g.mode==='eaten'){
      const tx=tileCenter(g.sx),ty=tileCenter(g.sy);
      const dx=tx-g.x,dy=ty-g.y;
      if(Math.abs(dx)<0.3&&Math.abs(dy)<0.3){
        g.x=g.sx;g.y=g.sy;g.mode='scatter';g.timer=60+idx*20;g.eaten=false;return;
      }
      g.x+=Math.sign(dx||0.01)*speed*2;g.y+=Math.sign(dy||0.01)*speed*2;
      return;
    }
    if(g.mode==='frightened'){g.timer--;if(g.timer<=0)g.mode='chase';}
    else if(g.mode==='scatter'){g.timer--;if(g.timer<=0){g.mode='chase';g.timer=600;}}
    const cx=Math.floor(g.x),cy=Math.floor(g.y);
    const p=game.player;
    let targetX,targetY;
    if(g.mode==='frightened'){targetX=Math.random()*COLS;targetY=Math.random()*ROWS;}
    else if(g.mode==='scatter'){
      const corners=[[COLS-2,1],[1,1],[COLS-2,ROWS-2],[1,ROWS-2]];
      targetX=corners[idx%4][0];targetY=corners[idx%4][1];
    }else{targetX=p.x;targetY=p.y;}
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
    let best=Infinity,bestDir=null;
    for(const d of dirs){
      const nx=cx+d[0],ny=cy+d[1];
      if(!isWalkableGhost(nx,ny))continue;
      if(g.mode!=='frightened'&&g.dx&&d[0]===-g.dx&&d[1]===-g.dy)continue;
      if(g.mode!=='frightened'&&g.dy&&d[0]===-g.dx&&d[1]===-g.dy)continue;
      const dist=Math.hypot(nx+(g.x-cx)-targetX,ny+(g.y-cy)-targetY);
      if(dist<best){best=dist;bestDir=d;}
    }
    if(bestDir){g.dx=bestDir[0];g.dy=bestDir[1];}
    let sp=speed;if(g.mode==='frightened')sp*=0.5;
    const nx=cx+g.dx,ny=cy+g.dy;
    if(isWalkableGhost(nx,ny)){g.x+=g.dx*sp;g.y+=g.dy*sp;}
    else{g.x=cx+0.5;g.y=cy+0.5;}
  });
}
function tileCenter(v){return Math.floor(v)+0.5}

// ─── Collision ─────────────────────────────────────────────────
function checkCollisions(){
  const p=game.player;
  const pcx=Math.floor(p.x),pcy=Math.floor(p.y);
  for(const g of game.ghosts){
    if(g.mode==='eaten')continue;
    const gcx=Math.floor(g.x),gcy=Math.floor(g.y);
    if(pcx===gcx&&pcy===gcy){
      if(g.mode==='frightened'){
        g.mode='eaten';game.score+=200;updateScore();
      }else{
        game.lives--;updateLives();
        if(game.lives<=0){showScreen('gameover');return true;}
        setTimeout(()=>{resetPositions();if(game.state!=='gameover')game.state='playing';},500);
        return true;
      }
    }
  }
  return false;
}
function checkWin(){
  if(game.dotsEaten>=game.dots){
    if(game.level>=LEVELS.length-1){showScreen('win');return;}
    game.level++;initLevel(game.level);
  }
}

// ─── HUD ───────────────────────────────────────────────────────
function updateScore(){scoreEl.textContent=String(game.score).padStart(4,'0');}
function updateLives(){livesEl.textContent='♥'.repeat(Math.max(0,game.lives));}

// ─── Screens ───────────────────────────────────────────────────
function showScreen(type){
  game.state=type;
  overlay.classList.add('show');
  const h2=overlay.querySelector('h2');
  const p=overlay.querySelector('p');
  const btn=overlay.querySelector('.btn');
  btn.style.display='block';
  if(type==='menu'){
    h2.textContent='🟡 吃豆人';h2.style.color='#10b981';
    p.innerHTML='← ↑ → ↓ 控制吃豆人吃掉所有豆子<br>躲避幽灵，吃绿色能量豆可以反击！';
    btn.textContent='开始游戏';
    btn.onclick=startGame;
  }else if(type==='gameover'){
    h2.textContent='GAME OVER';h2.style.color='#ef4444';
    p.innerHTML='最终得分: '+game.score;
    btn.textContent='重新开始';
    btn.onclick=()=>{game.level=0;game.score=0;game.lives=3;startGame();};
  }else if(type==='win'){
    h2.textContent='🎉 恭喜通关！';h2.style.color='#10b981';
    p.innerHTML='最终得分: '+game.score;
    btn.textContent='再来一次';
    btn.onclick=()=>{game.level=0;game.score=0;game.lives=3;startGame();};
  }
}
function hideOverlay(){overlay.classList.remove('show');}

function startGame(){
  hideOverlay();
  game.level=0;game.score=0;game.lives=3;game.state='playing';
  initLevel(game.level);
  updateScore();updateLives();
}

// ─── Drawing ───────────────────────────────────────────────────
function drawMaze(){
  const m=game.maze;
  if(!m||!m.length)return; // ← SAFETY GUARD
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*CELL,y=r*CELL;
    const cell=m[r]&&m[r][c];
    if(cell===1){
      ctx.fillStyle='#18181b';ctx.fillRect(x,y,CELL,CELL);
      ctx.strokeStyle='#27272a';ctx.lineWidth=0.5;ctx.strokeRect(x,y,CELL,CELL);
      ctx.fillStyle='#3f3f46';
      [[2,2],[CELL-2,2],[2,CELL-2],[CELL-2,CELL-2]].forEach(([bx,by])=>{
        ctx.beginPath();ctx.arc(x+bx,y+by,1.5,0,Math.PI*2);ctx.fill();
      });
      ctx.strokeStyle='#1f1f23';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+CELL,y+CELL);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+CELL,y);ctx.lineTo(x,y+CELL);ctx.stroke();
    }else if(cell===2){
      ctx.fillStyle='#a1a1aa';
      ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.beginPath();ctx.arc(x+CELL/2-1,y+CELL/2-2,1.2,0,Math.PI*2);ctx.fill();
    }else if(cell===3){
      const glow=0.4+0.3*Math.sin(Date.now()/200);
      ctx.fillStyle=`rgba(16,185,129,${glow})`;
      ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#10b981';
      ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.beginPath();ctx.arc(x+CELL/2-2,y+CELL/2-2,2,0,Math.PI*2);ctx.fill();
    }
  }
}

function drawPlayer(){
  const p=game.player;
  const x=p.x*CELL,y=p.y*CELL;
  const r=CELL/2-3;
  const mouth=game.mouthOpen?0.25:0.05;
  game.mouthOpen=Math.sin(Date.now()/150)>0;
  let sa=0,ea=Math.PI*2;
  switch(p.dir){
    case DIR.RIGHT:sa=mouth*Math.PI;ea=Math.PI*(2-mouth);break;
    case DIR.LEFT:sa=Math.PI*(1+mouth);ea=Math.PI*(1-mouth);break;
    case DIR.UP:sa=Math.PI*(1.5+mouth);ea=Math.PI*(1.5-mouth);break;
    case DIR.DOWN:sa=Math.PI*(0.5+mouth);ea=Math.PI*(0.5-mouth);break;
  }
  ctx.save();ctx.translate(x,y);
  const grad=ctx.createRadialGradient(0,0,2,0,0,r+4);
  grad.addColorStop(0,'rgba(250,204,21,0.15)');
  grad.addColorStop(1,'rgba(250,204,21,0)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,sa,ea);ctx.closePath();
  ctx.fillStyle='#facc15';ctx.fill();
  ctx.save();
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,sa,ea);ctx.closePath();ctx.clip();
  for(let ly=-r;ly<r;ly+=3){
    ctx.strokeStyle='rgba(0,0,0,0.07)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(-r,ly);ctx.lineTo(r,ly);ctx.stroke();
  }
  const g2=ctx.createRadialGradient(-2,-r+6,0,0,0,r);
  g2.addColorStop(0,'rgba(255,255,255,0.35)');g2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,sa,ea);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle='#09090b';ctx.beginPath();ctx.arc(3,-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(3.8,-4.8,1,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

const GC=['#ef4444','#f59e0b','#3b82f6','#8b5cf6'];
function drawGhosts(){
  if(!game.ghosts||!game.ghosts.length)return; // ← SAFETY GUARD
  game.ghosts.forEach(g=>{
    if(g.mode==='eaten')return;
    const x=g.x*CELL,y=g.y*CELL,r=CELL/2-3;
    let color;
    if(g.mode==='frightened'){
      const blink=Math.floor(Date.now()/200)%2;
      color=game.powerTimer<60&&blink?'#fff':'#6366f1';
    }else color=GC[g.color%GC.length];
    ctx.save();ctx.translate(x,y);
    ctx.beginPath();ctx.arc(0,-2,r,Math.PI,0);ctx.lineTo(r,10);
    for(let i=0;i<3;i++){ctx.quadraticCurveTo(Math.floor(i)*4-6+1,13,Math.floor(i)*4-6+2,10);}
    ctx.closePath();ctx.fillStyle=color;ctx.fill();
    ctx.save();
    ctx.beginPath();ctx.arc(0,-2,r,Math.PI,0);ctx.lineTo(r,10);
    for(let i=0;i<3;i++){ctx.quadraticCurveTo(Math.floor(i)*4-6+1,13,Math.floor(i)*4-6+2,10);}
    ctx.closePath();ctx.clip();
    for(let ly=-r;ly<12;ly+=3){
      ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(-r,ly);ctx.lineTo(r,ly);ctx.stroke();
    }
    ctx.restore();
    if(g.mode==='frightened'){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(-4,-3,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4,-3,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#09090b';
      ctx.beginPath();ctx.arc(-4,-3,0.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4,-3,0.8,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();
      for(let i=-3;i<=3;i+=1)ctx.lineTo(i,3+(i%2===0?2:-2));
      ctx.stroke();
    }else{
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(-4,-3,3.5,4,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(4,-3,3.5,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#09090b';
      const lx=g.dx*1.5,ly=g.dy*1.5;
      ctx.beginPath();ctx.ellipse(-4+lx,-3+ly,1.8,2.2,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(4+lx,-3+ly,1.8,2.2,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMaze();
  drawGhosts();
  if(game.state==='playing')drawPlayer();
}

// ─── Game loop ─────────────────────────────────────────────────
function update(){
  if(game.state!=='playing')return;
  movePlayer();moveGhosts();
  if(!checkCollisions())checkWin();
}
let lastTime=0;
function gameLoop(time){
  if(time-lastTime>16){update();lastTime=time;}
  draw();
  requestAnimationFrame(gameLoop);
}

// ─── Controls ──────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(game.state!=='playing')return;
  switch(e.key){
    case 'ArrowUp':e.preventDefault();game.player.ndx=0;game.player.ndy=-1;break;
    case 'ArrowDown':e.preventDefault();game.player.ndx=0;game.player.ndy=1;break;
    case 'ArrowLeft':e.preventDefault();game.player.ndx=-1;game.player.ndy=0;break;
    case 'ArrowRight':e.preventDefault();game.player.ndx=1;game.player.ndy=0;break;
  }
});

['Up','Down','Left','Right'].forEach(dir=>{
  const btn=document.getElementById('btn'+dir);
  const action=()=>{
    if(game.state!=='playing')return;
    switch(dir){
      case 'Up':game.player.ndx=0;game.player.ndy=-1;break;
      case 'Down':game.player.ndx=0;game.player.ndy=1;break;
      case 'Left':game.player.ndx=-1;game.player.ndy=0;break;
      case 'Right':game.player.ndx=1;game.player.ndy=0;break;
    }
  };
  btn.addEventListener('touchstart',e=>{e.preventDefault();action();});
  btn.addEventListener('mousedown',e=>{e.preventDefault();action();});
});

// Swipe
let sx=0,sy=0;
canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(game.state!=='playing')return;
  const t=e.changedTouches[0];
  const dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  if(Math.abs(dx)>Math.abs(dy)){game.player.ndx=dx>0?1:-1;game.player.ndy=0;}
  else{game.player.ndx=0;game.player.ndy=dy>0?1:-1;}
},{passive:true});

// ─── Init ──────────────────────────────────────────────────────
showScreen('menu');
gameLoop();
</script>
