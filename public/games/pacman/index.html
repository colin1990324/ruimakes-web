// ─── Game state ────────────────────────────────────────────────
let game={
  level:0,score:0,lives:3,state:'menu', // menu|playing|dying|win|gameover|levelwin
  maze:[],dots:0,dotsEaten:0,
  player:{x:0,y:0,dx:0,dy:0,ndx:0,ndy:0,dir:0},
  ghosts:[],powerTimer:0,animTick:0,mouthOpen:true,
  cellSize:CELL
};

const DIR={RIGHT:0,UP:1,LEFT:2,DOWN:3};
const DX=[1,0,-1,0],DY=[0,-1,0,1];

// ─── Build maze from string grid ───────────────────────────────
function buildMaze(levelIdx){
  const lv=LEVELS[levelIdx];
  const maze=[];
  let dots=0,px=0,py=0,ghostSpawns=[];
  for(let r=0;r<lv.grid.length;r++){
    const row=[];
    for(let c=0;c<lv.grid[r].length;c++){
      const ch=lv.grid[r][c];
      switch(ch){
        case W:row.push(1);break;
        case D:row.push(2);dots++;break;
        case P:row.push(3);dots++;break;
        case E:row.push(0);break;
        case S:row.push(4);px=c;py=r;break;
        case G:row.push(5);ghostSpawns.push({x:c,y:r});break;
        default:row.push(0);
      }
    }
    maze.push(row);
  }
  return {maze,dots,px,py,ghostSpawns};
}

// ─── Init level ────────────────────────────────────────────────
function initLevel(levelIdx){
  const lv=LEVELS[levelIdx];
  const {maze,dots,px,py,ghostSpawns}=buildMaze(levelIdx);
  game.maze=maze;
  game.dots=dots;
  game.dotsEaten=0;
  game.powerTimer=0;
  game.player={x:px,y:py,dx:0,dy:0,ndx:0,ndy:0,dir:DIR.LEFT};
  game.ghosts=[];
  for(let i=0;i<lv.ghosts;i++){
    const sp=ghostSpawns[i%ghostSpawns.length]||ghostSpawns[0];
    game.ghosts.push({
      x:sp.x,y:sp.y,sx:sp.x,sy:sp.y,
      dx:0,dy:-1,dir:DIR.UP,
      mode:'scatter', // chase|scatter|frightened|eaten
      timer:60+i*30,eaten:false,
      color:i
    });
  }
  levelEl.textContent='LV.'+(levelIdx+1);
}

// ─── Reset level ───────────────────────────────────────────────
function resetPositions(){
  const lv=LEVELS[game.level];
  const {maze,dots,px,py,ghostSpawns}=buildMaze(game.level);
  game.player={x:px,y:py,dx:0,dy:0,ndx:0,ndy:0,dir:DIR.LEFT};
  game.ghosts=[];
  for(let i=0;i<lv.ghosts;i++){
    const sp=ghostSpawns[i%ghostSpawns.length]||ghostSpawns[0];
    game.ghosts.push({
      x:sp.x,y:sp.y,sx:sp.x,sy:sp.y,
      dx:0,dy:-1,dir:DIR.UP,
      mode:'scatter',timer:60+i*30,eaten:false,color:i
    });
  }
  game.powerTimer=0;
}

// ─── Logic helpers ─────────────────────────────────────────────
function isWalkable(maze,x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS)return false;
  return maze[y][x]!==1;
}
function isWalkableForGhost(maze,x,y,ghost){
  if(x<0||y<0||x>=COLS||y>=ROWS)return false;
  const cell=maze[y][x];
  if(cell===1)return false;
  // Ghosts can walk through ghost spawn cells
  return true;
}
function tileCenter(v){return Math.floor(v)+0.5}

// ─── Player movement ───────────────────────────────────────────
function movePlayer(){
  const p=game.player;
  // Try queued direction
  let nx=p.x+p.ndx,ny=p.y+p.ndy;
  if(isWalkable(game.maze,Math.floor(nx),Math.floor(ny))){
    p.dx=p.ndx;p.dy=p.ndy;p.dir=getDir(p.ndx,p.ndy);
  }
  nx=p.x+p.dx;ny=p.y+p.dy;
  if(isWalkable(game.maze,Math.floor(nx),Math.floor(ny))){
    p.x=nx;p.y=ny;
  }
  // Eat dot
  const cx=Math.floor(p.x),cy=Math.floor(p.y);
  const cell=game.maze[cy][cx];
  if(cell===2){game.maze[cy][cx]=0;game.dotsEaten++;game.score+=10;}
  else if(cell===3){
    game.maze[cy][cx]=0;game.dotsEaten++;game.score+=50;
    game.powerTimer=300;
    game.ghosts.forEach(g=>{if(g.mode!=='eaten'){g.mode='frightened';g.timer=300;}});
  }
  updateScore();
}
function getDir(dx,dy){
  if(dx>0)return DIR.RIGHT;if(dx<0)return DIR.LEFT;
  if(dy>0)return DIR.DOWN;if(dy<0)return DIR.UP;
  return game.player.dir;
}

// ─── Ghost AI ──────────────────────────────────────────────────
function moveGhosts(){
  const lv=LEVELS[game.level];
  const speed=lv.speed*0.035;
  game.ghosts.forEach((g,idx)=>{
    if(g.mode==='eaten'){
      // Return to ghost house
      const tx=tileCenter(g.sx),ty=tileCenter(g.sy);
      const dx=tx-g.x,dy=ty-g.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<0.3){g.x=g.sx;g.y=g.sy;g.mode='scatter';g.timer=60+idx*20;g.eaten=false;return;}
      g.x+=Math.sign(dx)*speed*2;
      g.y+=Math.sign(dy)*speed*2;
      return;
    }
    if(g.mode==='frightened'){
      g.timer--;
      if(g.timer<=0){g.mode='chase';}
    }else if(g.mode==='scatter'){
      g.timer--;
      if(g.timer<=0){g.mode='chase';g.timer=600;}
    }
    // Move toward target
    const cx=Math.floor(g.x),cy=Math.floor(g.y);
    const p=game.player;
    let targetX,targetY;
    if(g.mode==='frightened'){
      targetX=Math.random()*COLS;targetY=Math.random()*ROWS;
    }else if(g.mode==='scatter'){
      const corners=[[COLS-2,1],[1,1],[COLS-2,ROWS-2],[1,ROWS-2]];
      targetX=corners[idx%4][0];targetY=corners[idx%4][1];
    }else{
      targetX=p.x;targetY=p.y;
    }
    // Simple pathfinding: try preferred direction
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
    let best=Infinity,bestDir=null;
    for(const d of dirs){
      const nx=cx+d[0],ny=cy+d[1];
      if(!isWalkableForGhost(game.maze,nx,ny,g))continue;
      // Avoid reversing unless frightened
      if(g.mode!=='frightened'&&g.dx&&d[0]===-g.dx&&d[1]===-g.dy)continue;
      if(g.mode!=='frightened'&&g.dy&&d[0]===-g.dx&&d[1]===-g.dy)continue;
      const dist=Math.hypot(nx+(g.x-cx)-targetX,ny+(g.y-cy)-targetY);
      if(dist<best){best=dist;bestDir=d;}
    }
    if(bestDir){
      g.dx=bestDir[0];g.dy=bestDir[1];
      if(g.mode==='frightened'&&Math.random()<0.5){
        const rd=dirs[Math.floor(Math.random()*4)];
        if(isWalkableForGhost(game.maze,cx+rd[0],cy+rd[1],g)){g.dx=rd[0];g.dy=rd[1];}
      }
    }
    // Apply movement
    let sp=speed;
    if(g.mode==='frightened')sp*=0.6;
    let nx=cx+g.dx,ny=cy+g.dy;
    if(isWalkableForGhost(game.maze,nx,ny,g)){
      g.x+=g.dx*sp;g.y+=g.dy*sp;
    }else{
      // Snap to center and try
      g.x=cx+0.5;g.y=cy+0.5;
    }
  });
}

// ─── Collision detection ───────────────────────────────────────
function checkCollisions(){
  const p=game.player;
  const pcx=Math.floor(p.x),pcy=Math.floor(p.y);
  for(const g of game.ghosts){
    if(g.mode==='eaten')continue;
    const gcx=Math.floor(g.x),gcy=Math.floor(g.y);
    if(pcx===gcx&&pcy===gcy){
      if(g.mode==='frightened'){
        g.mode='eaten';game.score+=200;updateScore();
      }else{
        // Player dies
        game.lives--;
        updateLives();
        if(game.lives<=0){
          game.state='gameover';showOverlay('gameover');
        }else{
          game.state='dying';
          setTimeout(()=>{
            resetPositions();
            game.state='playing';
          },600);
        }
        return true;
      }
    }
  }
  return false;
}

// ─── Check level win ───────────────────────────────────────────
function checkWin(){
  if(game.dotsEaten>=game.dots){
    game.state='levelwin';
    if(game.level>=LEVELS.length-1){
      showOverlay('win');
    }else{
      setTimeout(()=>{
        game.level++;
        initLevel(game.level);
        game.state='playing';
      },1500);
    }
  }
}

// ─── Update HUD ────────────────────────────────────────────────
function updateScore(){
  scoreEl.textContent=String(game.score).padStart(4,'0');
}
function updateLives(){
  livesEl.textContent='♥'.repeat(Math.max(0,game.lives));
}

// ─── Overlay screens ───────────────────────────────────────────
function showOverlay(type){
  overlay.classList.add('show');
  const h2=overlay.querySelector('h2');
  const p=overlay.querySelector('p');
  const btn=overlay.querySelector('.btn');
  if(type==='menu'){
    h2.textContent='pac-man';h2.style.color='#10b981';
    p.innerHTML='← ↑ → ↓ 控制吃豆人吃掉所有豆子<br>躲避幽灵，吃能量豆可以反击！';
    btn.textContent='开始游戏';btn.style.display='block';
    btn.onclick=startGame;
  }else if(type==='gameover'){
    h2.textContent='GAME OVER';h2.style.color='#ef4444';
    p.innerHTML='幽灵抓住了你！<br>最终得分: '+game.score;
    btn.textContent='重新开始';btn.style.display='block';
    btn.onclick=()=>{game.level=0;game.score=0;game.lives=3;startGame();};
  }else if(type==='win'){
    h2.textContent='🎉 恭喜通关！';h2.style.color='#10b981';
    p.innerHTML='你吃掉了所有豆子！<br>最终得分: '+game.score;
    btn.textContent='再来一次';btn.style.display='block';
    btn.onclick=()=>{game.level=0;game.score=0;game.lives=3;startGame();};
  }else if(type==='levelwin'){
    h2.textContent='LEVEL CLEAR!';h2.style.color='#10b981';
    p.innerHTML='准备进入下一关...';
    btn.style.display='none';
  }
}
function hideOverlay(){overlay.classList.remove('show');}

// ─── Start game ────────────────────────────────────────────────
function startGame(){
  hideOverlay();
  game.level=0;if(!game.score)game.score=0;game.lives=3;
  initLevel(0);
  game.state='playing';
  updateScore();updateLives();
}

// ─── Drawing ───────────────────────────────────────────────────
function draw3dPrintLayer(ctx,x,y,w,h,color,isGhost=false,progress=1){
  // 3D printing layer effect
  const layerH=3;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,2);
  ctx.clip();
  // Base color
  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,h);
  // Layer lines (FDM texture)
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=0.5;
  for(let ly=y;ly<y+h;ly+=layerH){
    ctx.beginPath();ctx.moveTo(x,ly);ctx.lineTo(x+w,ly);ctx.stroke();
  }
  // Top highlight (nozzle gloss)
  const grad=ctx.createLinearGradient(x,y,x,y+4);
  grad.addColorStop(0,'rgba(255,255,255,0.25)');
  grad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grad;ctx.fillRect(x,y,w,4);
  ctx.restore();
}

// ─── Draw maze ─────────────────────────────────────────────────
function drawMaze(){
  const m=game.maze;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*CELL,y=r*CELL;
    if(m[r][c]===1){
      // Industrial tool wall — metal beam style
      ctx.fillStyle='#18181b';
      ctx.fillRect(x,y,CELL,CELL);
      ctx.strokeStyle='#27272a';
      ctx.lineWidth=0.5;
      ctx.strokeRect(x,y,CELL,CELL);
      // Bolt/rivet decoration at corners
      const boltColor='#3f3f46';
      ctx.fillStyle=boltColor;
      [[2,2],[CELL-2,2],[2,CELL-2],[CELL-2,CELL-2]].forEach(([bx,by])=>{
        ctx.beginPath();ctx.arc(x+bx,y+by,1.5,0,Math.PI*2);ctx.fill();
      });
      // Cross beam lines
      ctx.strokeStyle='#1f1f23';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+CELL,y+CELL);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+CELL,y);ctx.lineTo(x,y+CELL);ctx.stroke();
    }else if(m[r][c]===2){
      // Dot — small 3D print bead
      ctx.fillStyle='#a1a1aa';
      ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,3,0,Math.PI*2);
      ctx.fill();
      // Gloss highlight
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.beginPath();ctx.arc(x+CELL/2-1,y+CELL/2-2,1.2,0,Math.PI*2);
      ctx.fill();
    }else if(m[r][c]===3){
      // Power pellet — larger glowing bead
      const glow=0.4+0.3*Math.sin(Date.now()/200);
      ctx.fillStyle=`rgba(16,185,129,${glow})`;
      ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,8,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#10b981';
      ctx.beginPath();ctx.arc(x+CELL/2,y+CELL/2,6,0,Math.PI*2);
      ctx.fill();
      // Gloss
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.beginPath();ctx.arc(x+CELL/2-2,y+CELL/2-2,2,0,Math.PI*2);
      ctx.fill();
    }
  }
}

// ─── Draw player (3D print Pac-Man) ────────────────────────────
function drawPlayer(){
  const p=game.player;
  const x=p.x*CELL,y=p.y*CELL;
  const r=CELL/2-3;
  const mouth=game.mouthOpen?0.25:0.05;
  const angle=Date.now()/150;
  game.mouthOpen=Math.sin(angle)>0;
  let startAngle=0,endAngle=Math.PI*2;
  switch(p.dir){
    case DIR.RIGHT:startAngle=mouth*Math.PI;endAngle=Math.PI*(2-mouth);break;
    case DIR.LEFT:startAngle=Math.PI*(1+mouth);endAngle=Math.PI*(1-mouth);break;
    case DIR.UP:startAngle=Math.PI*(1.5+mouth);endAngle=Math.PI*(1.5-mouth);break;
    case DIR.DOWN:startAngle=Math.PI*(0.5+mouth);endAngle=Math.PI*(0.5-mouth);break;
  }
  ctx.save();
  ctx.translate(x,y);
  // Glow
  const grad=ctx.createRadialGradient(0,0,r*0.3,0,0,r+4);
  grad.addColorStop(0,'rgba(250,204,21,0.3)');
  grad.addColorStop(1,'rgba(250,204,21,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(0,0,r+4,0,Math.PI*2);ctx.fill();
  // Body — 3D print yellow
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,r,startAngle,endAngle);
  ctx.closePath();
  ctx.fillStyle='#facc15';
  ctx.fill();
  // Layer lines
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,r,startAngle,endAngle);
  ctx.closePath();
  ctx.clip();
  for(let ly=-r;ly<r;ly+=3){
    ctx.strokeStyle='rgba(0,0,0,0.08)';
    ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(-r,ly);ctx.lineTo(r,ly);ctx.stroke();
  }
  // Top nozzle gloss
  const grad2=ctx.createRadialGradient(-2,-r+6,0,0,0,r);
  grad2.addColorStop(0,'rgba(255,255,255,0.4)');
  grad2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grad2;ctx.beginPath();
  ctx.arc(0,0,r,startAngle,endAngle);ctx.closePath();
  ctx.fill();
  ctx.restore();
  // Eye
  ctx.fillStyle='#09090b';
  const ex=3,ey=-4;
  ctx.beginPath();ctx.arc(ex,ey,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ex+0.8,ey-0.8,1,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ─── Draw ghosts (3D print style) ──────────────────────────────
const GHOST_COLORS=['#ef4444','#f59e0b','#3b82f6','#8b5cf6'];
function drawGhosts(){
  game.ghosts.forEach(g=>{
    const x=g.x*CELL,y=g.y*CELL;
    const r=CELL/2-3;
    let color;
    if(g.mode==='eaten')return;
    if(g.mode==='frightened'){
      const blink=Math.floor(Date.now()/200)%2;
      color=game.powerTimer<60&&blink?'#fff':'#6366f1';
    }else{
      color=GHOST_COLORS[g.color%GHOST_COLORS.length];
    }
    ctx.save();
    ctx.translate(x,y);
    // Body
    ctx.beginPath();
    ctx.arc(0,-2,r,Math.PI,0);
    ctx.lineTo(r,10);
    // Wavy bottom
    for(let i=0;i<3;i++){
      const bx=Math.floor(i)*4-6,by=10;
      ctx.quadraticCurveTo(bx+1,by+3,bx+2,by);
    }
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
    // 3D print layers
    ctx.save();
    ctx.beginPath();
    ctx.arc(0,-2,r,Math.PI,0);
    ctx.lineTo(r,10);
    for(let i=0;i<3;i++){
      const bx=Math.floor(i)*4-6,by=10;
      ctx.quadraticCurveTo(bx+1,by+3,bx+2,by);
    }
    ctx.closePath();
    ctx.clip();
    for(let ly=-r;ly<12;ly+=3){
      ctx.strokeStyle='rgba(255,255,255,0.1)';
      ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(-r,ly);ctx.lineTo(r,ly);ctx.stroke();
    }
    ctx.restore();
    // Eyes
    if(g.mode==='frightened'){
      // Scared face
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(-4,-3,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4,-3,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#09090b';
      ctx.beginPath();ctx.arc(-4,-3,0.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4,-3,0.8,0,Math.PI*2);ctx.fill();
      // Wavy mouth
      ctx.strokeStyle='#fff';ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=-3;i<=3;i+=1){ctx.lineTo(i,3+(i%2===0?2:-2));}
      ctx.stroke();
    }else{
      // Ghost eyes
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(-4,-3,3.5,4,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(4,-3,3.5,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#09090b';
      const lookX=g.dx*1.5,lookY=g.dy*1.5;
      ctx.beginPath();ctx.ellipse(-4+lookX,-3+lookY,1.8,2.2,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(4+lookX,-3+lookY,1.8,2.2,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

// ─── Game loop ─────────────────────────────────────────────────
function update(){
  if(game.state==='playing'){
    game.animTick++;
    movePlayer();
    moveGhosts();
    if(checkCollisions())return;
    checkWin();
  }
}

let lastTime=0;
function gameLoop(time){
  const dt=time-lastTime;
  if(dt>16){update();lastTime=time;}
  draw();
  requestAnimationFrame(gameLoop);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMaze();
  drawGhosts();
  if(game.state==='playing'||game.state==='dying')drawPlayer();
}

// ─── Controls ──────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(game.state!=='playing')return;
  switch(e.key){
    case 'ArrowUp':e.preventDefault();game.player.ndx=0;game.player.ndy=-1;break;
    case 'ArrowDown':e.preventDefault();game.player.ndx=0;game.player.ndy=1;break;
    case 'ArrowLeft':e.preventDefault();game.player.ndx=-1;game.player.ndy=0;break;
    case 'ArrowRight':e.preventDefault();game.player.ndx=1;game.player.ndy=0;break;
  }
});

// Mobile touch controls
['Up','Down','Left','Right'].forEach(dir=>{
  document.getElementById('btn'+dir).addEventListener('touchstart',e=>{
    e.preventDefault();
    if(game.state!=='playing')return;
    switch(dir){
      case 'Up':game.player.ndx=0;game.player.ndy=-1;break;
      case 'Down':game.player.ndx=0;game.player.ndy=1;break;
      case 'Left':game.player.ndx=-1;game.player.ndy=0;break;
      case 'Right':game.player.ndx=1;game.player.ndy=0;break;
    }
  });
  document.getElementById('btn'+dir).addEventListener('mousedown',e=>{
    e.preventDefault();
    if(game.state!=='playing')return;
    switch(dir){
      case 'Up':game.player.ndx=0;game.player.ndy=-1;break;
      case 'Down':game.player.ndx=0;game.player.ndy=1;break;
      case 'Left':game.player.ndx=-1;game.player.ndy=0;break;
      case 'Right':game.player.ndx=1;game.player.ndy=0;break;
    }
  });
});

// Swipe controls on canvas
let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{
  const t=e.touches[0];touchStartX=t.clientX;touchStartY=t.clientY;
},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(game.state!=='playing')return;
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  if(Math.abs(dx)>Math.abs(dy)){
    game.player.ndx=dx>0?1:-1;game.player.ndy=0;
  }else{
    game.player.ndx=0;game.player.ndy=dy>0?1:-1;
  }
},{passive:true});

// ─── Init ──────────────────────────────────────────────────────
showOverlay('menu');
gameLoop();
</script>
